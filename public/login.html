<!doctype html><html><head><meta charset='utf-8'><title>Login</title><link rel='stylesheet' href='/styles/site.css'></head><body><main><h1>Login</h1><form id='f'><input name='identity' placeholder='username or email' required><input name='password' type='password' placeholder='password' required><button>Login</button></form><pre id='out'></pre></main><script>
async function j(r){const t=await r.text();try{return t?JSON.parse(t):{ok:false,error:'Empty response body'};}catch{return{ok:false,error:'Invalid JSON response',raw:t};}}
document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const f=new FormData(e.target);const d=await j(await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('identity'),password:f.get('password')})}));document.getElementById('out').textContent=JSON.stringify(d,null,2)};
</script></body></html>
