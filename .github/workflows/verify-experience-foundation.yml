name: Verify Experience Foundation

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    if: github.head_ref == 'agent/dashboard-profile-experience-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright@1.55.0
      - name: TypeScript
        run: npm run typecheck
      - name: Browser script syntax
        run: |
          node --check public/dashboard-experience.js
          node --check public/profile-experience.js
          node --check public/profile-card-popover.js
          node --check .github/scripts/verify-experience-local.cjs
          node --check .github/scripts/verify-experience-hardening.cjs
      - name: Apply migrations locally
        run: npx wrangler d1 migrations apply grev-dad-dev --local
      - name: Install Chromium
        run: npx playwright install --with-deps chromium >/dev/null
      - name: Verify local application
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8787 > /tmp/grev-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill $WRANGLER_PID 2>/dev/null || true; cat /tmp/grev-wrangler.log' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null
          node .github/scripts/verify-experience-local.cjs
          node .github/scripts/verify-experience-hardening.cjs
