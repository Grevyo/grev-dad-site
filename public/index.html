<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grev</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/" aria-label="Grev home"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a>
      <nav id="authStatus" class="site-nav" aria-label="Site navigation">Checking login...</nav>
    </header>

    <main class="page-shell dashboard-page">
      <div class="dashboard-header-row">
        <h1>Home</h1>
        <button id="reset-dashboard-layout" type="button" class="nav-button">Reset layout</button>
      </div>

      <section class="dashboard-grid" id="dashboard-grid">
        <article class="dashboard-tile account-snapshot" data-tile-id="account-summary"><h2>Account Snapshot</h2><p id="summary-name">Loading…</p></article>
        <article class="dashboard-tile" data-tile-id="quick-actions"><h2>Quick Actions</h2><div class="quick-actions" id="quick-actions"></div></article>
        <article class="dashboard-tile" data-tile-id="profile-completion"><h2>Profile Completion</h2><p id="completion-percent">Loading…</p></article>
        <article class="dashboard-tile" data-tile-id="members-preview"><h2>Members Preview</h2><p id="members-preview-status">Loading members…</p></article>
        <article class="dashboard-tile" data-tile-id="chat"><h2>Global Chat</h2><div id="home-chat-list" class="chat-message-list">Loading…</div><div class="chat-input-row"><input id="home-chat-input" maxlength="1000" placeholder="Message global chat"/><button id="home-chat-send" type="button">Send</button></div><p id="home-chat-error" hidden>Chat unavailable.</p></article>
        <article class="dashboard-tile" data-tile-id="coming-later"><h2>Site Status / Coming Later</h2><ul><li>Profile customisation</li><li>Achievements</li><li>Account unlocks</li><li>Site activity</li></ul></article>
      </section>
    </main>

    <script src="/scripts/theme.js"></script>
    <script src="/scripts/auth-status.js"></script>
    <script>
      (function () {
        const ORDER_KEY = 'grev_dashboard_tile_order';
        const grid = document.getElementById('dashboard-grid');
        const reset = document.getElementById('reset-dashboard-layout');
        const defaultIds = Array.from(grid.querySelectorAll('[data-tile-id]')).map((n) => n.dataset.tileId);

        function applySavedOrder() {
          let saved = null;
          try { saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null'); } catch {}
          if (!Array.isArray(saved)) return;
          const map = new Map(Array.from(grid.children).map((n) => [n.dataset.tileId, n]));
          const ordered = [];
          saved.forEach((id) => { if (map.has(id)) ordered.push(map.get(id)); map.delete(id); });
          map.forEach((node) => ordered.push(node));
          ordered.forEach((node) => grid.append(node));
        }

        function saveOrder() {
          const ids = Array.from(grid.querySelectorAll('[data-tile-id]')).map((n) => n.dataset.tileId);
          localStorage.setItem(ORDER_KEY, JSON.stringify(ids));
        }

        function enableDrag() {
          Array.from(grid.querySelectorAll('.dashboard-tile')).forEach((tile) => {
            const handle = document.createElement('button');
            handle.type = 'button';
            handle.textContent = 'Drag';
            handle.className = 'tile-drag-handle';
            handle.draggable = true;
            tile.prepend(handle);
            tile.dataset.dragReady = '1';

            handle.addEventListener('dragstart', () => tile.classList.add('is-dragging'));
            handle.addEventListener('dragend', () => { tile.classList.remove('is-dragging'); saveOrder(); });
          });

          grid.addEventListener('dragover', (e) => {
            e.preventDefault();
            const dragging = grid.querySelector('.is-dragging');
            if (!dragging) return;
            const after = Array.from(grid.querySelectorAll('.dashboard-tile:not(.is-dragging)')).find((card) => {
              const r = card.getBoundingClientRect();
              return e.clientY < r.top + r.height / 2;
            });
            if (!after) grid.append(dragging); else grid.insertBefore(dragging, after);
          });
        }

        reset.addEventListener('click', function () {
          localStorage.removeItem(ORDER_KEY);
          defaultIds.forEach((id) => {
            const node = grid.querySelector(`[data-tile-id="${id}"]`);
            if (node) grid.append(node);
          });
        });

        function initials(name, username) { const src = (name || username || '').trim(); return src ? src.slice(0, 2).toUpperCase() : '?'; }
        function msgNode(m) {
          const row = document.createElement('div'); row.className = 'chat-message';
          const avatar = document.createElement('div'); avatar.className = 'chat-message-avatar';
          if (m.sender_avatar_url) { const i = document.createElement('img'); i.src = m.sender_avatar_url; i.alt = 'avatar'; avatar.append(i); } else avatar.textContent = initials(m.sender_display_name, m.sender_username);
          const content = document.createElement('div');
          const meta = document.createElement('div'); meta.className = 'chat-message-meta'; meta.textContent = `${m.sender_display_name || m.sender_username} · Lv. ${Number(m.sender_accountLevel) || 1} · ${m.sender_rank?.name || 'Unranked'} · ${new Date(m.created_at).toLocaleTimeString()}`;
          const body = document.createElement('div'); body.className = 'chat-message-body'; body.textContent = m.body || '';
          content.append(meta, body); row.append(avatar, content); return row;
        }

        async function initChat() {
          const list = document.getElementById('home-chat-list'); const input = document.getElementById('home-chat-input'); const send = document.getElementById('home-chat-send'); const err = document.getElementById('home-chat-error');
          let roomId = null; let timer = null;
          async function j(url, opts) { const r = await fetch(url, opts); const d = await r.json(); if (!r.ok || !d.ok) throw new Error(d.error || 'failed'); return d; }
          async function refresh() {
            try {
              const rooms = await j('/api/chat/rooms');
              const g = (rooms.rooms || []).find((r) => r.room_key === 'global');
              if (!g) throw new Error('missing global'); roomId = g.id;
              const msgs = await j(`/api/chat/messages?room_id=${roomId}`);
              list.textContent = '';
              (msgs.messages || []).slice(-20).forEach((m) => list.append(msgNode(m)));
              err.hidden = true;
            } catch {
              list.textContent = 'Chat unavailable.';
              err.hidden = false;
            }
          }
          send.addEventListener('click', async function () { const body = (input.value || '').trim(); if (!body || !roomId) return; try { await j('/api/chat/messages', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room_id: roomId, body }) }); input.value = ''; await refresh(); } catch { err.hidden = false; } });
          await refresh();
          if (timer) clearInterval(timer); timer = setInterval(refresh, 5000);
        }

        applySavedOrder();
        enableDrag();
        initChat();
      })();
    </script>
  </body>
</html>
