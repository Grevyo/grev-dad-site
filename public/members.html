<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Members</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main>
  <h1>Members</h1>
  <p id="members-status">Loading...</p>
  <input id="member-search" placeholder="Search username" aria-label="Search members by username" />
  <div id="members-grid" class="members-profile-card-grid" aria-label="Member Profile Cards"></div>
</main>
<script src="/scripts/level-badge.js"></script>
<script src="/scripts/player-card.js"></script>
<script src="/scripts/api-cache.js"></script>
<script>
let all=[];
let drawToken=0;
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function profileHref(user){return `/profile.html?id=${encodeURIComponent(Number(user?.id)||0)}`;}
function loadScriptOnce(src){return new Promise((resolve,reject)=>{if(document.querySelector(`script[src="${src}"]`)){resolve();return;}const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
async function ensureProfileCardRenderer(){if(window.renderPlayerCard)return true;try{await loadScriptOnce('/scripts/player-card.js');}catch(error){console.error('[members] Profile Card renderer load failed',error);}return !!window.renderPlayerCard;}
function fallbackMemberCard(member){const name=escapeHtml(member.display_name||member.username||'Member');const username=escapeHtml(member.username||'');const avatar=member.avatar_url?`<img src="${escapeHtml(member.avatar_url)}" alt="" loading="lazy" />`:'';const rank=escapeHtml(member.rank||member.displayedRank||'');return `<article class="profile-card-fallback"><div class="profile-card-fallback-avatar">${avatar}</div><div><strong>${name}</strong><div>@${username}</div><div>Level ${Number(member.accountLevel)||1}${rank?` · ${rank}`:''}</div><span>View Profile</span></div></article>`;}
function renderMemberCard(member){let cardHtml='';try{if(!window.renderPlayerCard)throw new Error('Profile Card renderer unavailable');cardHtml=window.renderPlayerCard(member,{variant:'snapshot',showXp:true,showUserId:false,useCardSettings:true,respectConfiguredTiles:false,tileSize:'4x1'});}catch(error){console.error('[members] Profile Card render failed',error);cardHtml=fallbackMemberCard(member);}return `<a class="member-profile-card-link member-profile-card-frame" href="${profileHref(member)}" aria-label="View Profile for ${escapeHtml(member.display_name||member.username||'member')}"><div class="member-profile-card-shell">${cardHtml}</div></a>`;}
function getFilteredMembers(){const q=(document.getElementById('member-search')?.value||'').toLowerCase();return all.filter((m)=>!q||String(m.username||'').toLowerCase().includes(q)||String(m.display_name||'').toLowerCase().includes(q));}
function draw(){const gridEl=document.getElementById('members-grid');const rows=getFilteredMembers();const token=++drawToken;gridEl.innerHTML='';let i=0;function batch(){if(token!==drawToken)return;const chunk=rows.slice(i,i+12);gridEl.insertAdjacentHTML('beforeend',chunk.map(renderMemberCard).join(''));i+=chunk.length;if(i<rows.length)requestAnimationFrame(batch);}requestAnimationFrame(batch);}
(async()=>{const statusEl=document.getElementById('members-status');try{await ensureProfileCardRenderer();const r=await fetch('/api/members');const raw=await r.text();let d=null;try{d=raw?JSON.parse(raw):null;}catch{d=null;}if(r.status===401){location.href='/unregistered.html';return;}if(!r.ok){statusEl.textContent=(d&&d.error)||'Members unavailable.';return;}all=(d&&d.members)||[];draw();statusEl.textContent=`Loaded ${all.length} Profile Cards.`;document.getElementById('member-search').addEventListener('input',draw);}catch(error){console.error('[members] load failed',error);statusEl.textContent='Members unavailable.';}})();
</script>
<script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script>
</body>
</html>
