name: Verify Profile Popup Tuning

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

jobs:
  verify:
    if: github.head_ref == 'agent/profile-popup-mobile-focus-desktop-size'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
      VERIFY_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Measure popup behaviour
        run: |
          cat > /tmp/measure-profile-popup.cjs <<'NODE'
          const { chromium } = require('playwright');
          const base = 'https://pbe.grev.dad';
          const raw = `https://raw.githubusercontent.com/Grevyo/grev-dad-site/${process.env.VERIFY_REF}/public`;

          (async () => {
            const [js, css] = await Promise.all([
              fetch(`${raw}/profile-editor-unified.js`).then(r => r.text()),
              fetch(`${raw}/profile-editor-unified.css`).then(r => r.text())
            ]);
            console.log(JSON.stringify({
              autoFocusPresent: js.includes("?.focus({ preventScroll: true })"),
              largeWidthPresent: css.includes('width:min(1320px,calc(100vw - 48px))'),
              largeHeightPresent: css.includes('height:min(940px,calc(var(--profile-visible-height,100dvh) - 40px))')
            }));

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            const page = await context.newPage();
            page.setDefaultTimeout(15000);
            try {
              const login = await context.request.post(`${base}/api/auth/login`, {
                data: { identifier: 'LADMIN', password: process.env.LADMIN_BOOTSTRAP_PASSWORD, rememberMe: false }
              });
              const profileId = (await (await context.request.get(`${base}/api/auth/session`)).json()).user.id;
              await page.route('**/profile-editor-unified.js', route => route.fulfill({ status: 200, contentType: 'application/javascript', body: js }));
              await page.route('**/profile-editor-unified.css', route => route.fulfill({ status: 200, contentType: 'text/css', body: css }));
              await page.goto(`${base}/profile/${encodeURIComponent(profileId)}`, { waitUntil: 'networkidle' });
              await page.locator('#profile-edit').click();
              const popup = page.locator('#profile-unified-editor');
              await popup.waitFor({ state: 'visible' });
              await page.waitForTimeout(200);
              const mobile = await popup.evaluate(dialog => {
                const body = dialog.querySelector('.profile-unified-body');
                const active = document.activeElement;
                const rect = dialog.getBoundingClientRect();
                return {
                  activeTag: active?.tagName || null,
                  activeId: active?.id || null,
                  inputFocused: Boolean(active?.matches?.('input,textarea,select')),
                  bodyScrollTop: body?.scrollTop ?? -1,
                  width: rect.width,
                  height: rect.height
                };
              });
              console.log(`MOBILE ${JSON.stringify(mobile)}`);
              await popup.locator('#profile-cancel').click();

              await page.setViewportSize({ width: 1440, height: 900 });
              await page.reload({ waitUntil: 'networkidle' });
              await page.locator('#profile-edit').click();
              await popup.waitFor({ state: 'visible' });
              const desktop = await popup.evaluate(dialog => {
                const rect = dialog.getBoundingClientRect();
                return { width: rect.width, height: rect.height, left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom };
              });
              console.log(`DESKTOP ${JSON.stringify(desktop)}`);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE
          timeout --signal=INT 180s node /tmp/measure-profile-popup.cjs
