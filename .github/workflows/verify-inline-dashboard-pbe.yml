name: Verify Inline Dashboard PBE

on:
  pull_request:
    branches:
      - pbe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Authenticate to deployed PBE
        shell: bash
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({identifier:"LADMIN",password:process.env.LADMIN_BOOTSTRAP_PASSWORD,rememberMe:false}))')
          for attempt in {1..24}; do
            status=$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --cookie-jar /tmp/cookies --request POST --header 'Content-Type: application/json' --data "$payload" https://pbe.grev.dad/api/auth/login || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 5
          done
          cat /tmp/login.json || true
          exit 1

      - name: Verify deployed inline editor
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            page_status=$(curl --silent --show-error --output /tmp/dashboard.html --write-out '%{http_code}' --cookie /tmp/cookies https://pbe.grev.dad/dashboard || true)
            curl --silent --show-error --output /tmp/dashboard.js https://pbe.grev.dad/dashboard.js || true
            curl --silent --show-error --output /tmp/dashboard.css https://pbe.grev.dad/dashboard.css || true
            if [ "$page_status" = "200" ] \
              && grep -q 'id="dashboard-editor-toolbar"' /tmp/dashboard.html \
              && grep -q 'id="dashboard-workspace"' /tmp/dashboard.html \
              && ! grep -q 'id="dashboard-customizer"' /tmp/dashboard.html \
              && grep -q 'function openEditor' /tmp/dashboard.js \
              && grep -q 'dashboard-tile-select' /tmp/dashboard.js \
              && grep -q 'isSingleColumnFallback' /tmp/dashboard.js \
              && grep -q 'container-type:size' /tmp/dashboard.css \
              && grep -q 'dashboard-grid.compact .dashboard-tile.editing' /tmp/dashboard.css; then
              break
            fi
            sleep 5
          done
          test "$page_status" = "200"
          grep -q 'id="dashboard-editor-toolbar"' /tmp/dashboard.html
          grep -q 'id="dashboard-editor-catalogue-panel"' /tmp/dashboard.html
          ! grep -q 'id="dashboard-customizer"' /tmp/dashboard.html
          grep -q 'function openEditor' /tmp/dashboard.js
          grep -q 'dashboard-tile-select' /tmp/dashboard.js
          grep -q 'isSingleColumnFallback' /tmp/dashboard.js
          grep -q 'container-type:size' /tmp/dashboard.css
          grep -q 'dashboard-tile-body{.*overflow:auto' /tmp/dashboard.css
          grep -q 'dashboard-grid.compact .dashboard-tile.editing' /tmp/dashboard.css
          printf 'Inline dashboard editor, adaptive tile content and mobile fallback are deployed.\n'
