name: Verify Standard Tile Icon Customization

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize
      - reopened

jobs:
  verify:
    if: github.head_ref == 'agent/standard-tile-icon-customization'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: |
          npm install --package-lock=false --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify browser editor
        run: |
          python3 -m http.server 8000 --directory public >standard-icon-artifacts-static.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/dashboard.html >/dev/null && break
            sleep 1
          done
          mkdir -p standard-icon-artifacts
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const tinyPng = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII=', 'base64');
          const appearance = {
            backgroundType:'solid',backgroundPrimary:'#11161d',backgroundSecondary:'#5268aa',backgroundAngle:135,backgroundMedia:null,
            textColour:'#f4f7fb',fontFamily:'system',borderColour:'#394657',contentMode:'standard',customTitle:null,customIcon:null,
            mediaFit:'cover',mediaOverlay:'dark',iconMode:'text',iconLabel:null,iconMedia:null,iconTextColour:'#090b0f',
            iconBackgroundColour:'#f3f5f8',iconBorderColour:'#667181',iconMediaFit:'cover'
          };
          const base = {
            category:'Test',featureType:'link',presentation:'action',route:'/profile',iconText:'GD',audience:'all',defaultDimension:'2x1',
            defaultWidth:2,defaultHeight:1,allowedDimensions:['1x1','2x1','2x2'],isActive:true,isDefault:true,tileColour:'default',accessGroups:[],...appearance
          };
          const tiles = [
            {...base,id:'tile-action',slug:'action',name:'Action tile',description:'Action',sortOrder:1,pinned:true,x:0,y:0,width:2,height:1},
            {...base,id:'tile-content',slug:'content',name:'Content tile',description:'Information',sortOrder:2,pinned:true,x:2,y:0,width:2,height:2,presentation:'content',featureType:'workspace',route:'/feature/content',iconText:'IN',iconMode:'image',iconMedia:'data:image/png;base64,'+tinyPng.toString('base64'),iconMediaFit:'contain',iconBackgroundColour:'#123456',iconBorderColour:'#abcdef'}
          ];
          const payload = {ok:true,viewer:{id:'u1',username:'iconuser',displayName:'Icon User',isAdmin:false,isOwner:false},grid:{columns:8,dimensions:['1x1','2x1','2x2']},features:tiles.map(t=>({...t,iconMedia:null,hasIconMedia:Boolean(t.iconMedia),backgroundMedia:null,hasBackgroundMedia:false})),pinnedTiles:tiles,preferences:{density:'comfortable',showDescriptions:true,tileGap:12,outerMargin:0},capabilities:{canCustomize:true,isAdmin:false,isOwner:false}};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.route('**/api/onboarding',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,progress:{relationshipComplete:true,intentionsComplete:true}})}));
              await page.route('**/api/dashboard',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(payload)}));
              await page.route('**/api/auth/session',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({authenticated:true,user:{id:'u1',username:'iconuser',displayName:'Icon User',isOwner:false,isAdmin:false,isVerified:true}})}));
              await page.route('**/api/bootstrap/owner-status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ownerConfigured:true,eligible:false})}));
              await page.goto('http://127.0.0.1:8000/dashboard.html',{waitUntil:'networkidle'});
              await page.waitForSelector('[data-feature-id="tile-action"] .dashboard-standard-icon');
              const initialImage = page.locator('[data-feature-id="tile-content"] .dashboard-standard-icon img');
              assert.equal(await initialImage.count(),1);
              assert.equal(await initialImage.evaluate(img=>getComputedStyle(img).objectFit),'contain');

              await page.click('#customize-dashboard');
              await page.locator('[data-feature-id="tile-action"] .dashboard-tile-settings').click();
              await page.waitForSelector('#dashboard-tile-settings-dialog[open]');
              assert.equal(await page.locator('#dashboard-standard-icon-controls').isVisible(),true);
              assert.equal(await page.locator('#dashboard-custom-content-controls').isVisible(),false);
              await page.fill('#dashboard-icon-label','ZX');
              const setColour = async (selector,value) => page.locator(selector).evaluate((input,value)=>{input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));},value);
              await setColour('#dashboard-icon-text-colour','#ffffff');
              await setColour('#dashboard-icon-background-colour','#123456');
              await setColour('#dashboard-icon-border-colour','#abcdef');
              const edited = await page.locator('[data-feature-id="tile-action"] .dashboard-standard-icon').evaluate(icon=>({text:icon.textContent,colour:getComputedStyle(icon).color,background:getComputedStyle(icon).backgroundColor,border:getComputedStyle(icon).borderColor}));
              assert.equal(edited.text,'ZX');
              assert.equal(edited.colour,'rgb(255, 255, 255)');
              assert.equal(edited.background,'rgb(18, 52, 86)');
              assert.equal(edited.border,'rgb(171, 205, 239)');

              await page.selectOption('#dashboard-icon-mode','image');
              assert.equal(await page.locator('#dashboard-icon-media-controls').isVisible(),true);
              assert.equal(await page.locator('#dashboard-icon-label-control').isVisible(),false);
              await page.setInputFiles('#dashboard-icon-media',{name:'icon.png',mimeType:'image/png',buffer:tinyPng});
              await page.selectOption('#dashboard-icon-media-fit','contain');
              const uploaded = page.locator('[data-feature-id="tile-action"] .dashboard-standard-icon img');
              await uploaded.waitFor();
              assert.equal(await uploaded.evaluate(img=>getComputedStyle(img).objectFit),'contain');
              await page.click('#dashboard-remove-icon-media');
              assert.equal(await page.locator('[data-feature-id="tile-action"] .dashboard-standard-icon img').count(),0);
              assert.equal(await page.locator('[data-feature-id="tile-action"] .dashboard-standard-icon').textContent(),'ZX');

              await page.click('#dashboard-reset-icon');
              const reset = await page.locator('[data-feature-id="tile-action"] .dashboard-standard-icon').evaluate(icon=>({text:icon.textContent,background:getComputedStyle(icon).backgroundColor,border:getComputedStyle(icon).borderColor}));
              assert.equal(reset.text,'GD');
              assert.equal(reset.background,'rgb(243, 245, 248)');
              assert.equal(reset.border,'rgb(102, 113, 129)');

              await page.selectOption('#dashboard-content-mode','media-button');
              assert.equal(await page.locator('#dashboard-standard-icon-controls').isVisible(),false);
              assert.equal(await page.locator('#dashboard-custom-content-controls').isVisible(),true);
              await page.selectOption('#dashboard-content-mode','standard');
              assert.equal(await page.locator('#dashboard-standard-icon-controls').isVisible(),true);

              const dialogBox=await page.locator('#dashboard-tile-settings-dialog').boundingBox();
              assert.ok(dialogBox && dialogBox.x>=0 && dialogBox.x+dialogBox.width<=390.5,JSON.stringify(dialogBox));
              assert.ok(dialogBox && dialogBox.y>=0 && dialogBox.y+dialogBox.height<=844.5,JSON.stringify(dialogBox));
              const overflow=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth}));
              assert.ok(overflow.scrollWidth<=overflow.viewport,JSON.stringify(overflow));
              await page.screenshot({path:'standard-icon-artifacts/standard-icon-settings-mobile.png',fullPage:true});
            } finally {
              await browser.close();
            }
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Apply local migrations
        run: npx wrangler d1 migrations apply grev-dad-preview --local --env pbe
      - name: Start local Worker
        run: |
          npx wrangler dev --local --env pbe --port 8789 >standard-icon-artifacts-worker.log 2>&1 &
          echo $! >standard-icon-artifacts-worker.pid
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8789/ >/dev/null && exit 0
            sleep 1
          done
          cat standard-icon-artifacts-worker.log
          exit 1
      - name: Verify D1 persistence and validation
        run: |
          set -euo pipefail
          curl -fsS -c /tmp/icon.cookies -H 'Content-Type: application/json' -d '{"username":"iconroundtrip","displayName":"Icon Round Trip","email":"iconroundtrip@example.test","password":"Test.Password1"}' http://127.0.0.1:8789/api/auth/signup >/tmp/signup.json
          curl -fsS -b /tmp/icon.cookies http://127.0.0.1:8789/api/onboarding >/tmp/onboarding.json
          node <<'NODE'
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync('/tmp/onboarding.json','utf8'));
          fs.writeFileSync('/tmp/relationship.json',JSON.stringify({relationshipId:state.relationships[0].id}));
          fs.writeFileSync('/tmp/intentions.json',JSON.stringify({intentionIds:[state.intentions[0].id]}));
          NODE
          curl -fsS -b /tmp/icon.cookies -H 'Content-Type: application/json' --data-binary @/tmp/relationship.json http://127.0.0.1:8789/api/onboarding/relationship >/tmp/relationship-response.json
          curl -fsS -b /tmp/icon.cookies -H 'Content-Type: application/json' --data-binary @/tmp/intentions.json http://127.0.0.1:8789/api/onboarding/intentions >/tmp/intentions-response.json
          curl -fsS -b /tmp/icon.cookies http://127.0.0.1:8789/api/dashboard >/tmp/dashboard-before.json
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/dashboard-before.json','utf8'));
          if(!payload.pinnedTiles?.length) throw new Error('No default pinned tile available for round-trip test.');
          const source=payload.pinnedTiles[0];
          const base={featureId:source.id,x:0,y:0,width:source.width,height:source.height,colour:source.tileColour??'default',backgroundType:'solid',backgroundPrimary:'#11161d',backgroundSecondary:'#5268aa',backgroundAngle:135,backgroundMedia:null,textColour:'#f4f7fb',fontFamily:'system',borderColour:'#394657',contentMode:'standard',customTitle:null,customIcon:null,mediaFit:'cover',mediaOverlay:'dark',iconMode:'text',iconLabel:'ZX',iconMedia:null,iconTextColour:'#ffffff',iconBackgroundColour:'#123456',iconBorderColour:'#abcdef',iconMediaFit:'cover'};
          fs.writeFileSync('/tmp/text-layout.json',JSON.stringify({tiles:[base],preferences:{density:'comfortable',showDescriptions:true,tileGap:12,outerMargin:0}}));
          fs.writeFileSync('/tmp/invalid-image-layout.json',JSON.stringify({tiles:[{...base,iconMode:'image',iconMedia:null}],preferences:{density:'comfortable',showDescriptions:true,tileGap:12,outerMargin:0}}));
          const png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII=';
          fs.writeFileSync('/tmp/image-layout.json',JSON.stringify({tiles:[{...base,iconMode:'image',iconMedia:png,iconMediaFit:'contain'}],preferences:{density:'comfortable',showDescriptions:true,tileGap:12,outerMargin:0}}));
          NODE
          curl -fsS -b /tmp/icon.cookies -H 'Content-Type: application/json' --data-binary @/tmp/text-layout.json http://127.0.0.1:8789/api/dashboard/layout >/tmp/text-save.json
          curl -fsS -b /tmp/icon.cookies http://127.0.0.1:8789/api/dashboard >/tmp/text-reload.json
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/text-reload.json','utf8'));
          const tile=payload.pinnedTiles[0];
          if(tile.iconMode!=='text'||tile.iconLabel!=='ZX'||tile.iconTextColour!=='#ffffff'||tile.iconBackgroundColour!=='#123456'||tile.iconBorderColour!=='#abcdef') throw new Error('Text icon did not persist: '+JSON.stringify(tile));
          NODE
          invalid_status=$(curl -sS -o standard-icon-artifacts/invalid-image-response.json -w '%{http_code}' -b /tmp/icon.cookies -H 'Content-Type: application/json' --data-binary @/tmp/invalid-image-layout.json http://127.0.0.1:8789/api/dashboard/layout)
          test "$invalid_status" = 400
          curl -fsS -b /tmp/icon.cookies -H 'Content-Type: application/json' --data-binary @/tmp/image-layout.json http://127.0.0.1:8789/api/dashboard/layout >/tmp/image-save.json
          curl -fsS -b /tmp/icon.cookies http://127.0.0.1:8789/api/dashboard >/tmp/image-reload.json
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/image-reload.json','utf8'));
          const tile=payload.pinnedTiles[0];
          const feature=payload.features.find(item=>item.id===tile.id);
          if(tile.iconMode!=='image'||!tile.iconMedia?.startsWith('data:image/png;base64,')||tile.iconMediaFit!=='contain') throw new Error('Image icon did not persist: '+JSON.stringify(tile));
          if(feature.iconMedia!==null||feature.hasIconMedia!==true) throw new Error('Catalogue icon media was not safely summarized: '+JSON.stringify(feature));
          NODE
      - name: Final source checks
        run: |
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-tile-icon-verification
          path: |
            standard-icon-artifacts
            standard-icon-artifacts-static.log
            standard-icon-artifacts-worker.log
          if-no-files-found: warn
