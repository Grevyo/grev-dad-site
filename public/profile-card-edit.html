<!doctype html>
<html>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Profile Card Editor</title>
  <link rel='stylesheet' href='/styles.css'>
</head>
<body class='profile-card-editor-page'>
<header class='site-header'><a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a><nav id='authStatus' class='site-nav'>Checking login...</nav></header>
<main>
  <h1>Profile Card Editor</h1>
  <p id='card-status'>Loading...</p>
  <div class='profile-card-editor-grid'>
    <section class='profile-card-preview'>
      <h2>Card Preview</h2>
      <div id='card-preview' class='profile-card-preview-frame'></div>
    </section>
    <section class='card-display-options'>
      <h2>Display Tiles</h2>
      <div class='tile-settings-toolbar'>
        <button type='button' id='toggle-all-settings' class='button-secondary'>Expand all</button>
      </div>
      <div id='tile-settings' class='tile-settings-list'></div>
      <p class='form-help'>Steam and Leetify links: Link comes from Edit Full Profile.</p>
    </section>
  </div>
  <button id='save-card' class='nav-button'>Save Profile Card</button>
</main>
<script src='/scripts/player-card.js'></script>
<script>
const toggles=['card_show_display_name','card_show_username','card_show_role','card_show_level','card_show_rank','card_show_xp','card_show_status','card_show_steam','card_show_leetify'];
const meta=[['name','Display Name','card_show_display_name'],['username','Username','card_show_username'],['role','Role','card_show_role'],['level','Level','card_show_level'],['rank','Rank','card_show_rank'],['xp','XP','card_show_xp'],['status','Status Message','card_show_status'],['steam','Steam Link','card_show_steam'],['leetify','Leetify Link','card_show_leetify']];
const tileDefaultOrder={name:10,username:20,role:30,level:40,rank:50,xp:60,status:70,steam:80,leetify:90};
const defaults={name:{span:'2x1',fontStyle:'bold',fontFamily:'default',size:'lg',align:'left',colour:'',order:10},username:{span:'1x1',fontStyle:'normal',fontFamily:'default',size:'sm',align:'left',colour:'',order:20},role:{span:'1x1',fontStyle:'normal',fontFamily:'default',size:'sm',align:'left',colour:'',order:30},level:{span:'1x1',fontStyle:'normal',fontFamily:'default',size:'md',align:'center',colour:'',order:40},rank:{span:'1x1',fontStyle:'bold',fontFamily:'default',size:'sm',align:'left',colour:'',order:50},xp:{span:'2x1',fontStyle:'normal',fontFamily:'default',size:'sm',align:'left',colour:'',order:60},status:{span:'2x1',fontStyle:'italic',fontFamily:'default',size:'sm',align:'left',colour:'',order:70},steam:{span:'1x1',fontStyle:'bold',fontFamily:'default',size:'sm',align:'center',colour:'',order:80},leetify:{span:'1x1',fontStyle:'bold',fontFamily:'default',size:'sm',align:'center',colour:'',order:90}};
let profile={cardTileSettings:{...defaults}};
let expandedSettings=new Set();
function normalizeTileOrder(settings){getOrderedTileKeys(settings).forEach((key,index)=>{settings[key]=settings[key]||{};settings[key].order=(index+1)*10;});}
function getOrderedTileKeys(settings){return meta.map(([key])=>key).sort((a,b)=>{const ao=Number(settings?.[a]?.order);const bo=Number(settings?.[b]?.order);const ar=Number.isInteger(ao)&&ao>0?ao:tileDefaultOrder[a];const br=Number.isInteger(bo)&&bo>0?bo:tileDefaultOrder[b];return ar-br||tileDefaultOrder[a]-tileDefaultOrder[b];});}
function draw(){document.getElementById('card-preview').innerHTML=window.renderPlayerCard(profile,{useCardSettings:true,variant:'full'});}
function renderPanels(){
  const host=document.getElementById('tile-settings');
  const ordered=getOrderedTileKeys(profile.cardTileSettings);
  host.innerHTML=ordered.map((k,index)=>{const m=meta.find((x)=>x[0]===k);const [_,label,toggle]=m;const enabled=Number(profile[toggle]??1)===1;const open=expandedSettings.has(k);return `<div class='display-tile-row ${enabled?'':'is-disabled'}' data-key='${k}'><div class='display-tile-top'><label class='display-tile-toggle'><input type='checkbox' name='${toggle}' ${enabled?'checked':''}/> ${label}</label><div class='display-tile-actions'><button type='button' class='button-secondary button-move' data-move='up' data-key='${k}' ${index===0?'disabled':''}>↑</button><button type='button' class='button-secondary button-move' data-move='down' data-key='${k}' ${index===ordered.length-1?'disabled':''}>↓</button><button type='button' class='button-secondary' data-settings='${k}' ${enabled?'':'disabled'}>${open?'Hide settings':'Settings'}</button></div></div><div class='display-tile-help'>Move: Changes where this tile appears on your player card.</div><div class='profile-card-setting-grid ${(enabled&&open)?'':'is-hidden'}' data-panel='${k}'><label>Tile size<select data-k='${k}' data-p='span'><option>1x1</option><option>2x1</option><option>1x2</option><option>2x2</option></select></label><label>Colour<input type='color' data-k='${k}' data-p='colour' value='${profile.cardTileSettings[k].colour||'#ffffff'}'></label><label>Font style<select data-k='${k}' data-p='fontStyle'><option>normal</option><option>bold</option><option>italic</option><option>bold_italic</option><option>mono</option></select><span class='form-help'>Bold, italic, mono styling.</span></label><label>Font<select data-k='${k}' data-p='fontFamily'><option>default</option><option>system</option><option>serif</option><option>mono</option><option>condensed</option><option>wide</option><option>display</option></select><span class='form-help'>Choose the font family style for this tile.</span></label><label>Text size<select data-k='${k}' data-p='size'><option>xs</option><option>sm</option><option>md</option><option>lg</option><option>xl</option></select></label><label>Alignment<select data-k='${k}' data-p='align'><option>left</option><option>center</option><option>right</option></select></label></div></div>`;
  }).join('');
  meta.forEach(([k])=>{['span','fontStyle','fontFamily','size','align'].forEach((p)=>{const el=host.querySelector(`[data-k='${k}'][data-p='${p}']`);if(el)el.value=profile.cardTileSettings[k][p]||defaults[k][p];});});
  const allExpanded=meta.every(([k])=>expandedSettings.has(k));
  document.getElementById('toggle-all-settings').textContent=allExpanded?'Collapse all':'Expand all';
}
async function fetchJsonSafe(url, options = {}) { const response = await fetch(url, { credentials: 'same-origin', ...options }); const data = await response.json(); if (!response.ok || !data || data.ok === false) throw new Error(data?.error || `Request failed: ${response.status}`); return data; }
(async()=>{const d=await fetchJsonSafe('/api/profile/me'); profile={...(d.profile||{})}; profile.cardTileSettings={...defaults,...(d.profile?.cardTileSettings||{})}; normalizeTileOrder(profile.cardTileSettings); renderPanels(); draw(); document.getElementById('card-status').textContent='Loaded.';})();
document.body.addEventListener('input',(e)=>{const n=e.target.name;if(n&&toggles.includes(n)){profile[n]=e.target.checked?1:0;renderPanels();} if(e.target.dataset.k){profile.cardTileSettings[e.target.dataset.k][e.target.dataset.p]=e.target.value;} draw();});
document.body.addEventListener('click',(e)=>{const settingsKey=e.target.dataset.settings;if(settingsKey){if(expandedSettings.has(settingsKey))expandedSettings.delete(settingsKey);else expandedSettings.add(settingsKey);renderPanels();return;}const dir=e.target.dataset.move;const moveKey=e.target.dataset.key;if(dir&&moveKey){const keys=getOrderedTileKeys(profile.cardTileSettings);const idx=keys.indexOf(moveKey);const target=dir==='up'?idx-1:idx+1;if(target>=0&&target<keys.length){[keys[idx],keys[target]]=[keys[target],keys[idx]];keys.forEach((key,i)=>{profile.cardTileSettings[key]=profile.cardTileSettings[key]||{};profile.cardTileSettings[key].order=(i+1)*10;});renderPanels();draw();}return;}});
document.getElementById('toggle-all-settings').addEventListener('click',()=>{const allExpanded=meta.every(([k])=>expandedSettings.has(k));expandedSettings=allExpanded?new Set():new Set(meta.map(([k])=>k));renderPanels();});
document.getElementById('save-card').onclick=async()=>{const body={card_layout:profile.card_layout||'standard'}; toggles.forEach(k=>body[k]=Number(profile[k]??1)); normalizeTileOrder(profile.cardTileSettings); body.cardTileSettings=profile.cardTileSettings; const d=await fetchJsonSafe('/api/profile/me/card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); profile=d.profile||profile; profile.cardTileSettings={...defaults,...(profile.cardTileSettings||{})}; normalizeTileOrder(profile.cardTileSettings); renderPanels(); draw(); document.getElementById('card-status').textContent='Profile card saved.';};
</script><script src='/scripts/theme.js'></script><script src='/scripts/auth-status.js'></script>
</body>
</html>
