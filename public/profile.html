<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Profile</title><link rel="stylesheet" href="/styles.css" /><style>
.profile-page-custom-shell{position:relative;padding:12px;border-radius:14px;overflow:hidden}.profile-page-custom-shell::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,var(--profile-overlay,0.2));pointer-events:none}.profile-page-custom-shell>*{position:relative;z-index:1}
.profile-page-board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:95px;gap:10px;max-width:1100px;margin:0 auto}
.profile-page-tile{background:rgba(16,16,20,.82);border:1px solid #2b2f38;border-radius:12px;padding:10px;position:relative;overflow:auto}.profile-page-tile h3{margin:0 0 6px}
.profile-page-edit-controls{position:absolute;top:6px;right:6px;display:none;gap:4px}.profile-page-editing .profile-page-edit-controls{display:flex}
.profile-layout-panel{margin:12px auto;max-width:1100px;padding:10px;border:1px solid #2b2f38;border-radius:10px;background:#111a}.profile-layout-panel[hidden]{display:none}
@media (max-width:800px){.profile-page-board{grid-template-columns:1fr}.profile-page-tile{grid-column:1!important;grid-row:auto!important}}
</style></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main><h1>Profile Page</h1><p id="profile-status">Loading...</p><div id="profile-toolbar"></div><div id="profile-view"></div></main>
<script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script><script>
let meId=null,currentProfile=null,profileEditMode=false;
const DEFAULT_PROFILE_PAGE_LAYOUT={widgets:{'profile-card':{col:1,row:1,size:'4x2',enabled:true},bio:{col:1,row:3,size:'4x2',enabled:true},status:{col:1,row:5,size:'2x1',enabled:true},steam:{col:5,row:1,size:'2x2',enabled:true},leetify:{col:7,row:1,size:'2x2',enabled:true},showcase:{col:5,row:3,size:'4x2',enabled:true},links:{col:7,row:5,size:'2x1',enabled:true},progress:{col:5,row:5,size:'2x2',enabled:true}}};
const ALLOWED_SIZES=new Set(['2x1','2x2','4x1','4x2','4x3','4x4','6x2','6x4']);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function safeBackgroundSize(v){return ['cover','contain','repeat','stretch','center'].includes(String(v))?v:'cover';}
function parseProfileWidgetSize(size){const [w,h]=String(size||'2x2').split('x').map(Number);return {w:w||2,h:h||2};}
function parseProfileLayout(raw){try{const parsed=raw?JSON.parse(raw):{};const out=JSON.parse(JSON.stringify(DEFAULT_PROFILE_PAGE_LAYOUT));for(const [k,v] of Object.entries(parsed.widgets||{})){if(!out.widgets[k]||!v)continue;if(Number.isInteger(v.col)&&v.col>0)out.widgets[k].col=v.col;if(Number.isInteger(v.row)&&v.row>0)out.widgets[k].row=v.row;if(ALLOWED_SIZES.has(v.size))out.widgets[k].size=v.size;if(typeof v.enabled==='boolean')out.widgets[k].enabled=v.enabled;}return out;}catch{return JSON.parse(JSON.stringify(DEFAULT_PROFILE_PAGE_LAYOUT));}}
function widgetEnabledByData(id,p){if(id==='bio')return !!(p.bio||p.location||p.website_url);if(id==='status')return !!p.status_message;if(id==='steam')return !!p.steam_url;if(id==='leetify')return !!p.leetify_url;if(id==='showcase')return Array.isArray(p.showcase)&&p.showcase.some(s=>s?.unlock);if(id==='links')return !!(p.website_url||p.steam_url||p.leetify_url);return true;}
function createWidget(id,p){if(id==='profile-card'){let card='<div>Profile Card unavailable.</div>';try{card=window.renderPlayerCard?window.renderPlayerCard({...p},{variant:'full',showXp:true,useCardSettings:true,link:false}):card;}catch{}return `<div class='profile-widget-card'>${card}</div>`;}
if(id==='bio')return `<div class='profile-widget-bio'><h3>Bio</h3><div>${esc(p.profile_title||'')}</div><div>${esc(p.location||'')}</div><p>${esc(p.bio||'No bio set.')}</p></div>`;
if(id==='status')return `<div class='profile-widget-status'><h3>Status</h3><div>${esc(p.status_message||'No status set.')}</div></div>`;
if(id==='links')return `<div class='profile-widget-links'><h3>Links</h3>${p.website_url?`<a href='${esc(p.website_url)}' target='_blank' rel='noopener'>Website</a><br>`:''}${p.steam_url?`<a href='${esc(p.steam_url)}' target='_blank' rel='noopener'>Steam</a><br>`:''}${p.leetify_url?`<a href='${esc(p.leetify_url)}' target='_blank' rel='noopener'>Leetify</a>`:''}</div>`;
if(id==='progress')return `<div><h3>Level / Rank / XP</h3><div>Level ${esc(p.accountLevel||1)}</div><div>${esc(p.rank?.label||'Rank unavailable')}</div><div>${esc(p.accountXpCurrent||0)}/${esc(p.accountXpRequired||100)} XP</div></div>`;
if(id==='showcase')return `<div class='profile-widget-showcase'><h3>Showcase</h3><div>${(p.showcase||[]).filter(s=>s.unlock).map(s=>esc(s.unlock.name)).join(', ')||'No showcase items.'}</div></div>`;
if(id==='steam')return `<div class='profile-widget-steam'><h3>Steam Profile</h3><div id='steam-widget-body'>Loading…</div></div>`;
if(id==='leetify')return `<div class='profile-widget-leetify'><h3>Leetify Profile</h3><div id='leetify-widget-body'>Loading…</div></div>`;
return '<div>Widget unavailable.</div>';}
function renderProfileTilePositions(profileLayout,p){const board=document.getElementById('profile-page-board');board.innerHTML='';for(const [id,entry] of Object.entries(profileLayout.widgets)){const shouldShow=entry.enabled && (widgetEnabledByData(id,p)||meId===p.id);if(!shouldShow)continue;const {w,h}=parseProfileWidgetSize(entry.size);const tile=document.createElement('article');tile.className=`profile-page-tile profile-widget-${id}`;tile.dataset.widgetId=id;tile.style.gridColumn=`${entry.col} / span ${w}`;tile.style.gridRow=`${entry.row} / span ${h}`;tile.innerHTML=`${createWidget(id,p)}<div class='profile-page-edit-controls'><button onclick="moveProfileWidget('${id}','left')">←</button><button onclick="moveProfileWidget('${id}','right')">→</button><button onclick="moveProfileWidget('${id}','up')">↑</button><button onclick="moveProfileWidget('${id}','down')">↓</button><select onchange="resizeProfileWidget('${id}',this.value)">${[...ALLOWED_SIZES].map(s=>`<option ${s===entry.size?'selected':''}>${s}</option>`).join('')}</select></div>`;board.append(tile);}loadIntegrationWidgets(p);}
function compactProfileLayout(){}
function moveProfileWidget(widgetId,d){const e=currentProfile.profileLayout.widgets[widgetId];if(!e)return;if(d==='left')e.col=Math.max(1,e.col-1);if(d==='right')e.col=Math.min(8,e.col+1);if(d==='up')e.row=Math.max(1,e.row-1);if(d==='down')e.row=Math.max(1,e.row+1);renderProfileTilePositions(currentProfile.profileLayout,currentProfile);} 
function resizeProfileWidget(widgetId,size){if(!ALLOWED_SIZES.has(size))return;currentProfile.profileLayout.widgets[widgetId].size=size;renderProfileTilePositions(currentProfile.profileLayout,currentProfile);} 
function createProfileEditControls(p){const own=meId===p.id;const toolbar=document.getElementById('profile-toolbar');if(!own){toolbar.innerHTML='';return;}toolbar.innerHTML=`<button class='nav-button' id='toggle-edit-layout'>Edit Profile Layout</button> <button class='nav-button' id='toggle-widget-panel'>Customise Profile Page</button><button class='nav-button' id='save-layout' hidden>Save Layout</button><button class='nav-button' id='cancel-layout' hidden>Cancel</button> <a class='nav-button' href='/profile-edit.html'>Edit Profile</a> <a class='nav-button' href='/profile-card-edit.html'>Edit Profile Card</a>`;
const panel=document.getElementById('profile-layout-panel');
document.getElementById('toggle-edit-layout').onclick=()=>{profileEditMode=!profileEditMode;document.getElementById('profile-page-board').classList.toggle('profile-page-editing',profileEditMode);document.getElementById('save-layout').hidden=!profileEditMode;document.getElementById('cancel-layout').hidden=!profileEditMode;};
document.getElementById('toggle-widget-panel').onclick=()=>panel.hidden=!panel.hidden;document.getElementById('save-layout').onclick=saveProfilePageLayout;document.getElementById('cancel-layout').onclick=()=>location.reload();}
function buildPanel(p){const panel=document.getElementById('profile-layout-panel');const groups={Main:['profile-card','bio','status'],Connections:['steam','leetify','links'],Progress:['progress'],Collection:['showcase']};panel.innerHTML=Object.entries(groups).map(([g,ids])=>`<h3>${g}</h3>${ids.map(id=>`<label><input type='checkbox' data-widget='${id}' ${currentProfile.profileLayout.widgets[id].enabled?'checked':''}/> ${id.replace('-',' ')}</label><br>`).join('')}`).join('');panel.querySelectorAll('input[data-widget]').forEach(i=>i.onchange=()=>{currentProfile.profileLayout.widgets[i.dataset.widget].enabled=!!i.checked;renderProfileTilePositions(currentProfile.profileLayout,p);});}
async function saveProfilePageLayout(){const body={profile_page_background_url:currentProfile.profile_page_background_url||'',profile_page_background_colour:currentProfile.profile_page_background_colour||'',profile_page_background_size:currentProfile.profile_page_background_size||'cover',profile_page_overlay_strength:Number(currentProfile.profile_page_overlay_strength||20),profile_page_tile_layout_json:JSON.stringify(currentProfile.profileLayout),profile_page_widget_settings_json:currentProfile.profile_page_widget_settings_json||''};const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...currentProfile,...body})});document.getElementById('profile-status').textContent=r.ok?'Layout saved.':'Save failed.';}
async function loadIntegrationWidgets(p){if(p.steam_url){const t=document.getElementById('steam-widget-body');try{const d=await (await fetch(`/api/integrations/steam/profile?user_id=${p.id}`)).json();t.innerHTML=d?.steam?`<a href='${esc(p.steam_url)}' target='_blank'>Open Steam Profile</a><div>${esc(d.steam.personaname||'Steam profile')}</div>`:`<a href='${esc(p.steam_url)}' target='_blank'>Open Steam Profile</a><div>Steam data unavailable.</div>`;}catch{t.innerHTML=`<a href='${esc(p.steam_url)}' target='_blank'>Open Steam Profile</a><div>Steam data unavailable.</div>`;}}
if(p.leetify_url){const t=document.getElementById('leetify-widget-body');try{const d=await (await fetch(`/api/integrations/leetify/profile?user_id=${p.id}`)).json();t.innerHTML=d?.leetify?`<a href='${esc(p.leetify_url)}' target='_blank'>Open Leetify Profile</a><div>${esc(d.leetify.name||'Leetify profile')}</div>`:`<a href='${esc(p.leetify_url)}' target='_blank'>Open Leetify Profile</a><div>Leetify data unavailable.</div>`;}catch{t.innerHTML=`<a href='${esc(p.leetify_url)}' target='_blank'>Open Leetify Profile</a><div>Leetify data unavailable.</div>`;}}
}
function render(p){currentProfile=p;currentProfile.profileLayout=parseProfileLayout(p.profile_page_tile_layout_json);const bg=safeBackgroundSize(p.profile_page_background_size||'cover');const overlay=Math.min(80,Math.max(0,Number(p.profile_page_overlay_strength||20)));const shell=document.createElement('section');shell.className='profile-page-custom-shell';shell.style.setProperty('--profile-overlay',String(overlay/100));shell.style.backgroundColor=p.profile_page_background_colour||'#0f1117';if(p.profile_page_background_url){shell.style.backgroundImage=`url("${p.profile_page_background_url.replace(/"/g,'')}")`;}shell.style.backgroundSize=bg==='stretch'?'100% 100%':bg==='repeat'?'auto':bg;shell.style.backgroundRepeat=bg==='repeat'?'repeat':'no-repeat';shell.style.backgroundPosition=bg==='center'?'center':'center';shell.innerHTML="<section id='profile-page-board' class='profile-page-board'></section><aside id='profile-layout-panel' class='profile-layout-panel' hidden></aside>";const v=document.getElementById('profile-view');v.innerHTML='';v.append(shell);renderProfileTilePositions(currentProfile.profileLayout,p);createProfileEditControls(p);buildPanel(p);} 
async function load(){const statusEl=document.getElementById('profile-status');const id=new URLSearchParams(location.search).get('id');try{const me=await fetch('/api/auth/me');if(me.ok){const d=await me.json();meId=d?.user?.id||null;}}catch{}const r=await fetch(id?`/api/profile?id=${encodeURIComponent(id)}`:'/api/profile/me');const d=await r.json();if(!r.ok){statusEl.textContent=d.error||'Load failed';return;}render(d.profile||{});statusEl.textContent='Loaded.';}
load();
</script><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script></body></html>
