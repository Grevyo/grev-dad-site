name: Apply Final Experience Review Fix

on:
  pull_request:
    branches: [pbe]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/dashboard-profile-experience-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Restrict admin dashboard page listing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/experience.ts')
          text = path.read_text()
          old = """      WHERE p.owner_user_id=? OR ?=1 OR (
                p.group_id IS NOT NULL AND EXISTS("""
          new = """      WHERE p.owner_user_id=? OR (?=1 AND p.group_id IS NOT NULL) OR (
                p.group_id IS NOT NULL AND EXISTS("""
          if old not in text:
              raise SystemExit('Admin page listing predicate not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "grev-dad-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/experience.ts
          git commit -m "Keep personal dashboard pages private"
          git push origin HEAD:${{ github.head_ref }}
