name: Patch Chat Level Type
on:
  pull_request:
    branches: [pbe]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'agent/full-dashboard-profile-upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove duplicate level mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/chat-progression.ts')
          s=p.read_text()
          old="avatarMedia:row.avatar_media,level:Number(row.level??1),...levelInfo"
          new="avatarMedia:row.avatar_media,...levelInfo"
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name grev-dad-bot
          git config user.email actions@users.noreply.github.com
          git add src/chat-progression.ts
          git commit -m "Fix chat progression level mapping"
          git push origin HEAD:${{ github.head_ref }}
