name: Clean Full Platform Verification
on:
  push:
    branches: [agent/full-dashboard-profile-upgrade]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - name: Remove temporary verification artifacts
        run: |
          git rm -f \
            .github/verification/chat-progression.txt \
            .github/verification/dashboard-editor-binding.txt \
            .github/verification/dashboard-editor-diagnostic.txt \
            .github/verification/direct-dashboard-opener.txt \
            .github/verification/final-visible-ui.txt \
            .github/verification/full-platform-browser.txt \
            .github/verification/full-platform-postfix.txt \
            .github/verification/full-platform-static.txt \
            .github/verification/run-postfix.trigger \
            .github/verification/visible-platform-ui.txt \
            .github/verification/run-clean-platform.trigger \
            .github/workflows/verify-full-platform-upgrade.yml \
            .github/workflows/clean-full-platform-verification.yml
          git config user.name "grev-dad-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove temporary full platform verification files"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
