<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin centre · Grev.dad</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><strong>Grev.dad</strong><div><a class="header-link" href="/dashboard">Dashboard</a><a class="header-link" href="/admin/dashboard">Dashboard features</a><a class="header-link" href="/profile">My profile</a><button id="logout">Log out</button></div></header>
<main class="dashboard admin-page">
<p class="eyebrow">Administration</p>
<h1>Admin centre</h1>
<p>Manage accounts, verification, hidden private groups, administrators and the feature catalogue.</p>
<section id="admin-summary" class="admin-summary"><p>Loading account totals…</p></section>
<p id="owner-summary" class="admin-owner-summary">Checking Owner…</p>
<section class="admin-panel admin-search-panel">
<div style="display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap">
<form id="admin-search-form" class="admin-search-form" style="flex:1">
<label>Search accounts<input name="q" type="search" placeholder="Username, display name or email"></label>
<label>Status<select name="status"><option value="all">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="disabled">Disabled</option></select></label>
<button type="submit">Search</button>
</form>
<a class="action-link" href="/admin/dashboard">Manage dashboard features</a>
</div>
</section>
<p id="admin-message" role="status"></p>
<section id="admin-user-list" class="admin-user-list" aria-live="polite"><p>Loading accounts…</p></section>
</main>
<script src="/admin.js" defer></script>
</body></html>
