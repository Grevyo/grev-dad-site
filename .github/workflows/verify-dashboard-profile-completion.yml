name: Verify completed dashboard and profile

on:
  pull_request:
    branches: [pbe]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - '.github/workflows/verify-dashboard-profile-completion.yml'
      - '.github/scripts/verify-dashboard-profile-completion-static.cjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Check browser scripts and integration
        run: |
          node --check public/platform-live-quick.js
          node --check public/profile-guestbook-enhanced.js
          node --check public/platform-dashboard.js
          node --check public/platform-profile.js
          node .github/scripts/verify-dashboard-profile-completion-static.cjs
      - name: Check migration chain locally
        run: npx wrangler d1 migrations apply grev-dad-preview --local --env pbe
      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --env pbe
