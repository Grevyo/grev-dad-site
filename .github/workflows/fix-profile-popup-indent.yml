name: Fix Profile Popup Indentation

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/profile-popup-mobile-focus-desktop-size'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-popup-mobile-focus-desktop-size
      - name: Fix exact indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/profile-editor-unified.js')
          lines = path.read_text().splitlines()
          matches = [index for index, line in enumerate(lines) if line.strip() == 'queueMicrotask(() => {' and index + 2 < len(lines) and 'state.body' in lines[index + 2]]
          if len(matches) != 1:
              raise SystemExit(f'Expected one popup scroll block, found {len(matches)}.')
          index = matches[0]
          lines[index:index + 5] = [
              '      queueMicrotask(() => {',
              '        dialog.scrollTop = 0;',
              '        if (state.body) state.body.scrollTop = 0;',
              '      });',
              '    };'
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY
          node --check public/profile-editor-unified.js
      - name: Commit indentation cleanup
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-profile-popup-indent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/profile-editor-unified.js
          git commit -m "Clean profile popup scroll block formatting"
          git push origin HEAD:agent/profile-popup-mobile-focus-desktop-size
