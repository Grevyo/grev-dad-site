<!doctype html><html><head><meta charset='utf-8'><title>Login</title><link rel='stylesheet' href='/styles/site.css'></head><body><main><h1>Login</h1><form id='f'><input name='identity' placeholder='username or email' required><input name='password' type='password' placeholder='password' required><button>Login</button></form><pre id='out'></pre></main><script>
async function parseResponse(res){const text=await res.text();try{return text?JSON.parse(text):{success:false,error:'Empty response body'};}catch{return{success:false,error:'Invalid JSON response',raw:text};}}
document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const fd=new FormData(e.target);const body={username:fd.get('identity'),password:fd.get('password')};const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('out').textContent=JSON.stringify(await parseResponse(r),null,2)}
</script></body></html>
