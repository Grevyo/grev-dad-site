<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · Grev.dad</title><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-page">
<main class="auth-shell">
<section class="brand-panel"><div class="brand-mark">G</div><p class="eyebrow">Welcome back</p><h1>Log in</h1><p>Use your current username or an email address attached to your account.</p></section>
<section class="auth-card"><a class="back-link" href="/">← Back</a><form id="login-form"><h2>Member login</h2><label>Username or email<input name="identifier" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><label class="check"><input name="rememberMe" type="checkbox"> Keep me signed in</label><button type="submit">Log in</button></form><p id="message" role="status"></p><p class="auth-switch">No account yet? <a href="/signup">Create one</a></p></section>
</main>
<script src="/app.js" defer></script>
</body></html>
