name: Verify Experience Foundation

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    if: github.head_ref == 'agent/dashboard-profile-experience-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Browser script syntax
        run: |
          node --check public/dashboard-experience.js
          node --check public/profile-experience.js
          node --check public/profile-card-popover.js
      - name: Apply migrations locally
        run: npx wrangler d1 migrations apply grev-dad-dev --local
