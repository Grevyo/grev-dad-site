name: Apply Profile Popup Editor Scroll

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/profile-popup-mobile-focus-desktop-size'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-popup-mobile-focus-desktop-size
      - name: Position nested editors after button focus scrolling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/profile-editor-unified.js')
          lines = path.read_text().splitlines()
          matches = [
              index for index, line in enumerate(lines)
              if line.strip() == 'queueMicrotask(() => {'
              and index + 3 < len(lines)
              and lines[index + 1].strip() == 'dialog.scrollTop = 0;'
              and lines[index + 2].strip() == 'if (state.body) state.body.scrollTop = 0;'
              and lines[index + 3].strip() == '});'
          ]
          if len(matches) != 1:
              raise SystemExit(f'Expected one popup scheduling block, found {len(matches)}.')
          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          inner = indent + '  '
          lines[index:index + 4] = [
              f'{indent}requestAnimationFrame(() => {{',
              f'{inner}dialog.scrollTop = 0;',
              f'{inner}if (!state.body) return;',
              f"{inner}if (tab === 'card' || tab === 'page') {{",
              f'{inner}  state.body.scrollTop = 0;',
              f'{inner}  return;',
              f'{inner}}}',
              f'{inner}const bodyRect = state.body.getBoundingClientRect();',
              f'{inner}const dialogRect = dialog.getBoundingClientRect();',
              f'{inner}state.body.scrollTop += dialogRect.top - bodyRect.top - 12;',
              f'{indent}}});'
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY
          node --check public/profile-editor-unified.js
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify mobile and desktop behaviour
        run: timeout --signal=INT 180s node .github/scripts/verify-profile-popup-scroll.cjs
      - name: Commit verified application files
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-profile-popup-editor-scroll.yml \
            .github/scripts/verify-profile-popup-scroll.cjs \
            .github/scripts/diagnose-profile-popup-scroll.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/profile-editor-unified.js
          git commit -m "Keep profile tile editors visible without auto-focus"
          git push origin HEAD:agent/profile-popup-mobile-focus-desktop-size
