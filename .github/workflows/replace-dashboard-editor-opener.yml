name: Replace Dashboard Editor Opener
on:
  push:
    branches: [agent/full-dashboard-profile-upgrade]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - name: Replace wrapper-dependent editor opener
        run: |
          python - <<'PY'
          from pathlib import Path
          advanced=Path('public/dashboard-advanced.js')
          text=advanced.read_text()
          old="""  const baseOpenEditor=openEditor;
            openEditor=function advancedOpenEditor(){baseOpenEditor();ensureToolbar();advanced.selected=dashboardState.selectedId?new Set([dashboardState.selectedId]):new Set();register(dashboardState.workingTiles);decorateSelection();updateActions();checkDraft();};"""
          new="""  openEditor=function advancedOpenEditor(){
              if(!dashboardState.payload||dashboardState.editing)return;
              const customize=dashboardElement('#customize-dashboard');
              if(customize?.disabled){dashboardMessage(customize.title||'This dashboard page is read-only.','error');return;}
              dashboardState.editing=true;
              dashboardState.iconUploads.clear();
              dashboardState.workingTiles=clonePinnedTiles();
              dashboardState.selectedId=dashboardState.workingTiles[0]?.featureId??null;
              dashboardState.search='';
              dashboardState.category='all';
              dashboardElement('#dashboard-density').value=dashboardState.payload.preferences.density;
              dashboardElement('#dashboard-tile-gap').value=String(dashboardState.payload.preferences.tileGap);
              dashboardElement('#dashboard-outer-margin').value=String(dashboardState.payload.preferences.outerMargin);
              dashboardElement('#dashboard-show-descriptions').checked=dashboardState.payload.preferences.showDescriptions;
              dashboardElement('#dashboard-feature-search').value='';
              dashboardElement('#dashboard-editor-toolbar').hidden=false;
              dashboardElement('#dashboard-editor-catalogue-panel').hidden=false;
              dashboardElement('#dashboard-grid-heading').hidden=false;
              customize.hidden=true;
              dashboardElement('#dashboard-shell').classList.add('dashboard-editing');
              editorMessage(isSingleColumnFallback()?'Single-column preview: use Tile settings to resize and change vertical order. Use a wider screen for exact dragging.':'Grab any tile to move it, use Tile settings for exact controls, or drag its corner to resize.');
              advanced.selected=dashboardState.selectedId?new Set([dashboardState.selectedId]):new Set();
              register(dashboardState.workingTiles);
              renderEditor();
              ensureToolbar();
              decorateSelection();
              updateActions();
              document.dispatchEvent(new CustomEvent('dashboard:editor-opened'));
              checkDraft();
            };"""
          if old not in text: raise SystemExit('Advanced opener target not found')
          text=text.replace(old,new,1)
          old_observer="""    const observer=new MutationObserver(()=>{if(dashboardState.editing){decorateSelection();updateActions();}});observer.observe(document.documentElement,{childList:true,subtree:true});"""
          new_observer="""    let observerQueued=false;const observer=new MutationObserver(()=>{if(!dashboardState.editing||observerQueued)return;observerQueued=true;requestAnimationFrame(()=>{observerQueued=false;if(dashboardState.editing){decorateSelection();updateActions();}});});observer.observe(document.documentElement,{childList:true,subtree:true});"""
          if old_observer not in text: raise SystemExit('Advanced observer target not found')
          advanced.write_text(text.replace(old_observer,new_observer,1))

          experience=Path('public/dashboard-experience.js')
          text=experience.read_text()
          marker="""  function installEventRouting() {
              dashboardElement('#dashboard-save-layout')?.addEventListener('click', event => {"""
          replacement="""  function installEventRouting() {
              document.addEventListener('dashboard:editor-opened', () => {
                experience.history = [];
                experience.historyIndex = -1;
                captureHistory(true);
              });
              dashboardElement('#dashboard-save-layout')?.addEventListener('click', event => {"""
          if marker not in text: raise SystemExit('Experience event routing marker not found')
          experience.write_text(text.replace(marker,replacement,1))
          PY
      - name: Confirm direct editor opener
        run: |
          grep -q "dashboardState.editing=true" public/dashboard-advanced.js
          grep -q "dashboard:editor-opened" public/dashboard-advanced.js
          grep -q "observerQueued" public/dashboard-advanced.js
          grep -q "experience.history = \[\]" public/dashboard-experience.js
      - name: Commit patch and remove workflow
        run: |
          git rm .github/workflows/replace-dashboard-editor-opener.yml
          git config user.name "grev-dad-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/dashboard-advanced.js public/dashboard-experience.js
          git commit -m "Use a direct advanced dashboard editor opener"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
