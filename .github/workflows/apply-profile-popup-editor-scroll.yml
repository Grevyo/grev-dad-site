name: Diagnose Profile Popup Editor Scroll

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

jobs:
  diagnose:
    if: github.head_ref == 'agent/profile-popup-mobile-focus-desktop-size'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
      VERIFY_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Measure editor positions
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Grevyo/grev-dad-site/${VERIFY_REF}/.github/scripts/diagnose-profile-popup-scroll.cjs" \
            --output diagnose-profile-popup-scroll.cjs
          timeout --signal=INT 180s node diagnose-profile-popup-scroll.cjs
