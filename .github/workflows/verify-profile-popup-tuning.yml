name: Finalize Profile Popup Tuning

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/profile-popup-mobile-focus-desktop-size'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-popup-mobile-focus-desktop-size
      - name: Format and validate final changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('public/profile-editor-unified.js')
          js = js_path.read_text()
          pattern = re.compile(
              r"      queueMicrotask\(\(\) => \{\n"
              r"\s*dialog\.scrollTop = 0;\n"
              r"\s*if \(state\.body\) state\.body\.scrollTop = 0;\n"
              r"\s*\}\);\n"
              r"    \};"
          )
          replacement = """      queueMicrotask(() => {
                dialog.scrollTop = 0;
                if (state.body) state.body.scrollTop = 0;
              });
            };"""
          js, count = pattern.subn(replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one popup scroll block, found {count}.')
          if "?.focus({ preventScroll: true })" in js:
              raise SystemExit('Automatic field focus is still present.')
          js_path.write_text(js)

          css = Path('public/profile-editor-unified.css').read_text()
          if 'width:min(1320px,calc(100vw - 48px))' not in css:
              raise SystemExit('Large desktop width is missing.')
          if 'height:min(940px,calc(var(--profile-visible-height,100dvh) - 40px))' not in css:
              raise SystemExit('Large desktop height is missing.')
          PY
          node --check public/profile-editor-unified.js
      - name: Commit cleaned application files
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-profile-popup-tuning.yml .github/scripts/measure-profile-popup-tuning.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/profile-editor-unified.js
          git commit -m "Finalize profile popup focus and desktop sizing"
          git push origin HEAD:agent/profile-popup-mobile-focus-desktop-size
