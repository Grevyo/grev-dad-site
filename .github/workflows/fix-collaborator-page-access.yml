name: Fix Collaborator Page Access

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - name: Make collaborator permissions visible to dashboard pages
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/experience.ts')
          text=path.read_text()
          text=text.replace("""  updated_at: number;
          };""", """  updated_at: number;
            collaborator_permission: 'view' | 'edit' | 'manage' | null;
          };""", 1)

          old_access="""    SELECT p.id,p.owner_user_id,p.group_id,g.name AS group_name,p.name,p.slug,p.layout_json,p.created_by,p.updated_at
              FROM dashboard_pages p
              LEFT JOIN groups g ON g.id=p.group_id
              WHERE p.id=? AND (
                p.owner_user_id=?
                OR (?=1 AND p.group_id IS NOT NULL)
                OR (p.group_id IS NOT NULL AND EXISTS(
                  SELECT 1 FROM group_memberships gm WHERE gm.group_id=p.group_id AND gm.user_id=?
                ))
              )
            `).bind(pageId, user.id, user.isAdmin ? 1 : 0, user.id).first<PageRow>();"""
          new_access="""    SELECT p.id,p.owner_user_id,p.group_id,g.name AS group_name,p.name,p.slug,p.layout_json,p.created_by,p.updated_at,c.permission AS collaborator_permission
              FROM dashboard_pages p
              LEFT JOIN groups g ON g.id=p.group_id
              LEFT JOIN dashboard_page_collaborators c ON c.page_id=p.id AND c.user_id=?
              WHERE p.id=? AND (
                p.owner_user_id=?
                OR (?=1 AND p.group_id IS NOT NULL)
                OR c.user_id IS NOT NULL
                OR (p.group_id IS NOT NULL AND EXISTS(
                  SELECT 1 FROM group_memberships gm WHERE gm.group_id=p.group_id AND gm.user_id=?
                ))
              )
            `).bind(user.id, pageId, user.id, user.isAdmin ? 1 : 0, user.id).first<PageRow>();"""
          if old_access not in text: raise SystemExit('pageAccess block not found')
          text=text.replace(old_access,new_access,1)

          old_json="""    canEdit: row.owner_user_id === user.id || (Boolean(row.group_id) && user.isAdmin),
              updatedAt: row.updated_at"""
          new_json="""    canEdit: row.owner_user_id === user.id || (Boolean(row.group_id) && user.isAdmin) || ['edit','manage'].includes(row.collaborator_permission ?? ''),
              canManage: row.owner_user_id === user.id || (Boolean(row.group_id) && user.isAdmin) || row.collaborator_permission === 'manage',
              collaboratorPermission: row.collaborator_permission,
              updatedAt: row.updated_at"""
          if old_json not in text: raise SystemExit('pageJson block not found')
          text=text.replace(old_json,new_json,1)

          old_list="""      SELECT p.id,p.owner_user_id,p.group_id,g.name AS group_name,p.name,p.slug,p.layout_json,p.created_by,p.updated_at
                FROM dashboard_pages p
                LEFT JOIN groups g ON g.id=p.group_id
                WHERE p.owner_user_id=? OR (?=1 AND p.group_id IS NOT NULL) OR (
                  p.group_id IS NOT NULL AND EXISTS(
                    SELECT 1 FROM group_memberships gm WHERE gm.group_id=p.group_id AND gm.user_id=?
                  )
                )
                ORDER BY CASE WHEN p.owner_user_id=? THEN 0 ELSE 1 END,COALESCE(g.name,''),p.name
              `).bind(user.id, user.isAdmin ? 1 : 0, user.id, user.id).all<PageRow>(),"""
          new_list="""      SELECT p.id,p.owner_user_id,p.group_id,g.name AS group_name,p.name,p.slug,p.layout_json,p.created_by,p.updated_at,c.permission AS collaborator_permission
                FROM dashboard_pages p
                LEFT JOIN groups g ON g.id=p.group_id
                LEFT JOIN dashboard_page_collaborators c ON c.page_id=p.id AND c.user_id=?
                WHERE p.owner_user_id=? OR (?=1 AND p.group_id IS NOT NULL) OR c.user_id IS NOT NULL OR (
                  p.group_id IS NOT NULL AND EXISTS(
                    SELECT 1 FROM group_memberships gm WHERE gm.group_id=p.group_id AND gm.user_id=?
                  )
                )
                ORDER BY CASE WHEN p.owner_user_id=? THEN 0 ELSE 1 END,COALESCE(g.name,''),p.name
              `).bind(user.id, user.id, user.isAdmin ? 1 : 0, user.id, user.id).all<PageRow>(),"""
          if old_list not in text: raise SystemExit('dashboard page list block not found')
          text=text.replace(old_list,new_list,1)

          text=text.replace("""  if (page.owner_user_id !== user.id && !user.isAdmin) return secureJson({ ok: false, message: 'You cannot edit this group dashboard page.' }, 403);""", """  if (page.owner_user_id !== user.id && !user.isAdmin && page.collaborator_permission !== 'manage') return secureJson({ ok: false, message: 'Page manager access is required to rename this dashboard page.' }, 403);""", 1)
          path.write_text(text)
          PY
      - name: Confirm collaborator page access
        run: |
          grep -q "collaborator_permission" src/experience.ts
          grep -q "canManage" src/experience.ts
          grep -q "c.user_id IS NOT NULL" src/experience.ts
      - name: Commit access fix and remove workflow
        run: |
          git rm .github/workflows/fix-collaborator-page-access.yml
          git config user.name "grev-dad-collaboration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/experience.ts
          git commit -m "Expose collaborator dashboard permissions"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
