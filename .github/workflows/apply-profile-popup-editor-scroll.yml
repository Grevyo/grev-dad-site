name: Apply Profile Popup Editor Scroll

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/profile-popup-mobile-focus-desktop-size'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-popup-mobile-focus-desktop-size
      - name: Add explicit nested-editor scrolling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/profile-editor-unified.js')
          text = path.read_text()
          old = '        if (state.body) state.body.scrollTop = 0;'
          new = """        if (!state.body) return;
                  if (tab === 'card' || tab === 'page') {
                    state.body.scrollTop = 0;
                    return;
                  }
                  const bodyRect = state.body.getBoundingClientRect();
                  const dialogRect = dialog.getBoundingClientRect();
                  state.body.scrollTop += dialogRect.top - bodyRect.top - 12;"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one popup body scroll line, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check public/profile-editor-unified.js
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify mobile and desktop behaviour
        run: timeout --signal=INT 180s node .github/scripts/verify-profile-popup-scroll.cjs
      - name: Commit verified application changes
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-profile-popup-editor-scroll.yml .github/scripts/verify-profile-popup-scroll.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/profile-editor-unified.js
          git commit -m "Keep profile tile editors visible without auto-focus"
          git push origin HEAD:agent/profile-popup-mobile-focus-desktop-size
