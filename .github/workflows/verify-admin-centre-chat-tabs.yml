name: Verify admin centre and chat tabs

on:
  pull_request:
    branches: [pbe]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - '.github/workflows/verify-admin-centre-chat-tabs.yml'
      - '.github/scripts/verify-admin-centre-chat-tabs-static.cjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Check browser scripts
        run: |
          node --check public/site-shell.js
          node --check public/chat-tabs.js
          node --check public/admin-centre.js
          node .github/scripts/verify-admin-centre-chat-tabs-static.cjs
      - name: Check migration chain locally
        run: npx wrangler d1 migrations apply grev-dad-preview --local --env pbe
