<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grev - Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <div id="authStatus">Checking login...</div>
      <h1>Admin</h1>

      <section aria-labelledby="users-heading">
        <h2 id="users-heading">Users</h2>
        <p id="users-status" role="status" aria-live="polite">Loading users...</p>
        <table>
          <thead><tr><th>Username</th><th>Role</th><th>Balance</th><th>Created</th><th>Set Role</th><th>Adjust Balance</th></tr></thead>
          <tbody id="users-body"></tbody>
        </table>
      </section>
    </main>

    <script>
      const usersStatusEl = document.getElementById('users-status');
      const usersBodyEl = document.getElementById('users-body');
      let rolesMap = {};

      async function safeJsonRequest(path, options) {
        const response = await fetch(path, options);
        const text = await response.text();
        let data = null;

        if (text) {
          try {
            data = JSON.parse(text);
          } catch {
            throw new Error('Server returned invalid JSON');
          }
        }

        if (!response.ok) {
          const message = data?.error || text || `Request failed (${response.status})`;
          throw new Error(message);
        }

        return data || {};
      }

      async function updateRole(userId, role) {
        await safeJsonRequest(`/api/admin/users/${userId}/role`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role }),
        });
      }

      async function adjustBalance(userId, amount_cents, reason) {
        await safeJsonRequest(`/api/admin/users/${userId}/balance`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount_cents, reason }),
        });
      }

      function renderUsers(users) {
        usersBodyEl.textContent = '';
        users.forEach((user) => {
          const tr = document.createElement('tr');

          const roleSelect = document.createElement('select');
          Object.keys(rolesMap).forEach((role) => {
            const option = document.createElement('option');
            option.value = role;
            option.textContent = rolesMap[role]?.label || role;
            if (user.role === role) option.selected = true;
            roleSelect.append(option);
          });
          roleSelect.addEventListener('change', async () => {
            roleSelect.disabled = true;
            usersStatusEl.textContent = `Updating role for ${user.username}...`;
            try {
              await updateRole(user.id, roleSelect.value);
              usersStatusEl.textContent = `Updated role for ${user.username}.`;
              await loadUsers();
            } catch (error) {
              usersStatusEl.textContent = `Failed role update: ${error.message}`;
              roleSelect.disabled = false;
            }
          });

          const amountInput = document.createElement('input');
          amountInput.type = 'number';
          amountInput.step = '1';
          amountInput.placeholder = 'amount_cents';

          const reasonInput = document.createElement('input');
          reasonInput.type = 'text';
          reasonInput.placeholder = 'reason';

          const applyBtn = document.createElement('button');
          applyBtn.type = 'button';
          applyBtn.textContent = 'Apply';
          applyBtn.addEventListener('click', async () => {
            const amount = Number(amountInput.value);
            const reason = reasonInput.value.trim();
            if (!Number.isInteger(amount)) {
              usersStatusEl.textContent = 'Amount must be an integer.';
              return;
            }
            if (!reason) {
              usersStatusEl.textContent = 'Reason is required.';
              return;
            }
            applyBtn.disabled = true;
            usersStatusEl.textContent = `Adjusting balance for ${user.username}...`;
            try {
              await adjustBalance(user.id, amount, reason);
              usersStatusEl.textContent = `Updated balance for ${user.username}.`;
              await loadUsers();
            } catch (error) {
              usersStatusEl.textContent = `Failed balance update: ${error.message}`;
            } finally {
              applyBtn.disabled = false;
            }
          });

          tr.innerHTML = `<td>${user.username}</td><td>${user.roleLabel}</td><td>${user.balance_cents ?? ''}</td><td>${user.created_at ?? ''}</td>`;
          const roleCell = document.createElement('td');
          roleCell.append(roleSelect);
          const adjustCell = document.createElement('td');
          adjustCell.append(amountInput, reasonInput, applyBtn);
          tr.append(roleCell, adjustCell);
          usersBodyEl.append(tr);
        });
      }

      async function loadUsers() {
        try {
          const data = await safeJsonRequest('/api/admin/users', { method: 'GET' });
          rolesMap = data.roles || {};
          renderUsers(data.users || []);
          usersStatusEl.textContent = `Loaded ${data.users?.length || 0} users.`;
        } catch (error) {
          usersStatusEl.textContent = `Failed to load users: ${error.message}`;
        }
      }

      loadUsers();
    </script>
    <script src="/scripts/auth-status.js"></script>
  </body>
</html>
