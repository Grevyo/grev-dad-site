name: Apply two-stage onboarding

on:
  push:
    branches:
      - agent/two-stage-onboarding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/two-stage-onboarding

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply implementation
        run: node scripts/apply-two-stage-onboarding.mjs

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement two-stage relationship and interest onboarding"
          git push origin HEAD:agent/two-stage-onboarding
