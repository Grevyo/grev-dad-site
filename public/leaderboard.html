<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leaderboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main>
  <h1>Level Leaderboard</h1>
  <p id="lb-status">Loading...</p>
  <div id="lb" class="leaderboard-profile-card-list" aria-label="Leaderboard Profile Cards"></div>
</main>
<script src="/scripts/level-badge.js"></script>
<script src="/scripts/player-card.js"></script>
<script src="/scripts/api-cache.js"></script>
<script>
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function profileHref(user){return `/profile.html?id=${encodeURIComponent(Number(user?.id)||0)}`;}
function loadScriptOnce(src){return new Promise((resolve,reject)=>{if(document.querySelector(`script[src="${src}"]`)){resolve();return;}const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
async function ensureProfileCardRenderer(){if(window.renderPlayerCard)return true;try{await loadScriptOnce('/scripts/player-card.js');}catch(error){console.error('[leaderboard] Profile Card renderer load failed',error);}return !!window.renderPlayerCard;}
function fallbackLeaderboardCard(user){const name=escapeHtml(user.display_name||user.username||'Member');const username=escapeHtml(user.username||'');const avatar=user.avatar_url?`<img src="${escapeHtml(user.avatar_url)}" alt="" loading="lazy" />`:'';const rank=escapeHtml(user.rank||user.displayedRank||'');return `<article class="profile-card-fallback"><div class="profile-card-fallback-avatar">${avatar}</div><div><strong>${name}</strong><div>@${username}</div><div>Level ${Number(user.accountLevel)||1}${rank?` · ${rank}`:''}</div><span>View Profile</span></div></article>`;}
function renderProfileCard(user){try{if(!window.renderPlayerCard)throw new Error('Profile Card renderer unavailable');return window.renderPlayerCard(user,{variant:'snapshot',showXp:true,showUserId:false,useCardSettings:true,respectConfiguredTiles:false,tileSize:'4x1'});}catch(error){console.error('[leaderboard] Profile Card render failed',error);return fallbackLeaderboardCard(user);}}
function renderLeaderboardEntry(user){const level=Number(user.accountLevel)||1;const xp=Number(user.accountXp)||0;const pct=Math.max(0,Math.min(100,Number(user.accountXpPercent)||0));const rank=escapeHtml(user.rank||user.displayedRank||'Unranked');return `<article class="leaderboard-profile-card-row"><div class="leaderboard-position">#${Number(user.rankPosition)||0}</div><a class="member-profile-card-link leaderboard-profile-card-link" href="${profileHref(user)}" aria-label="View Profile for ${escapeHtml(user.display_name||user.username||'member')}"><div class="member-profile-card-shell leaderboard-profile-card-shell">${renderProfileCard(user)}</div></a><div class="leaderboard-profile-stats"><a href="${profileHref(user)}">View Profile</a><strong>Level ${level}</strong><span>${xp} XP</span><span>${rank}</span><div class="xp-bar"><div class="xp-bar-fill" style="width:${pct}%"></div></div></div></article>`;}
function renderInChunks(rows){const boardEl=document.getElementById('lb');boardEl.innerHTML='';let i=0;function batch(){const chunk=rows.slice(i,i+10);boardEl.insertAdjacentHTML('beforeend',chunk.map(renderLeaderboardEntry).join(''));i+=chunk.length;if(i<rows.length)requestAnimationFrame(batch);}requestAnimationFrame(batch);}
(async()=>{const statusEl=document.getElementById('lb-status');try{await ensureProfileCardRenderer();const r=await fetch('/api/leaderboard/levels');const raw=await r.text();let d=null;try{d=raw?JSON.parse(raw):null;}catch{d=null;}if(r.status===401){location.href='/unregistered.html';return;}if(!r.ok){statusEl.textContent=(d&&d.error)||'Leaderboard unavailable.';return;}const rows=(d&&d.leaderboard)||[];renderInChunks(rows);statusEl.textContent=`Loaded ${rows.length} Profile Cards with leaderboard stats.`;}catch(error){console.error('[leaderboard] load failed',error);statusEl.textContent='Leaderboard unavailable.';}})();
</script>
<script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script>
</body>
</html>
