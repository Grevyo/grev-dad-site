<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Edit Profile</title><link rel="stylesheet" href="/styles.css" /></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main><h1>Edit Profile</h1><p id="edit-status">Loading...</p><form id="profile-edit-form" class="profile-edit-form profile-custom-fields">
<label>Display Name<input name="display_name" maxlength="40" /></label><label>Profile Title<input name="profile_title" maxlength="80" /></label><label>Bio<textarea name="bio" maxlength="500"></textarea></label><label>Location<input name="location" maxlength="80" /></label><label>Website URL<input name="website_url" maxlength="200" /></label><label>Avatar URL<input name="avatar_url" maxlength="500" /></label><label>Banner URL<input name="banner_url" maxlength="500" /></label><label>Favourite Colour<input name="favourite_colour" placeholder="#00ff66" /></label><label>Profile Accent Colour<input name="profile_accent_colour" placeholder="#00ff66" /></label><label>Profile Background Colour<input name="profile_background_colour" placeholder="#101820" /></label>
<label>Profile Layout<select name="profile_layout"><option value="compact">compact</option><option value="standard">standard</option><option value="showcase">showcase</option></select></label>
<fieldset class="profile-privacy-options"><legend>Display Options</legend><label><input type="checkbox" name="show_level" value="1" /> Show level</label><label><input type="checkbox" name="show_rank" value="1" /> Show rank</label><label><input type="checkbox" name="show_badges" value="1" /> Show badges</label><label><input type="checkbox" name="show_last_active" value="1" /> Show last active</label></fieldset>
<button type="submit">Save Profile</button></form></main>
<script>
async function load(){const s=document.getElementById('edit-status');const r=await fetch('/api/profile/me');const d=await r.json();if(!r.ok){s.textContent=d.error||'Load failed';return;}const p=d.profile||{};const f=document.getElementById('profile-edit-form');for(const k of ['display_name','profile_title','bio','location','website_url','avatar_url','banner_url','favourite_colour','profile_accent_colour','profile_background_colour','profile_layout'])f.elements[k].value=p[k]||'';for(const k of ['show_level','show_rank','show_badges','show_last_active'])f.elements[k].checked=Number(p[k])===1;s.textContent='Loaded.';}
document.getElementById('profile-edit-form').addEventListener('submit',async(e)=>{e.preventDefault();const f=e.target;const body={};for(const k of ['display_name','profile_title','bio','location','website_url','avatar_url','banner_url','favourite_colour','profile_accent_colour','profile_background_colour','profile_layout'])body[k]=f.elements[k].value;for(const k of ['show_level','show_rank','show_badges','show_last_active'])body[k]=f.elements[k].checked?1:0;const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();document.getElementById('edit-status').textContent=r.ok?'Saved profile settings.':(d.error||'Save failed');});
load();
</script><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script></body></html>
