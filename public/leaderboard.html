<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Leaderboard</title><link rel='stylesheet' href='/styles.css'/></head><body><header class='site-header'><a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a><nav id='authStatus' class='site-nav'>Checking login...</nav></header><main><h1>Level Leaderboard</h1><p id='lb-status'>Loading...</p><div id='lb' class='leaderboard-table'></div></main><script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script><script>
(async()=>{
  const statusEl=document.getElementById('lb-status');
  const boardEl=document.getElementById('lb');
  try {
    const r=await fetch('/api/leaderboard/levels');
    const raw=await r.text();
    let d=null;
    try { d=raw?JSON.parse(raw):null; } catch { d=null; }
    if (r.status===401) { location.href='/unregistered.html'; return; }
    if (!r.ok) { statusEl.textContent=(d&&d.error)||'Leaderboard unavailable.'; return; }
    boardEl.innerHTML=((d&&d.leaderboard)||[]).map((x)=>`<div class='leaderboard-row'><strong>#${x.rankPosition}</strong>${window.renderPlayerCard(x,{showXp:true})}</div>`).join('');
    statusEl.textContent='Loaded.';
  } catch {
    statusEl.textContent='Leaderboard unavailable.';
  }
})();
</script><script src='/scripts/theme.js'></script><script src='/scripts/auth-status.js'></script></body></html>
