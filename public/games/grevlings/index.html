<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grevlings Prototype Launcher</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/" aria-label="Grev home">
        <img class="site-logo" src="/grev.dad.logo.png" alt="Grev" />
      </a>
      <nav id="authStatus" class="site-nav" aria-label="Site navigation">Checking login...</nav>
    </header>

    <main>
      <h1>Grevlings</h1>
      <section class="dashboard-section" aria-labelledby="grevlings-launcher-heading">
        <h2 id="grevlings-launcher-heading">Prototype Launcher</h2>
        <p>Grevlings is currently in prototype.</p>
        <p>
          The playable web build is hosted separately because exported Godot web files (such as
          <code>.wasm</code> and <code>.pck</code>) are too large for this site's static asset hosting.
        </p>
        <p>
          <a id="grevlings-launch-link" class="nav-button" href="#" target="_blank" rel="noopener noreferrer">
            Launch Grevlings Prototype
          </a>
        </p>
        <p id="grevlings-launch-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="/scripts/auth-status.js"></script>
    <script src="/scripts/theme.js"></script>
    <script src="/games/grevlings/config.js"></script>
    <script>
      (function () {
        const GREVLINGS_BUILD_URL = window.GREVLINGS_CONFIG?.buildUrl || '';
        const link = document.getElementById('grevlings-launch-link');
        const status = document.getElementById('grevlings-launch-status');

        if (GREVLINGS_BUILD_URL) {
          link.href = GREVLINGS_BUILD_URL;
          status.textContent = 'Launcher is configured and ready.';
          return;
        }

        link.setAttribute('aria-disabled', 'true');
        link.removeAttribute('href');
        link.addEventListener('click', function (event) {
          event.preventDefault();
        });
        status.textContent = 'Grevlings build URL is not configured yet.';
      })();
    </script>
  </body>
</html>
