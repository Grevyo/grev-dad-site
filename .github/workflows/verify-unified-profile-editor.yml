name: Verify Unified Profile Editor

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    if: github.head_ref == 'agent/streamline-profile-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify unified profile editor
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Grevyo/grev-dad-site/agent/streamline-profile-editor/.github/scripts/verify-unified-profile-editor.cjs \
            --output verify-unified-profile-editor.cjs
          node verify-unified-profile-editor.cjs
