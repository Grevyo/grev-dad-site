name: Apply Inline Review Fixes

on:
  push:
    branches:
      - agent/inline-realtime-dashboard-editor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inline-realtime-dashboard-editor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-inline-review-fixes.mjs
      - run: |
          node --check public/dashboard.js
          npm install --package-lock=false
          npm run typecheck
      - name: Commit review fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/dashboard.js public/dashboard.css
          git commit -m "Fix inline editor review issues"
          git push origin HEAD:agent/inline-realtime-dashboard-editor
