<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Profile</title><link rel="stylesheet" href="/styles.css" /></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main><h1>Profile</h1><p id="profile-status">Loading...</p><div id="profile-view"></div></main>
<script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script><script>
let meId=null;const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return ((p[0]?.[0]||'?')+(p[1]?.[0]||'')).toUpperCase();};
function showcaseMarkup(showcase){const slots=Array.isArray(showcase)?showcase:[];const rarityColor={common:'#9ca8b7',uncommon:'#2f8f4e',rare:'#2e7dff',epic:'#8a4fff',legendary:'#d49100'};return `<section><h2>Showcase</h2><div class='showcase-grid'>${[1,2,3,4].map(i=>{const slot=slots.find(s=>Number(s.slot)===i);const u=slot?.unlock;if(!u)return `<article class='showcase-slot showcase-slot-empty'><div class='showcase-title'>Slot ${i}</div><div>Empty showcase slot</div></article>`;return `<article class='showcase-slot'><div class='showcase-icon'>${u.icon_url?`<img src='${esc(u.icon_url)}' alt='icon'/>`:'▣'}</div><div class='showcase-title'>${esc(u.name)}</div><div class='showcase-meta'>${esc(u.unlock_type)} · <span class='showcase-rarity' style='color:${rarityColor[u.rarity]||'#9ca8b7'}'>${esc(u.rarity)}</span></div>${u.description?`<div>${esc(u.description)}</div>`:''}</article>`;}).join('')}</div></section>`;}
function levelBadgeHtml(level){ if(window.renderLevelBadge){ const w=document.createElement('div'); w.append(window.renderLevelBadge(level)); return w.innerHTML; } return `Lv. ${Number(level)||1}`;}
function render(p){const own=meId===p.id;const showLevel=Number(p.show_level)!==0;const showRank=Number(p.show_rank)!==0;const banner=p.banner_url?`<img class='profile-banner' src='${esc(p.banner_url)}' alt='banner'/>`:'';const bgStyle=p.profile_background_url?`background-image:url("${esc(p.profile_background_url)}");background-size:cover;background-position:center;`:'';const accent=p.profile_accent_colour?`border-color:${esc(p.profile_accent_colour)};`:''; const card=window.renderPlayerCard?window.renderPlayerCard({...p, card_background_url:p.card_background_url||p.profile_background_url, card_border_colour:p.card_border_colour||p.profile_accent_colour},{variant:'full',showXp:showLevel,useCardSettings:true}):`<div>${esc(p.display_name||p.username)}</div>`;document.getElementById('profile-view').innerHTML=`${banner}<section class='profile-top-box profile-background' style='${bgStyle}${accent}'><div class='profile-card-shell'>${card}</div><div class='profile-identity'>${p.profile_title?`<div>${esc(p.profile_title)}</div>`:''}${showLevel?`<div class='xp-bar'><div class='xp-bar-fill' style='width:${p.accountXpPercent}%;'></div></div><div>XP: ${p.accountXpCurrent}/${p.accountXpRequired}</div>`:''}${showRank?`<div>Rank: ${esc(p.rank?.name||'Unranked')}</div>`:''}${p.location?`<div>${esc(p.location)}</div>`:''}${p.website_url?`<div><a href='${esc(p.website_url)}' target='_blank' rel='noopener noreferrer'>${esc(p.website_url)}</a></div>`:''}${p.bio?`<p>${esc(p.bio)}</p>`:''}<div class='profile-actions'>${own?"<a class='nav-button' href='/profile-edit.html'>Edit Profile</a> <a class='nav-button' href='/profile-card-edit.html'>Edit Profile Card</a> <a class='nav-button' href='/account.html'>Account Settings</a>":''}</div></div></section><section class='profile-integration-grid' id='profile-integrations'></section>${showcaseMarkup(p.showcase)}`;}
async function fetchJsonSafe(url, options = {}) {
  const response = await fetch(url, options);
  const text = await response.text();
  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    throw new Error(`Invalid JSON from ${url}: ${text.slice(0, 120)}`);
  }

  if (!response.ok || !data || data.ok === false) {
    throw new Error((data && data.error) || `Request failed: ${response.status}`);
  }

  return data;
}


function integrationLink(url,label){return `<a class='integration-link' href='${esc(url)}' target='_blank' rel='noopener noreferrer'>${esc(label)}</a>`;}
async function loadSteamBox(profile){
  const box=document.getElementById('steam-profile-box-content');
  if(!box) return;
  box.textContent='Loading Steam profile...';
  try{ const resp=await fetch(`/api/integrations/steam/profile?user_id=${encodeURIComponent(profile.id)}`); const text=await resp.text(); let data=null; try{data=text?JSON.parse(text):null;}catch{data=null;} const steam=data?.steam; if(!steam){ box.textContent='Steam data unavailable.'; return; }
    const avatar=steam.avatarfull||steam.avatarmedium||steam.avatar;
    box.innerHTML=`${avatar?`<img class='steam-profile-avatar' src='${esc(avatar)}' alt='Steam avatar'/>`:''}<div class='steam-profile-meta'><div>${integrationLink(profile.steam_url,'Open Steam Profile')}</div><div>${esc(steam.personaname||'')}</div><div>${steam.available?`Status: ${esc(String(steam.personastate ?? 'Unknown'))}`:'Steam data unavailable.'}</div><div>${steam.available?`Visibility: ${esc(String(steam.communityvisibilitystate ?? 'Unknown'))}`:''}</div></div>`;
  }catch{ box.textContent='Steam data unavailable.'; }
}

function withProfileFallbackFromAuth(authData){
  const user=authData?.user||authData||{};
  const username=String(user.username||'Unavailable');
  return {
    id:user.id||null,
    username,
    role:user.role||'Unavailable',
    roleLabel:user.roleLabel||user.role||'Unavailable',
    display_name:username,
    show_level:1,
    show_rank:1,
    accountLevel:1,
    accountXpCurrent:0,
    accountXpRequired:100,
    accountXpPercent:0,
    rank:null,
    showcase:[]
  };
}

function unavailableFallbackProfile(){
  return {
    id:null,
    username:'Unavailable',
    role:'Unavailable',
    roleLabel:'Unavailable',
    display_name:'Unavailable',
    show_level:1,
    show_rank:1,
    accountLevel:1,
    accountXpCurrent:0,
    accountXpRequired:100,
    accountXpPercent:0,
    rank:null,
    showcase:[]
  };
}

async function load(){
  const statusEl=document.getElementById('profile-status');
  const id=new URLSearchParams(location.search).get('id');
  let authData=null;

  try{
    authData=await fetchJsonSafe('/api/auth/me');
    meId=authData?.user?.id||null;
  }catch(error){
    meId=null;
    console.error('[profile] Failed to load profile', error);
  }

  try{
    const profileData=await fetchJsonSafe(id?`/api/profile?id=${encodeURIComponent(id)}`:'/api/profile/me');
    statusEl.textContent='Loaded.';
    const profile=profileData.profile||unavailableFallbackProfile();
    render(profile);
    const integrations=document.getElementById('profile-integrations');
    if(integrations){
      const parts=[];
      if(profile.steam_url){ parts.push(`<article class='steam-profile-box'><h2>Steam Profile</h2><div id='steam-profile-box-content'>Loading Steam profile...</div></article>`);}
      if(profile.leetify_url){ parts.push(`<article class='leetify-profile-box'><h2>Leetify</h2><div>${integrationLink(profile.leetify_url,'Open Leetify Profile')}</div></article>`);}
      integrations.innerHTML=parts.join('');
      if(profile.steam_url){ loadSteamBox(profile); }
    }
    return;
  }catch(error){
    console.error('[profile] Failed to load profile', error);
    if(!id&&authData){
      statusEl.textContent='Loaded with limited data.';
      render(withProfileFallbackFromAuth(authData));
      return;
    }
    statusEl.textContent='Could not load profile.';
    render(unavailableFallbackProfile());
  }
}

load();
</script><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script></body></html>
