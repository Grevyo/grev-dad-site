name: Apply Custom Media Buttons Square Grid

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/custom-media-buttons-square-grid' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: node scripts/patch-custom-media-buttons-square-grid.mjs
      - name: Verify generated implementation
        run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
          grep -q "const GRID_COLUMNS = 8" public/dashboard.js
          grep -q "Custom media button" public/dashboard.html
          grep -q "dashboard-media-button-tile" public/dashboard.css
          grep -q "contentMode: TileContentMode" src/dashboard.ts
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/dashboard.js public/dashboard.html public/dashboard.css src/dashboard.ts
          git commit -m "Add custom media buttons and square eight-column grid"
          git push origin HEAD:${{ github.head_ref }}
