name: Fix Dashboard Editor Binding

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - name: Bind Customize to the final wrapped editor
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('public/dashboard.js')
          text=path.read_text()
          old="dashboardElement('#customize-dashboard')?.addEventListener('click', openEditor);"
          new="dashboardElement('#customize-dashboard')?.addEventListener('click', event => { event.preventDefault(); requestAnimationFrame(() => openEditor()); });"
          if old not in text: raise SystemExit('Customize listener target not found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Commit binding fix and remove workflow
        run: |
          git rm .github/workflows/fix-dashboard-editor-binding.yml
          git config user.name "grev-dad-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/dashboard.js
          git commit -m "Open the complete wrapped dashboard editor"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
