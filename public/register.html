<!doctype html><html><head><meta charset='utf-8'><title>Register</title><link rel='stylesheet' href='/styles/site.css'></head><body><main><h1>Register</h1><form id='f'><input name='username' placeholder='username' required><input name='email' type='email' placeholder='email' required><input name='password' type='password' placeholder='password (min 8)' required><button>Register</button></form><pre id='out'></pre></main><script>
async function j(r){const t=await r.text();try{return t?JSON.parse(t):{ok:false,error:'Empty response body'};}catch{return{ok:false,error:'Invalid JSON response',raw:t};}}
document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const f=new FormData(e.target);const d=await j(await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),email:f.get('email'),password:f.get('password')})}));document.getElementById('out').textContent=JSON.stringify(d,null,2)};
</script></body></html>
