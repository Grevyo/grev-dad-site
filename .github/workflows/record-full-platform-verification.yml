name: Record Full Platform Verification

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run and record checks
        run: |
          set +e
          mkdir -p .github/verification
          LOG=.github/verification/full-platform-static.log
          : > "$LOG"

          echo '## npm install' >> "$LOG"
          npm install >> "$LOG" 2>&1
          install_status=$?
          echo "INSTALL_STATUS=$install_status" >> "$LOG"

          echo '## TypeScript' >> "$LOG"
          npm run typecheck >> "$LOG" 2>&1
          type_status=$?
          echo "TYPECHECK_STATUS=$type_status" >> "$LOG"

          echo '## Browser syntax' >> "$LOG"
          syntax_status=0
          for file in public/hub.js public/platform-dashboard.js public/dashboard-advanced.js public/dashboard-collaboration.js public/platform-profile.js public/site-platform.js public/chat-ui.js; do
            node --check "$file" >> "$LOG" 2>&1 || syntax_status=1
          done
          echo "SYNTAX_STATUS=$syntax_status" >> "$LOG"

          echo '## Fresh migrations' >> "$LOG"
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply grev-dad-dev --local >> "$LOG" 2>&1
          migration_status=$?
          echo "MIGRATION_STATUS=$migration_status" >> "$LOG"

          if [ "$install_status" -eq 0 ] && [ "$type_status" -eq 0 ] && [ "$syntax_status" -eq 0 ] && [ "$migration_status" -eq 0 ]; then
            echo 'OVERALL=PASS' >> "$LOG"
          else
            echo 'OVERALL=FAIL' >> "$LOG"
          fi

          git rm .github/workflows/record-full-platform-verification.yml
          git config user.name "grev-dad-verification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$LOG"
          git commit -m "Record full platform static verification"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
