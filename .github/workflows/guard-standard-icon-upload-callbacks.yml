name: Guard Standard Icon Upload Callbacks

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  guard:
    if: github.head_ref == 'agent/standard-tile-icon-customization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/guard-standard-icon-upload-callbacks.py
      - run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
          grep -q "dashboardState.iconUploads.get(featureId) !== uploadToken" public/dashboard.js
          grep -q "currentTile.contentMode !== 'standard'" public/dashboard.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/dashboard.js
          git commit -m "Guard standard icon upload callbacks"
          git push origin HEAD:${{ github.head_ref }}
