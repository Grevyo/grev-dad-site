<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Profile Card Editor</title><link rel='stylesheet' href='/styles.css'></head><body class='profile-card-editor-page'><header class='site-header'><a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a><nav id='authStatus' class='site-nav'>Checking login...</nav></header><main><h1>Profile Card Editor</h1><p id='card-status'>Loading...</p><div class='profile-card-editor-grid'><section class='profile-card-preview'><h2>Card Preview</h2><div id='card-preview' class='profile-card-preview-frame'></div></section><section class='card-display-options'><h2>Display Tiles</h2><div id='tile-settings'></div><p class='form-help'>Steam and Leetify links: Link comes from Edit Full Profile.</p></section></div><button id='save-card' class='nav-button'>Save Profile Card</button></main><script src='/scripts/player-card.js'></script><script>
const toggles=['card_show_display_name','card_show_username','card_show_role','card_show_level','card_show_rank','card_show_xp','card_show_status','card_show_steam','card_show_leetify'];
const meta=[['name','Display name','card_show_display_name'],['username','Username','card_show_username'],['role','Role','card_show_role'],['level','Level','card_show_level'],['rank','Rank','card_show_rank'],['xp','XP','card_show_xp'],['status','Status message','card_show_status'],['steam','Steam','card_show_steam'],['leetify','Leetify','card_show_leetify']];
const defaults={name:{span:'2x1',fontStyle:'bold',size:'lg',align:'left',colour:''},username:{span:'1x1',fontStyle:'normal',size:'sm',align:'left',colour:''},role:{span:'1x1',fontStyle:'normal',size:'sm',align:'left',colour:''},level:{span:'1x1',fontStyle:'normal',size:'md',align:'center',colour:''},rank:{span:'1x1',fontStyle:'bold',size:'sm',align:'left',colour:''},xp:{span:'2x1',fontStyle:'normal',size:'sm',align:'left',colour:''},status:{span:'2x1',fontStyle:'italic',size:'sm',align:'left',colour:''},steam:{span:'1x1',fontStyle:'bold',size:'sm',align:'center',colour:''},leetify:{span:'1x1',fontStyle:'bold',size:'sm',align:'center',colour:''}};
let profile={cardTileSettings:{...defaults}};
function draw(){document.getElementById('card-preview').innerHTML=window.renderPlayerCard(profile,{useCardSettings:true,variant:'full'});}
function row(k,label,t){return `<div class='profile-card-setting-panel'><label><input type='checkbox' name='${t}' ${Number(profile[t]??1)?'checked':''}/> ${label}</label><div class='profile-card-setting-grid ${Number(profile[t]??1)?'':'is-hidden'}' data-panel='${k}'><label>Tile size<select data-k='${k}' data-p='span'><option>1x1</option><option>2x1</option><option>1x2</option><option>2x2</option></select></label><label>Colour<input type='color' data-k='${k}' data-p='colour' value='${profile.cardTileSettings[k].colour||'#ffffff'}'></label><label>Font style<select data-k='${k}' data-p='fontStyle'><option>normal</option><option>bold</option><option>italic</option><option>bold_italic</option><option>mono</option></select></label><label>Text size<select data-k='${k}' data-p='size'><option>xs</option><option>sm</option><option>md</option><option>lg</option><option>xl</option></select></label><label>Alignment<select data-k='${k}' data-p='align'><option>left</option><option>center</option><option>right</option></select></label></div></div>`}
function renderPanels(){const host=document.getElementById('tile-settings');host.innerHTML=meta.map(([k,l,t])=>row(k,l,t)).join('');for(const [k] of meta){for(const p of ['span','fontStyle','size','align']) host.querySelector(`[data-k='${k}'][data-p='${p}']`).value=profile.cardTileSettings[k][p]||defaults[k][p];}}
async function fetchJsonSafe(url, options = {}) { const response = await fetch(url, { credentials: 'same-origin', ...options }); const data = await response.json(); if (!response.ok || !data || data.ok === false) throw new Error(data?.error || `Request failed: ${response.status}`); return data; }
(async()=>{const d=await fetchJsonSafe('/api/profile/me'); profile={...(d.profile||{})}; profile.cardTileSettings={...defaults,...(d.profile?.cardTileSettings||{})}; renderPanels(); draw(); document.getElementById('card-status').textContent='Loaded.';})();
document.body.addEventListener('input',(e)=>{const n=e.target.name;if(n&&toggles.includes(n)){profile[n]=e.target.checked?1:0;const m=meta.find((x)=>x[2]===n);if(m)document.querySelector(`[data-panel='${m[0]}']`)?.classList.toggle('is-hidden',!e.target.checked);} if(e.target.dataset.k){profile.cardTileSettings[e.target.dataset.k][e.target.dataset.p]=e.target.value;} draw();});
document.getElementById('save-card').onclick=async()=>{const body={}; toggles.forEach(k=>body[k]=Number(profile[k]??1)); body.cardTileSettings=profile.cardTileSettings; const d=await fetchJsonSafe('/api/profile/me/card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); profile=d.profile||profile; profile.cardTileSettings={...defaults,...(profile.cardTileSettings||{})}; renderPanels(); draw(); document.getElementById('card-status').textContent='Profile card saved.';};
</script><script src='/scripts/theme.js'></script><script src='/scripts/auth-status.js'></script></body></html>
