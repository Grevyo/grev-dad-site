name: Fix Standard Tile Icon Patch

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/standard-tile-icon-customization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/fix-standard-icon-patch-content-icons.py
      - run: python3 -m py_compile scripts/patch-standard-tile-icons.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/patch-standard-tile-icons.py
          git commit -m "Handle both standard content icon targets"
          git push origin HEAD:${{ github.head_ref }}
