name: Verify Mobile Profile Editor Scroll

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    if: github.head_ref == 'agent/fix-mobile-profile-editor-scroll'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify mobile profile editor scrolling
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Grevyo/grev-dad-site/agent/fix-mobile-profile-editor-scroll/.github/scripts/verify-mobile-profile-editor-scroll.cjs \
            --output verify-mobile-profile-editor-scroll.cjs
          node verify-mobile-profile-editor-scroll.cjs
