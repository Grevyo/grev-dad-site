name: Verify Standard Mode Background

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

jobs:
  verify:
    if: github.head_ref == 'agent/custom-media-buttons-square-grid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --no-save jsdom@26
      - name: Verify standard mode remains saveable after empty media mode
        run: |
          node <<'NODE'
          const fs=require('fs');const assert=require('node:assert/strict');const{JSDOM}=require('jsdom');
          (async()=>{const html=fs.readFileSync('public/dashboard.html','utf8');const js=fs.readFileSync('public/dashboard.js','utf8');const dom=new JSDOM(html,{url:'https://pbe.grev.dad/dashboard',runScripts:'outside-only',pretendToBeVisual:true});const{window}=dom;window.matchMedia=()=>({matches:false,addEventListener(){},removeEventListener(){}});window.HTMLElement.prototype.scrollIntoView=function(){};window.HTMLDialogElement.prototype.showModal=function(){this.open=true};window.HTMLDialogElement.prototype.close=function(){this.open=false};
          const feature={id:'feature-profile',slug:'profile',name:'My profile',description:'',category:'Account',featureType:'system',presentation:'content',route:'/profile',iconText:'ME',audience:'all',defaultDimension:'1x1',defaultWidth:1,defaultHeight:1,allowedDimensions:['1x1'],isActive:true,isDefault:true,sortOrder:1,pinned:true,x:0,y:0,width:1,height:1,tileColour:'default',accessGroups:[],backgroundType:'solid',backgroundPrimary:'#11161d',backgroundSecondary:'#5268aa',backgroundAngle:135,backgroundMedia:null,textColour:'#f4f7fb',fontFamily:'system',borderColour:'#394657',contentMode:'standard',customTitle:null,customIcon:null,mediaFit:'cover',mediaOverlay:'dark'};const payload={ok:true,viewer:{id:'u',username:'u',displayName:'U',isAdmin:false,isOwner:false},grid:{columns:8,dimensions:['1x1']},preferences:{density:'comfortable',showDescriptions:true,tileGap:12,outerMargin:0},capabilities:{canCustomize:true},features:[feature],pinnedTiles:[feature]};let savedBody=null;window.fetch=async(url,options={})=>{if(String(url).includes('/api/onboarding'))return{ok:true,json:async()=>({ok:true,progress:{relationshipComplete:true,intentionsComplete:true}})};if(String(url).includes('/api/dashboard/layout')){savedBody=JSON.parse(options.body);return{ok:true,json:async()=>payload}}return{ok:true,json:async()=>payload}};window.eval(js);await new Promise(r=>setTimeout(r,25));window.document.querySelector('#customize-dashboard').click();await new Promise(r=>setTimeout(r,10));window.document.querySelector('.dashboard-tile-settings').click();const mode=window.document.querySelector('#dashboard-content-mode');mode.value='media-button';mode.dispatchEvent(new window.Event('change',{bubbles:true}));assert.equal(window.document.querySelector('.dashboard-tile.editing').dataset.backgroundType,'media');mode.value='standard';mode.dispatchEvent(new window.Event('change',{bubbles:true}));assert.equal(window.document.querySelector('.dashboard-tile.editing').dataset.backgroundType,'solid');window.document.querySelector('#dashboard-save-layout').click();await new Promise(r=>setTimeout(r,20));assert.ok(savedBody);assert.equal(savedBody.tiles[0].contentMode,'standard');assert.equal(savedBody.tiles[0].backgroundType,'solid');assert.equal(savedBody.tiles[0].backgroundMedia,null);console.log('Standard mode restored a saveable solid background after empty media mode.');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: |
          node --check public/dashboard.js
          npm run typecheck
          git diff --check
