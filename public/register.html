<!doctype html><html><head><meta charset='utf-8'><title>Register</title><link rel='stylesheet' href='/styles/site.css'></head><body><main><h1>Register</h1><form id='f'><input name='username' placeholder='username' required><input name='email' type='email' placeholder='email' required><input name='password' type='password' placeholder='password (min 8)' required><button>Register</button></form><pre id='out'></pre></main><script>
async function parseResponse(res){const text=await res.text();try{return text?JSON.parse(text):{success:false,error:'Empty response body'};}catch{return{success:false,error:'Invalid JSON response',raw:text};}}
document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const fd=new FormData(e.target);const body={username:fd.get('username'),email:fd.get('email'),password:fd.get('password')};const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('out').textContent=JSON.stringify(await parseResponse(r),null,2)}
</script></body></html>
