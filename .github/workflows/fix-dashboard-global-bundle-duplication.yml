name: Fix Dashboard Global Bundle Duplication

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - name: Load global site scripts only through app.js on Dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/worker.ts')
          text=path.read_text()
          old_js="['/dashboard-experience.js','/platform-dashboard.js','/dashboard-advanced.js','/dashboard-collaboration.js','/site-platform.js','/profile-card-popover.js','/chat-ui.js']"
          new_js="['/dashboard-experience.js','/platform-dashboard.js','/dashboard-advanced.js','/dashboard-collaboration.js']"
          old_css="['/dashboard-experience.css','/platform-dashboard.css','/dashboard-advanced.css','/dashboard-collaboration.css','/site-platform.css','/profile-card-popover.css','/chat-ui.css']"
          new_css="['/dashboard-experience.css','/platform-dashboard.css','/dashboard-advanced.css','/dashboard-collaboration.css']"
          if old_js not in text: raise SystemExit('dashboard JS bundle target not found')
          if old_css not in text: raise SystemExit('dashboard CSS bundle target not found')
          path.write_text(text.replace(old_js,new_js,1).replace(old_css,new_css,1))
          PY
      - name: Commit bundle fix and remove workflow
        run: |
          git rm .github/workflows/fix-dashboard-global-bundle-duplication.yml
          git config user.name "grev-dad-bundle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/worker.ts
          git commit -m "Avoid duplicate global UI bundles on Dashboard"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
