name: Apply Standard Tile Icon Customization

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/standard-tile-icon-customization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python3 scripts/patch-standard-tile-icons.py
      - name: Verify source and Worker build
        run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
          grep -q 'dashboard-icon-mode' public/dashboard.html
          grep -q 'createStandardTileIcon' public/dashboard.js
          grep -q 'icon_background_colour' src/dashboard.ts
          grep -q 'icon_media_fit' migrations/20260719_standard_tile_icon_customization.sql
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/dashboard.html public/dashboard.css public/dashboard.js src/dashboard.ts
          git commit -m "Add standard tile icon customization"
          git push origin HEAD:${{ github.head_ref }}
