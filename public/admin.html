<!doctype html><html><body>
<h1>Admin</h1>
<div id='status'></div>
<button onclick='loadUsers()'>Load Users</button>
<pre id='users'></pre>
<script>
async function auth(){const r=await fetch('/api/auth/me',{credentials:'same-origin'});const d=await r.json();if(!d.success||!d.user?.is_admin){document.getElementById('status').textContent='Forbidden';throw new Error('forbidden')}document.getElementById('status').textContent='Admin authenticated';}
async function loadUsers(){await auth();const r=await fetch('/api/admin/users',{credentials:'same-origin'});document.getElementById('users').textContent=JSON.stringify(await r.json(),null,2)}
auth().catch(()=>{});
</script>
</body></html>
