<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Admin</title><link rel="stylesheet" href="/styles.css" /></head><body><main><div id="authStatus">Checking login...</div><h1>Admin</h1><section aria-labelledby="users-heading"><h2 id="users-heading">Users</h2><p id="users-status" role="status" aria-live="polite">Loading users...</p><table><thead><tr><th>Username</th><th>Role</th><th>Grev Coins</th><th>Created</th><th>Set Role</th><th>Adjust Coins</th></tr></thead><tbody id="users-body"></tbody></table></section></main>
<script>
const usersStatusEl=document.getElementById('users-status');const usersBodyEl=document.getElementById('users-body');let rolesMap={};
async function safeJsonRequest(path,options){const res=await fetch(path,options);const text=await res.text();let data={};if(text){try{data=JSON.parse(text);}catch{throw new Error('Server returned invalid JSON');}}if(!res.ok)throw new Error(data?.error||text||`Request failed (${res.status})`);return data;}
const updateRole=(userId,role)=>safeJsonRequest(`/api/admin/users/${userId}/role`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});
const adjustWallet=(userId,amount,reason)=>safeJsonRequest(`/api/admin/users/${userId}/wallet-adjust`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,reason})});
function renderUsers(users){usersBodyEl.textContent='';users.forEach((user)=>{const tr=document.createElement('tr');const roleSelect=document.createElement('select');Object.keys(rolesMap).forEach((role)=>{const option=document.createElement('option');option.value=role;option.textContent=rolesMap[role]?.label||role;if(user.role===role)option.selected=true;roleSelect.append(option);});roleSelect.addEventListener('change',async()=>{roleSelect.disabled=true;usersStatusEl.textContent=`Updating role for ${user.username}...`;try{await updateRole(user.id,roleSelect.value);usersStatusEl.textContent=`Updated role for ${user.username}.`;await loadUsers();}catch(e){usersStatusEl.textContent=`Failed role update: ${e.message}`;roleSelect.disabled=false;}});
const amountInput=document.createElement('input');amountInput.type='number';amountInput.step='1';amountInput.placeholder='amount';
const reasonInput=document.createElement('input');reasonInput.type='text';reasonInput.placeholder='reason';
const applyBtn=document.createElement('button');applyBtn.type='button';applyBtn.textContent='Apply';applyBtn.onclick=async()=>{const amount=Number(amountInput.value);const reason=reasonInput.value.trim();if(!Number.isInteger(amount)){usersStatusEl.textContent='Amount must be an integer.';return;}if(!reason){usersStatusEl.textContent='Reason is required.';return;}applyBtn.disabled=true;usersStatusEl.textContent=`Adjusting coins for ${user.username}...`;try{await adjustWallet(user.id,amount,reason);usersStatusEl.textContent=`Updated coins for ${user.username}.`;await loadUsers();}catch(e){usersStatusEl.textContent=`Failed coin update: ${e.message}`;}finally{applyBtn.disabled=false;}};
tr.innerHTML=`<td>${user.username}</td><td>${user.roleLabel}</td><td>${user.coins ?? ''}</td><td>${user.created_at ?? ''}</td>`;const roleCell=document.createElement('td');roleCell.append(roleSelect);const adjustCell=document.createElement('td');adjustCell.append(amountInput,reasonInput,applyBtn);tr.append(roleCell,adjustCell);usersBodyEl.append(tr);});}
async function loadUsers(){try{const [usersData,walletData]=await Promise.all([safeJsonRequest('/api/admin/users',{method:'GET'}),safeJsonRequest('/api/admin/wallets',{method:'GET'})]);rolesMap=usersData.roles||{};renderUsers(walletData.users||[]);usersStatusEl.textContent=`Loaded ${walletData.users?.length||0} users.`;}catch(e){usersStatusEl.textContent=`Failed to load users: ${e.message}`;}}
loadUsers();
</script><script src="/scripts/auth-status.js"></script></body></html>
