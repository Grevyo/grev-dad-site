name: Refine Standard Tile Icon Defaults

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/standard-tile-icon-customization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/refine-standard-tile-icon-defaults.py
      - run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
          grep -q "createStandardTileIcon(feature, 'dashboard-profile-avatar')" public/dashboard.js
          grep -q "iconBackgroundColour: '#394657'" public/dashboard.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add migrations/20260719_standard_tile_icon_customization.sql public/dashboard.html public/dashboard.css public/dashboard.js src/dashboard.ts
          git commit -m "Preserve standard icon defaults and support profile icons"
          git push origin HEAD:${{ github.head_ref }}
