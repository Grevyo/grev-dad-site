<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Edit Profile</title><link rel="stylesheet" href="/styles.css" /></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main class="page-shell profile-edit-page editor-page">
  <h1>Edit Profile</h1>
  <p id="profile-edit-message" class="editor-message" aria-live="polite">Loading profile…</p>
  <form id="profile-edit-form">
    <section class="editor-tile editor-tile-4"><h2>Profile Basics</h2><label>Display Name <input name="display_name" maxlength="40" /></label><label>Profile Title <input name="profile_title" maxlength="80" /></label><label>Bio <textarea name="bio" maxlength="500"></textarea></label><label>Location <input name="location" maxlength="80" /></label><label>Website URL <input name="website_url" maxlength="200" /></label></section>
    <section class="editor-tile editor-tile-4"><h2>Integrations</h2><label>Steam URL <input name="steam_url" maxlength="300" /></label><label>Leetify URL <input name="leetify_url" maxlength="300" /></label><label>Status Message <input name="status_message" maxlength="140" /></label></section>
    <section class="editor-tile editor-tile-4"><h2>Profile Visuals</h2><label>Avatar URL <input name="avatar_url" /></label><label>Banner URL <input name="banner_url" /></label><label>Banner Size <select name="banner_display_size"><option>compact</option><option selected>wide</option><option>tall</option><option>full</option></select></label><label>Profile footer image/GIF URL <input name="profile_footer_url" placeholder="https://..." /></label><label>Profile footer display size <select name="profile_footer_display_size"><option>compact</option><option selected>wide</option><option>tall</option><option>full</option></select></label><p class="editor-help-text">Optional image/GIF shown at the bottom of your profile page.</p></section>
    <section class="editor-tile editor-tile-4"><h2>Profile Page Customisation</h2><p class="editor-help-text">Controls the background and layout of your public profile page.</p><label>Profile page background image/GIF URL <input name="profile_page_background_url" placeholder="https://..." /></label><label>Profile page background colour <input name="profile_page_background_colour" placeholder="#112233" /></label><label>Profile page background size/fit <select name="profile_page_background_size"><option>cover</option><option>contain</option><option>repeat</option><option>stretch</option><option>center</option></select></label><label>Profile page overlay strength <input name="profile_page_overlay_strength" type="range" min="0" max="80" step="1" /><span id="overlay-strength-value">20</span></label><div class="editor-actions"><button id="reset-profile-page-layout" class="nav-button" type="button">Reset Profile Page Layout</button><a class="nav-button" href="/profile.html">View Profile</a></div></section>
    <section class="editor-tile editor-tile-12"><div class="editor-save-bar"><button type="submit" class="nav-button">Save Profile</button><a class="nav-button" href="/profile.html">Back to Profile</a><a class="nav-button" href="/profile-card-edit.html">Edit Profile Card</a></div></section>
  </form>
</main>
<script>
const textFields=['display_name','profile_title','bio','location','website_url','steam_url','leetify_url','avatar_url','banner_url','status_message','profile_page_background_url','profile_page_background_colour','profile_footer_url'];
const selectFields=['banner_display_size','profile_page_background_size','profile_footer_display_size'];
const rangeFields=['profile_page_overlay_strength'];
const hiddenState={profile_page_tile_layout_json:'',profile_page_widget_settings_json:''};let formDirty=false;
function editStatusElement(){return document.getElementById('profile-edit-message');}
function updateOverlayLabel(){document.getElementById('overlay-strength-value').textContent=document.querySelector('[name="profile_page_overlay_strength"]').value;}
function applyProfileToForm(p){const f=document.getElementById('profile-edit-form');for(const k of textFields)if(f.elements[k])f.elements[k].value=p[k]||'';for(const k of selectFields)if(f.elements[k])f.elements[k].value=p[k]||f.elements[k].value;for(const k of rangeFields)if(f.elements[k])f.elements[k].value=Number.isInteger(Number(p[k]))?Number(p[k]):20;hiddenState.profile_page_tile_layout_json=p.profile_page_tile_layout_json||'';hiddenState.profile_page_widget_settings_json=p.profile_page_widget_settings_json||'';updateOverlayLabel();}
async function load(){const s=editStatusElement();try{const cached=window.GREVApi?.readSessionCache?.('grev_api_cache:/api/profile/me');if(cached?.data?.profile) { applyProfileToForm(cached.data.profile); s.textContent='Loaded cached profile.'; }
let r=await fetch('/api/bootstrap/edit-profile');if(r.status===401){location.href='/unregistered.html';return;}let d=await r.json();if(!r.ok||!d?.ok){r=await fetch('/api/profile/me');if(r.status===401){location.href='/unregistered.html';return;}d=await r.json();}if(!r.ok){s.textContent=d.error||'Load failed';return;}const p=d.profile||{};if(!formDirty) applyProfileToForm(p);s.textContent='Loaded.';}catch(e){s.textContent=`Load failed: ${e?.message||'Unknown error'}`;}}
document.getElementById('reset-profile-page-layout').addEventListener('click',()=>{hiddenState.profile_page_tile_layout_json='';hiddenState.profile_page_widget_settings_json='';editStatusElement().textContent='Profile layout will reset on save.';});
document.querySelector('[name="profile_page_overlay_strength"]').addEventListener('input',updateOverlayLabel);
document.getElementById('profile-edit-form').addEventListener('input',()=>{formDirty=true;});document.getElementById('profile-edit-form').addEventListener('change',()=>{formDirty=true;});document.getElementById('profile-edit-form').addEventListener('submit',async(e)=>{e.preventDefault();const status=editStatusElement();status.textContent='Saving...';const f=e.target,body={};for(const k of textFields)body[k]=f.elements[k]?.value||'';for(const k of selectFields)body[k]=f.elements[k]?.value||'';for(const k of rangeFields)body[k]=Number(f.elements[k]?.value||20);body.profile_page_tile_layout_json=hiddenState.profile_page_tile_layout_json;body.profile_page_widget_settings_json=hiddenState.profile_page_widget_settings_json;const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();status.textContent=r.ok?'Profile saved.':`Save failed: ${d.error||'Unknown error'}`;});
load();
</script><script src="/scripts/theme.js"></script><script src="/scripts/api-cache.js"></script><script src="/scripts/auth-status.js"></script></body></html>
