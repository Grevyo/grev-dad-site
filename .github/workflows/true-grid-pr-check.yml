name: True Grid PR Check

on:
  pull_request:
    branches:
      - pbe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Browser JavaScript syntax checks
        run: |
          node --check public/dashboard.js
          node --check public/admin-dashboard.js

      - name: Apply migrations through existing dashboard schema
        shell: bash
        run: |
          set -euo pipefail
          for migration in migrations/0001_*.sql migrations/0002_*.sql migrations/0003_*.sql migrations/0004_*.sql migrations/0005_*.sql migrations/0006_*.sql migrations/0007_*.sql migrations/0008_*.sql migrations/0009_*.sql migrations/0010_*.sql migrations/0011_*.sql; do
            npx wrangler d1 execute grev-dad-preview --local --env pbe --file "$migration"
          done

      - name: Seed an existing linear dashboard tile
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute grev-dad-preview --local --env pbe --command "INSERT INTO users(id,username,email,display_name,status,is_verified,is_owner,created_at,updated_at) VALUES('grid-test-user','gridtest',NULL,'Grid Test','active',1,1,unixepoch(),unixepoch()); INSERT INTO user_dashboard_preferences(user_id,density,show_descriptions,initialized_at,updated_at) VALUES('grid-test-user','comfortable',1,unixepoch(),unixepoch()); INSERT INTO user_dashboard_tiles(user_id,feature_id,position,size,pinned_at,updated_at) VALUES('grid-test-user','feature-profile',2,'medium',unixepoch(),unixepoch());"

      - name: Apply true grid migration
        run: npx wrangler d1 execute grev-dad-preview --local --env pbe --file migrations/0012_true_grid_dashboard.sql

      - name: Verify migrated coordinates and preferences
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute grev-dad-preview --local --env pbe --command "SELECT grid_x,grid_y,tile_width,tile_height FROM user_dashboard_tiles WHERE user_id='grid-test-user' AND feature_id='feature-profile'; SELECT tile_gap,outer_margin FROM user_dashboard_preferences WHERE user_id='grid-test-user';" --json > /tmp/grid.json
          cat /tmp/grid.json
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/grid.json', 'utf8');
          if (!text.includes('"grid_x": 0') || !text.includes('"grid_y": 4') || !text.includes('"tile_width": 2') || !text.includes('"tile_height": 1')) {
            throw new Error('Existing tile was not migrated to the expected non-overlapping coordinates.');
          }
          if (!text.includes('"tile_gap": 12') || !text.includes('"outer_margin": 0')) {
            throw new Error('Grid spacing preferences were not added with safe defaults.');
          }
          NODE

      - name: Verify API preserves blank space, dimensions, gap and margin
        shell: bash
        run: |
          set -euo pipefail
          token='grid-api-token'
          token_hash=$(node -e "const c=require('node:crypto');process.stdout.write(c.createHash('sha256').update(process.argv[1]).digest('base64url'))" "$token")
          npx wrangler d1 execute grev-dad-preview --local --env pbe --command "INSERT INTO sessions(id,user_id,token_hash,created_at,last_seen_at,expires_at,revoked_at,remember_me,user_agent) VALUES('grid-test-session','grid-test-user','$token_hash',unixepoch(),unixepoch(),unixepoch()+3600,NULL,0,'grid-test');"

          npx wrangler dev --local --env pbe --port 8787 > /tmp/wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill $worker_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 1
          done

          valid_payload='{"tiles":[{"featureId":"feature-profile","x":0,"y":0,"width":1,"height":1},{"featureId":"feature-cs2","x":3,"y":2,"width":3,"height":2}],"preferences":{"density":"compact","showDescriptions":false,"tileGap":24,"outerMargin":32}}'
          save_status=$(curl --silent --show-error --output /tmp/save.json --write-out '%{http_code}' --request POST --header 'Origin: http://127.0.0.1:8787' --header 'Content-Type: application/json' --header "Cookie: grev_session=$token" --data "$valid_payload" http://127.0.0.1:8787/api/dashboard/layout)
          test "$save_status" = "200"

          curl --silent --show-error --fail --header "Cookie: grev_session=$token" http://127.0.0.1:8787/api/dashboard > /tmp/reloaded.json
          cat /tmp/reloaded.json
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/reloaded.json', 'utf8'));
          const profile = payload.pinnedTiles.find(tile => tile.id === 'feature-profile');
          const cs2 = payload.pinnedTiles.find(tile => tile.id === 'feature-cs2');
          if (!profile || profile.x !== 0 || profile.y !== 0 || profile.width !== 1 || profile.height !== 1) throw new Error('Profile tile coordinates were not preserved.');
          if (!cs2 || cs2.x !== 3 || cs2.y !== 2 || cs2.width !== 3 || cs2.height !== 2) throw new Error('CS2 tile coordinates or deliberate blank space were not preserved.');
          if (payload.preferences.tileGap !== 24 || payload.preferences.outerMargin !== 32 || payload.preferences.density !== 'compact' || payload.preferences.showDescriptions !== false) throw new Error('Dashboard spacing preferences were not preserved.');
          NODE

          overlap_payload='{"tiles":[{"featureId":"feature-profile","x":0,"y":0,"width":2,"height":1},{"featureId":"feature-cs2","x":1,"y":0,"width":3,"height":2}],"preferences":{"tileGap":12,"outerMargin":0}}'
          overlap_status=$(curl --silent --show-error --output /tmp/overlap.json --write-out '%{http_code}' --request POST --header 'Origin: http://127.0.0.1:8787' --header 'Content-Type: application/json' --header "Cookie: grev_session=$token" --data "$overlap_payload" http://127.0.0.1:8787/api/dashboard/layout)
          cat /tmp/overlap.json
          test "$overlap_status" = "400"

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --env pbe
