<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Members</title><link rel='stylesheet' href='/styles.css'/></head><body><header class='site-header'><a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a><nav id='authStatus' class='site-nav'>Checking login...</nav></header><main><h1>Members</h1><p id='members-status'>Loading...</p><input id='member-search' placeholder='Search username' /><div id='members-grid' class='leaderboard-grid'></div></main><script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script><script>
let all=[];
function draw(){
  const searchEl=document.getElementById('member-search');
  const gridEl=document.getElementById('members-grid');
  const q=(searchEl?.value||'').toLowerCase();
  const rows=all.filter((m)=>!q||String(m.username||'').toLowerCase().includes(q));
  gridEl.innerHTML=rows.map((m)=>window.renderPlayerCard(m,{showXp:true})).join('');
}
(async()=>{
  const statusEl=document.getElementById('members-status');
  try {
    const r=await fetch('/api/members');
    const raw=await r.text();
    let d=null;
    try { d=raw?JSON.parse(raw):null; } catch { d=null; }
    if (r.status===401) { location.href='/unregistered.html'; return; }
    if (!r.ok) { statusEl.textContent=(d&&d.error)||'Members unavailable.'; return; }
    all=(d&&d.members)||[];
    draw();
    statusEl.textContent=`Loaded ${all.length} members.`;
    document.getElementById('member-search').addEventListener('input',draw);
  } catch {
    statusEl.textContent='Members unavailable.';
  }
})();
</script><script src='/scripts/theme.js'></script><script src='/scripts/auth-status.js'></script></body></html>
