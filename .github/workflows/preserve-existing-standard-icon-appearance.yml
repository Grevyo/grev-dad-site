name: Preserve Existing Standard Icon Appearance

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  preserve:
    if: github.head_ref == 'agent/standard-tile-icon-customization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/preserve-existing-standard-icon-appearance.py
      - run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler d1 migrations apply grev-dad-preview --local --env pbe
          npx wrangler deploy --dry-run --env pbe
          git diff --check
          grep -q "icon_background_colour TEXT;" migrations/20260719_standard_tile_icon_customization.sql
          grep -q "LEGACY_ICON_BORDERS" src/dashboard.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add migrations/20260719_standard_tile_icon_customization.sql public/dashboard.js src/dashboard.ts
          git commit -m "Preserve existing standard icon appearance"
          git push origin HEAD:${{ github.head_ref }}
