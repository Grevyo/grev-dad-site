name: Deploy PBE

on:
  push:
    branches:
      - pbe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grev-dad-pbe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Apply PBE database migrations
        run: npx wrangler d1 migrations apply grev-dad-preview --remote --env pbe

      - name: Configure protected LADMIN account
        run: node scripts/bootstrap-ladmin.mjs

      - name: Deploy PBE
        shell: bash
        run: |
          set +e
          output=$(npx wrangler deploy --env pbe 2>&1)
          status=$?
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if printf '%s\n' "$output" | grep -q "Completion token has already been consumed"; then
            echo "Cloudflare returned transient completion-token error 100312. Retrying once in 20 seconds."
            sleep 20
            npx wrangler deploy --env pbe
            exit $?
          fi

          exit "$status"
