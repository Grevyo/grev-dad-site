name: Verify Custom Media Buttons Square Grid

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

jobs:
  verify:
    if: github.head_ref == 'agent/custom-media-buttons-square-grid'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Apply full migration chain
        run: |
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply grev-dad-preview --local --env pbe
      - name: Start local Worker
        run: |
          npx wrangler dev --local --env pbe --ip 127.0.0.1 --port 8788 > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8788/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/worker.log
          exit 1
      - name: Verify API persistence and validation
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const base = 'http://127.0.0.1:8788';
          let cookie = '';
          async function request(path, options = {}) {
            const headers = new Headers(options.headers || {});
            if (cookie) headers.set('Cookie', cookie);
            const response = await fetch(base + path, { ...options, headers });
            const setCookie = response.headers.get('set-cookie');
            if (setCookie) cookie = setCookie.split(';', 1)[0];
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); } catch { payload = { raw: text }; }
            return { response, payload };
          }
          (async () => {
            const signup = await request('/api/auth/signup', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: 'media_square_test', displayName: 'Media Square Test', email: '', password: 'Testing.Password.123' })
            });
            assert.equal(signup.response.status, 201, JSON.stringify(signup.payload));
            const onboarding = await request('/api/onboarding');
            assert.equal(onboarding.response.status, 200);
            await request('/api/onboarding/relationship', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ relationshipId: onboarding.payload.relationships[0].id }) });
            await request('/api/onboarding/intentions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ intentionIds: [onboarding.payload.intentions[0].id] }) });
            const dashboard = await request('/api/dashboard');
            assert.equal(dashboard.response.status, 200, JSON.stringify(dashboard.payload));
            assert.equal(dashboard.payload.grid.columns, 8);
            assert.ok(dashboard.payload.grid.dimensions.includes('8x4'));
            const feature = dashboard.payload.features.find(item => item.id === 'feature-profile') || dashboard.payload.features[0];
            assert.ok(feature);
            const gif = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
            const preferences = { density: 'comfortable', showDescriptions: true, tileGap: 12, outerMargin: 0 };
            const standardTile = {
              featureId: feature.id, x: 0, y: 0, width: 2, height: 2, colour: 'default',
              backgroundType: 'media', backgroundPrimary: '#11161d', backgroundSecondary: '#5268aa', backgroundAngle: 135,
              backgroundMedia: gif, textColour: '#ffffff', fontFamily: 'system', borderColour: '#394657',
              contentMode: 'standard', customTitle: null, customIcon: null, mediaFit: 'cover', mediaOverlay: 'dark'
            };
            const savedStandard = await request('/api/dashboard/layout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tiles: [standardTile], preferences }) });
            assert.equal(savedStandard.response.status, 200, JSON.stringify(savedStandard.payload));
            assert.equal(savedStandard.payload.pinnedTiles[0].contentMode, 'standard');
            const mediaTile = { ...standardTile, contentMode: 'media-button', customTitle: 'My custom button', customIcon: '🎮', mediaFit: 'contain', mediaOverlay: 'none' };
            const savedMedia = await request('/api/dashboard/layout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tiles: [mediaTile], preferences }) });
            assert.equal(savedMedia.response.status, 200, JSON.stringify(savedMedia.payload));
            let pinned = savedMedia.payload.pinnedTiles[0];
            assert.equal(pinned.contentMode, 'media-button');
            assert.equal(pinned.customTitle, 'My custom button');
            assert.equal(pinned.customIcon, '🎮');
            assert.equal(pinned.mediaFit, 'contain');
            assert.equal(pinned.mediaOverlay, 'none');
            assert.equal(pinned.backgroundMedia, gif);
            const reloaded = await request('/api/dashboard');
            pinned = reloaded.payload.pinnedTiles[0];
            assert.equal(pinned.contentMode, 'media-button');
            assert.equal(pinned.customTitle, 'My custom button');
            assert.equal(reloaded.payload.grid.columns, 8);
            const missingMedia = { ...mediaTile, backgroundMedia: null };
            const rejectedMissing = await request('/api/dashboard/layout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tiles: [missingMedia], preferences }) });
            assert.equal(rejectedMissing.response.status, 400);
            for (const [field, value] of [['mediaFit','tile'], ['mediaOverlay','purple'], ['contentMode','broken']]) {
              const invalid = { ...mediaTile, [field]: value };
              const result = await request('/api/dashboard/layout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tiles: [invalid], preferences }) });
              assert.equal(result.response.status, 400, `${field} should be rejected`);
            }
            const longTitle = { ...mediaTile, customTitle: 'x'.repeat(81) };
            const rejectedTitle = await request('/api/dashboard/layout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tiles: [longTitle], preferences }) });
            assert.equal(rejectedTitle.response.status, 400);
            const longIcon = { ...mediaTile, customIcon: 'x'.repeat(13) };
            const rejectedIcon = await request('/api/dashboard/layout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tiles: [longIcon], preferences }) });
            assert.equal(rejectedIcon.response.status, 400);
            console.log('Eight-column API, custom media button persistence and validation passed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Install DOM dependency
        run: npm install --package-lock=false --no-save jsdom@26
      - name: Verify square cells and full media renderer
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const { JSDOM } = require('jsdom');
          (async () => {
            const html = fs.readFileSync('public/dashboard.html', 'utf8');
            const js = fs.readFileSync('public/dashboard.js', 'utf8');
            const dom = new JSDOM(html, { url: 'https://pbe.grev.dad/dashboard', runScripts: 'outside-only', pretendToBeVisual: true });
            const { window } = dom;
            window.matchMedia = () => ({ matches: false, addEventListener() {}, removeEventListener() {} });
            window.HTMLElement.prototype.scrollIntoView = function () {};
            window.HTMLDialogElement.prototype.showModal = function () { this.open = true; };
            window.HTMLDialogElement.prototype.close = function () { this.open = false; };
            const gif = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
            const feature = {
              id: 'feature-profile', slug: 'profile', name: 'My profile', description: 'Normal profile content', category: 'Account', featureType: 'system', presentation: 'content', route: '/profile', iconText: 'ME', audience: 'all',
              defaultDimension: '2x2', defaultWidth: 2, defaultHeight: 2, allowedDimensions: ['1x1','2x1','2x2','4x2'], isActive: true, isDefault: true, sortOrder: 1,
              pinned: true, x: 0, y: 0, width: 2, height: 2, tileColour: 'default', accessGroups: [],
              backgroundType: 'media', backgroundPrimary: '#11161d', backgroundSecondary: '#5268aa', backgroundAngle: 135, backgroundMedia: gif,
              textColour: '#ffffff', fontFamily: 'system', borderColour: '#394657', contentMode: 'media-button', customTitle: 'Custom profile', customIcon: '★', mediaFit: 'cover', mediaOverlay: 'dark'
            };
            const payload = { ok: true, viewer: { id: 'u1', username: 'tester', displayName: 'Test User', isAdmin: false, isOwner: false }, grid: { columns: 8, dimensions: ['1x1','2x1','2x2','4x2','8x4'] }, preferences: { density: 'comfortable', showDescriptions: true, tileGap: 0, outerMargin: 0 }, capabilities: { canCustomize: true }, features: [{ ...feature, backgroundMedia: null, hasBackgroundMedia: true }], pinnedTiles: [feature] };
            window.fetch = async url => ({ ok: true, json: async () => String(url).includes('/api/onboarding') ? { ok: true, progress: { relationshipComplete: true, intentionsComplete: true } } : payload });
            const grid = window.document.querySelector('#dashboard-grid');
            grid.getBoundingClientRect = () => ({ left: 0, top: 0, width: 800, height: 800, right: 800, bottom: 800, x: 0, y: 0, toJSON() {} });
            window.eval(js);
            await new Promise(resolve => setTimeout(resolve, 30));
            assert.equal(grid.style.gridTemplateColumns, 'repeat(8, minmax(0, 1fr))');
            assert.equal(grid.style.getPropertyValue('--tile-row-height'), '100px');
            let tile = window.document.querySelector('.dashboard-tile');
            assert.equal(tile.dataset.contentMode, 'media-button');
            assert.ok(tile.querySelector('.dashboard-media-button-tile'));
            assert.equal(tile.querySelector('.dashboard-media-button-title')?.textContent, 'Custom profile');
            assert.equal(tile.querySelector('.dashboard-media-button-icon')?.textContent, '★');
            assert.equal(tile.querySelector('.dashboard-profile-card'), null, 'profile content must be removed');
            assert.equal(tile.querySelector('.dashboard-action-tile'), null, 'action content must be removed');
            assert.equal(tile.querySelector('.dashboard-media-button-tile').tagName, 'A');
            assert.equal(tile.querySelector('.dashboard-media-button-tile').getAttribute('href'), '/profile');
            window.document.querySelector('#customize-dashboard').click();
            await new Promise(resolve => setTimeout(resolve, 10));
            tile = window.document.querySelector('.dashboard-tile.editing');
            tile.querySelector('.dashboard-tile-settings').click();
            assert.equal(window.document.querySelector('#dashboard-content-mode').value, 'media-button');
            assert.equal(window.document.querySelector('#dashboard-custom-title').value, 'Custom profile');
            assert.equal(window.document.querySelector('#dashboard-custom-icon').value, '★');
            assert.equal(window.document.querySelector('#dashboard-media-fit').value, 'cover');
            assert.equal(window.document.querySelector('#dashboard-media-overlay').value, 'dark');
            const mode = window.document.querySelector('#dashboard-content-mode');
            mode.value = 'standard';
            mode.dispatchEvent(new window.Event('change', { bubbles: true }));
            tile = window.document.querySelector('.dashboard-tile.editing');
            assert.ok(tile.querySelector('.dashboard-profile-card'), 'standard mode should restore profile content');
            assert.equal(tile.querySelector('.dashboard-media-button-tile'), null);
            console.log('Square grid and full custom media renderer passed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Final build checks
        run: |
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
      - name: Show Worker log on failure
        if: failure()
        run: cat /tmp/worker.log || true
