name: Apply Mobile Square Dashboard

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/mobile-square-dashboard' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: |
          set +e
          node scripts/patch-mobile-square-dashboard.mjs > mobile-patch-error.txt 2>&1
          status=$?
          cat mobile-patch-error.txt
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add mobile-patch-error.txt
            git commit -m "Record mobile dashboard patch failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi
          rm mobile-patch-error.txt
      - name: Verify implementation
        run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
          grep -q 'const MOBILE_GRID_COLUMNS = 2' public/dashboard.js
          grep -q 'packMobileTiles' public/dashboard.js
          grep -q 'Mobile keeps the square-cell system' public/dashboard.css
          ! grep -q 'grid-template-columns:1fr!important;grid-template-rows:none!important' public/dashboard.css
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A public/dashboard.js public/dashboard.css mobile-patch-error.txt
          git commit -m "Restore a two-column square dashboard on mobile"
          git push origin HEAD:${{ github.head_ref }}
