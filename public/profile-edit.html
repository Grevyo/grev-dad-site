<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Edit Profile</title><link rel="stylesheet" href="/styles.css"/></head><body><main><h1>Edit Profile</h1><p id="edit-status">Loading...</p><form id="profile-edit-form" class="profile-edit-form profile-edit-grid profile-custom-fields">
<section class="edit-card"><h2>Identity</h2><label>Display name<input name="display_name" maxlength="64"></label><label>Profile title<input name="profile_title" maxlength="120"></label><label>Status message<input name="status_message" maxlength="140"></label><label>Bio<textarea name="bio" maxlength="2000"></textarea></label></section>
<section class="edit-card"><h2>Images</h2><label>Avatar URL<input name="avatar_url" maxlength="500"></label><label>Banner URL<input name="banner_url" maxlength="500"></label></section>
<section class="edit-card"><h2>Links</h2><label>Website URL<input name="website_url" maxlength="200"></label><label>Steam URL<input name="steam_url" maxlength="300" placeholder="https://steamcommunity.com/id/..."/></label></section>
<section class="edit-card"><h2>Colours / Theme</h2><label>Favourite colour<input type="color" name="favourite_colour"></label><label>Profile accent colour<input type="color" name="profile_accent_colour"></label><label>Profile background colour<input type="color" name="profile_background_colour"></label></section>
<button type="submit" class="nav-button">Save Profile</button></form></main>
<script>const colourDefaults={favourite_colour:'#88aaff',profile_accent_colour:'#88aaff',profile_background_colour:'#0b1020'};let unlocks=[];async function load(){const s=document.getElementById('edit-status');const r=await fetch('/api/profile/me');const d=await r.json();if(!r.ok){s.textContent=d.error||'Load failed';return;}const p=d.profile||{};const f=document.getElementById('profile-edit-form');for(const k of ['display_name','profile_title','bio','website_url','steam_url','avatar_url','banner_url','status_message'])if(f.elements[k])f.elements[k].value=p[k]||'';for(const k of Object.keys(colourDefaults))if(f.elements[k])f.elements[k].value=p[k]||colourDefaults[k];s.textContent='Loaded.';}document.getElementById('profile-edit-form').addEventListener('submit',async(e)=>{e.preventDefault();const f=e.target;const body={};for(const k of ['display_name','profile_title','bio','website_url','steam_url','avatar_url','banner_url','status_message'])body[k]=f.elements[k]?.value||'';for(const k of Object.keys(colourDefaults))body[k]=f.elements[k]?.value||'';const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();document.getElementById('edit-status').textContent=r.ok?'Saved profile settings.':(d.error||'Save failed');});load();</script></body></html>
