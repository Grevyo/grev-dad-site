name: Apply onboarding review fixes

on:
  push:
    branches:
      - agent/fix-onboarding-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-onboarding-review

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply fixes
        run: node scripts/apply-onboarding-review-fixes.mjs

      - name: Install dependencies without creating a lockfile
        run: npm install --package-lock=false

      - name: Type-check
        run: npm run typecheck

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden onboarding intention replacement"
          git push origin HEAD:agent/fix-onboarding-review
