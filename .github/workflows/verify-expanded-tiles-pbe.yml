name: Verify Expanded Tiles PBE

on:
  pull_request:
    branches:
      - pbe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Authenticate to deployed PBE
        shell: bash
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({identifier:"LADMIN",password:process.env.LADMIN_BOOTSTRAP_PASSWORD,rememberMe:false}))')
          for attempt in {1..30}; do
            status=$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --cookie-jar /tmp/cookies --request POST --header 'Content-Type: application/json' --data "$payload" https://pbe.grev.dad/api/auth/login || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 5
          done
          cat /tmp/login.json || true
          exit 1
      - name: Verify deployed grid API and assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            api_status=$(curl --silent --show-error --output /tmp/dashboard.json --write-out '%{http_code}' --cookie /tmp/cookies https://pbe.grev.dad/api/dashboard || true)
            page_status=$(curl --silent --show-error --output /tmp/dashboard.html --write-out '%{http_code}' --cookie /tmp/cookies https://pbe.grev.dad/dashboard || true)
            curl --silent --show-error --output /tmp/dashboard.js https://pbe.grev.dad/dashboard.js || true
            curl --silent --show-error --output /tmp/dashboard.css https://pbe.grev.dad/dashboard.css || true
            curl --silent --show-error --output /tmp/admin-dashboard.html --cookie /tmp/cookies https://pbe.grev.dad/admin/dashboard || true
            if [ "$api_status" = "200" ] && [ "$page_status" = "200" ] \
              && grep -q 'dashboard-selected-colour' /tmp/dashboard.html \
              && grep -q 'TILE_COLOURS' /tmp/dashboard.js \
              && grep -q 'data-colour="purple"' /tmp/dashboard.css \
              && grep -q 'value="6x4"' /tmp/admin-dashboard.html; then
              break
            fi
            sleep 5
          done
          test "$api_status" = "200"
          test "$page_status" = "200"
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/dashboard.json', 'utf8'));
          if (!payload.ok) throw new Error('Dashboard API did not return ok.');
          if (!Array.isArray(payload.grid?.dimensions) || payload.grid.dimensions.length !== 24 || !payload.grid.dimensions.includes('6x4')) throw new Error('Expanded 24-size grid is not deployed.');
          const profile = payload.features.find(item => item.id === 'feature-profile');
          if (!profile || !profile.allowedDimensions.includes('6x4')) throw new Error('Built-in feature sizes are not expanded.');
          if ((payload.pinnedTiles ?? []).some(tile => typeof tile.tileColour !== 'string')) throw new Error('Pinned tile colour values are missing.');
          console.log(JSON.stringify({dimensions:payload.grid.dimensions.length,largest:'6x4',profileSizes:profile.allowedDimensions.length,pinnedColours:(payload.pinnedTiles ?? []).map(tile=>tile.tileColour)}, null, 2));
          NODE
          grep -q 'dashboard-selected-colour' /tmp/dashboard.html
          grep -q 'TILE_COLOURS' /tmp/dashboard.js
          grep -q 'data-colour="purple"' /tmp/dashboard.css
          grep -q 'value="6x4"' /tmp/admin-dashboard.html
          printf 'Expanded tile sizes and per-user colour controls are deployed.\n'
