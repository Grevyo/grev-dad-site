<!doctype html>
<html><head><meta charset='utf-8'><title>Login</title></head>
<body>
  <h1>Login</h1>
  <p>Email addresses are not required. Log in using your username and password.</p>
  <form id='f'>
    <input name='username' placeholder='username' required>
    <input name='password' type='password' placeholder='password' required>
    <button>Login</button>
  </form>
  <pre id='out'></pre>
<script>
async function parseJsonSafe(response){const text=await response.text();if(!text){return{ok:response.ok,error:response.ok?null:'Empty response body'}};try{return JSON.parse(text);}catch{return{ok:false,error:'Invalid JSON response',status:response.status,raw:text}}}
document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const f=new FormData(e.target);const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});const data=await parseJsonSafe(response);document.getElementById('out').textContent=data.ok?'Success: logged in as '+(data.user&&data.user.username?data.user.username:'user'):'Error: '+(data.error||'Login failed');};
</script>
</body></html>
