name: Record Direct Dashboard Opener Verification
on:
  push:
    branches: [agent/full-dashboard-profile-upgrade]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify direct opener
        run: |
          set +e
          mkdir -p .github/verification
          LOG=.github/verification/direct-dashboard-opener.txt
          : > "$LOG"
          npm install >> "$LOG" 2>&1
          npm install --no-save playwright@1.55.0 >> "$LOG" 2>&1
          npx playwright install --with-deps chromium >> "$LOG" 2>&1
          npm run typecheck >> "$LOG" 2>&1
          type_status=$?
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply grev-dad-dev --local >> "$LOG" 2>&1
          migration_status=$?
          npx wrangler dev --local --port 8787 > /tmp/direct-opener-wrangler.log 2>&1 &
          server_pid=$!
          ready=0
          for attempt in $(seq 1 90); do if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then ready=1; break; fi; sleep 1; done
          browser_status=1
          if [ "$ready" -eq 1 ]; then timeout --signal=INT 240s node .github/scripts/verify-direct-dashboard-opener.cjs >> "$LOG" 2>&1; browser_status=$?; fi
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          echo '## Wrangler log' >> "$LOG"
          cat /tmp/direct-opener-wrangler.log >> "$LOG"
          echo "TYPECHECK_STATUS=$type_status" >> "$LOG"
          echo "MIGRATION_STATUS=$migration_status" >> "$LOG"
          echo "BROWSER_STATUS=$browser_status" >> "$LOG"
          if [ "$type_status" -eq 0 ] && [ "$migration_status" -eq 0 ] && [ "$browser_status" -eq 0 ]; then echo 'OVERALL=PASS' >> "$LOG"; else echo 'OVERALL=FAIL' >> "$LOG"; fi
          git rm .github/workflows/record-direct-dashboard-opener.yml .github/scripts/verify-direct-dashboard-opener.cjs
          git rm -f .github/verification/run-direct-opener.trigger
          git config user.name "grev-dad-verification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$LOG"
          git commit -m "Record direct dashboard opener verification"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
