<!doctype html><html><head><meta charset='utf-8'><title>Admin</title><link rel='stylesheet' href='/styles/site.css'></head><body><main><h1>Admin</h1><pre id='me'></pre><h2>Promote user</h2><form id='promote'><input name='identity' placeholder='username or email'><button>Make admin</button></form><h2>Users</h2><pre id='users'></pre></main><script>
async function load(){const r=await fetch('/api/admin/users');const d=await r.json();document.getElementById('users').textContent=JSON.stringify(d,null,2);document.getElementById('me').textContent=d.currentUser?`Logged in as ${d.currentUser.username}`:'Not authorized';}
document.getElementById('promote').onsubmit=async(e)=>{e.preventDefault();const identity=new FormData(e.target).get('identity');await fetch('/api/admin/make-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:identity})});load();};load();
</script></body></html>
