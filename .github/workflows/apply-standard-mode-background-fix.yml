name: Apply Standard Mode Background Fix

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/custom-media-buttons-square-grid' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-standard-mode-background.mjs
      - run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/dashboard.js
          git commit -m "Restore solid background when leaving empty media mode"
          git push origin HEAD:${{ github.head_ref }}
