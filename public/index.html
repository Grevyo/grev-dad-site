<!doctype html><html><head><meta charset='utf-8'><title>grev.dad</title><link rel='stylesheet' href='/styles/site.css'></head><body><main><h1>grev.dad</h1><p><a href='/login.html'>Login</a> · <a href='/register.html'>Register</a> · <a href='/admin.html'>Admin</a></p><pre id='status'>Loading...</pre></main><script>
async function j(r){const t=await r.text();try{return t?JSON.parse(t):{ok:false,error:'Empty response body'};}catch{return{ok:false,error:'Invalid JSON response',raw:t};}}
(async()=>{const d=await j(await fetch('/api/auth/me'));document.getElementById('status').textContent=d.authenticated?`Logged in as ${d.user.username}${d.user.isAdmin?' (admin)':''}`:'Logged out';})();
</script></body></html>
