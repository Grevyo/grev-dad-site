<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grev - Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <div id="authStatus">Checking login...</div>
      <h1>Admin</h1>

      <section aria-labelledby="force-refresh-heading">
        <h2 id="force-refresh-heading">Force Refresh Site</h2>
        <p>Use this after pushing changes if the live site still looks stale.</p>

        <div>
          <button id="purge-cache-btn" type="button">Purge Cache</button>
          <button id="redeploy-btn" type="button">Trigger Redeploy</button>
          <button id="refresh-all-btn" type="button">Purge Cache + Trigger Redeploy</button>
        </div>

        <p id="refresh-config" role="status" aria-live="polite">Loading configuration status...</p>
        <p id="refresh-loading" role="status" aria-live="polite"></p>
        <p id="refresh-message" role="status" aria-live="polite"></p>
        <pre id="refresh-last-result" aria-live="polite"></pre>
      </section>

      <section aria-labelledby="users-heading">
        <h2 id="users-heading">Users</h2>
        <p id="users-status" role="status" aria-live="polite">Loading users...</p>
        <table>
          <thead><tr><th>Username</th><th>Role</th><th>Balance</th><th>Created</th><th>Set Role</th></tr></thead>
          <tbody id="users-body"></tbody>
        </table>
      </section>
    </main>

    <script>
      const refreshConfigEl = document.getElementById('refresh-config');
      const refreshLoadingEl = document.getElementById('refresh-loading');
      const refreshMessageEl = document.getElementById('refresh-message');
      const refreshLastResultEl = document.getElementById('refresh-last-result');
      const usersStatusEl = document.getElementById('users-status');
      const usersBodyEl = document.getElementById('users-body');
      const roleOptions = ['admin', 'operator', 'og', 'member'];

      const buttons = {
        purge: document.getElementById('purge-cache-btn'),
        redeploy: document.getElementById('redeploy-btn'),
        all: document.getElementById('refresh-all-btn'),
      };

      function setLoading(isLoading, label) {
        buttons.purge.disabled = isLoading;
        buttons.redeploy.disabled = isLoading;
        buttons.all.disabled = isLoading;
        refreshLoadingEl.textContent = isLoading ? `Working: ${label}...` : '';
      }

      async function safeJsonRequest(path, options) {
        const response = await fetch(path, options);
        const text = await response.text();
        let data = null;

        if (text) {
          try {
            data = JSON.parse(text);
          } catch {
            throw new Error('Server returned invalid JSON');
          }
        }

        if (!response.ok) {
          const message = data?.error || text || `Request failed (${response.status})`;
          throw new Error(message);
        }

        return data || {};
      }

      function showLastResult(data) {
        refreshLastResultEl.textContent = JSON.stringify(data, null, 2);
      }

      function renderConfig(config) {
        refreshConfigEl.textContent =
          `Configured — API Token: ${config.cloudflareApiToken ? 'Yes' : 'No'}, ` +
          `Zone ID: ${config.cloudflareZoneId ? 'Yes' : 'No'}, ` +
          `Deploy Hook: ${config.cloudflareDeployHookUrl ? 'Yes' : 'No'}`;
      }

      async function loadStatus() {
        refreshMessageEl.textContent = '';
        try {
          const data = await safeJsonRequest('/api/admin/refresh/status', { method: 'GET' });
          if (!data.ok || !data.configured) {
            refreshConfigEl.textContent = data.error || 'Failed to load configuration status';
            showLastResult(data);
            return;
          }

          renderConfig(data.configured);
          showLastResult(data);
        } catch (error) {
          refreshConfigEl.textContent = error.message || 'Failed to load configuration status';
        }
      }

      async function updateRole(userId, role) {
        await safeJsonRequest(`/api/admin/users/${userId}/role`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role }),
        });
      }

      function renderUsers(users) {
        usersBodyEl.textContent = '';
        users.forEach((user) => {
          const tr = document.createElement('tr');
          const roleSelect = document.createElement('select');
          roleOptions.forEach((role) => {
            const option = document.createElement('option');
            option.value = role;
            option.textContent = role === 'og' ? 'OG' : role[0].toUpperCase() + role.slice(1);
            if (user.role === role) option.selected = true;
            roleSelect.append(option);
          });
          roleSelect.addEventListener('change', async () => {
            roleSelect.disabled = true;
            usersStatusEl.textContent = `Updating role for ${user.username}...`;
            try {
              await updateRole(user.id, roleSelect.value);
              usersStatusEl.textContent = `Updated role for ${user.username}.`;
              await loadUsers();
            } catch (error) {
              usersStatusEl.textContent = `Failed role update: ${error.message}`;
              roleSelect.disabled = false;
            }
          });
          tr.innerHTML = `<td>${user.username}</td><td>${user.roleLabel}</td><td>${user.balance_cents ?? ''}</td><td>${user.created_at ?? ''}</td>`;
          const roleCell = document.createElement('td');
          roleCell.append(roleSelect);
          tr.append(roleCell);
          usersBodyEl.append(tr);
        });
      }

      async function loadUsers() {
        try {
          const data = await safeJsonRequest('/api/admin/users', { method: 'GET' });
          renderUsers(data.users || []);
          usersStatusEl.textContent = `Loaded ${data.users?.length || 0} users.`;
        } catch (error) {
          usersStatusEl.textContent = `Failed to load users: ${error.message}`;
        }
      }

      async function runAction(label, path) {
        refreshMessageEl.textContent = '';
        setLoading(true, label);

        try {
          const data = await safeJsonRequest(path, { method: 'POST' });
          refreshMessageEl.textContent = data.ok ? `${label} succeeded.` : `${label} finished with errors.`;
          showLastResult(data);
          await loadStatus();
        } catch (error) {
          refreshMessageEl.textContent = `${label} failed: ${error.message || 'Unknown error'}`;
        } finally {
          setLoading(false, label);
        }
      }

      buttons.purge.addEventListener('click', () => runAction('Purge Cache', '/api/admin/refresh/purge-cache'));
      buttons.redeploy.addEventListener('click', () => runAction('Trigger Redeploy', '/api/admin/refresh/redeploy'));
      buttons.all.addEventListener('click', () => runAction('Purge Cache + Trigger Redeploy', '/api/admin/refresh/all'));

      loadStatus();
      loadUsers();
    </script>
      <script src="/scripts/auth-status.js"></script>
  </body>
</html>
