name: Apply Action And Content Dashboard Tiles

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/action-and-content-dashboard-tiles' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply action and content tile patch
        run: node scripts/patch-action-content-dashboard-tiles.mjs
      - name: Check browser JavaScript
        run: |
          node --check public/dashboard.js
          node --check public/admin-dashboard.js
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check PBE Worker bundle
        run: npx wrangler deploy --dry-run --env pbe
      - name: Apply complete local migration chain
        run: |
          rm -rf .tmp-action-content-d1
          npx wrangler d1 migrations apply grev-dad-preview --local --env pbe --persist-to .tmp-action-content-d1
      - name: Verify presentation migration
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx wrangler d1 execute grev-dad-preview --local --env pbe --persist-to .tmp-action-content-d1 --command "SELECT id,tile_presentation FROM dashboard_features WHERE id IN ('feature-profile','feature-grev-news','feature-settings') ORDER BY id")
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'feature-profile'
          printf '%s\n' "$output" | grep -q 'feature-grev-news'
          printf '%s\n' "$output" | grep -q 'feature-settings'
          test "$(printf '%s\n' "$output" | grep -o 'content' | wc -l)" -ge 2
          printf '%s\n' "$output" | grep -q 'action'
      - name: Check generated diff
        run: |
          git diff --check
          grep -q "dashboard-action-tile" public/dashboard.js
          grep -q "dashboard-profile-card" public/dashboard.js
          grep -q "dashboard-news-headline" public/dashboard.js
          grep -q "tile_presentation" src/dashboard.ts
          grep -q "dashboard-feature-presentation" public/admin-dashboard.html
      - name: Commit dashboard implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dashboard.ts public/dashboard.html public/dashboard.js public/dashboard.css public/admin-dashboard.html public/admin-dashboard.js
          git commit -m "Render navigation tiles as buttons and reserve content tiles for live information"
          git push origin HEAD:${{ github.head_ref }}
