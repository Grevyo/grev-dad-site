name: Record deployment release

on:
  workflow_run:
    workflows: ['Deploy PBE', 'Deploy Production']
    types: [completed]

permissions:
  contents: read

jobs:
  record:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Record deployed and previous commits
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.workflow_run.name }}" = "Deploy Production" ]; then
            target_env=production
            database=grev-dad-production
          else
            target_env=pbe
            database=grev-dad-preview
          fi
          sql="INSERT OR IGNORE INTO site_settings(setting_key,setting_value,updated_at) VALUES('release_previous_commit','',unixepoch()),('release_commit','',unixepoch()),('release_deployed_at','0',unixepoch()); UPDATE site_settings SET setting_value=COALESCE((SELECT setting_value FROM site_settings WHERE setting_key='release_commit'),''),updated_at=unixepoch() WHERE setting_key='release_previous_commit'; UPDATE site_settings SET setting_value='${DEPLOY_SHA}',updated_at=unixepoch() WHERE setting_key='release_commit'; UPDATE site_settings SET setting_value=CAST(strftime('%s','now') AS TEXT),updated_at=unixepoch() WHERE setting_key='release_deployed_at';"
          npx wrangler d1 execute "$database" --remote --env "$target_env" --command "$sql"
