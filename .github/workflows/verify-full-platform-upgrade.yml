name: Verify Full Platform Upgrade

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Browser syntax
        run: |
          node --check public/hub.js
          node --check public/platform-dashboard.js
          node --check public/dashboard-advanced.js
          node --check public/dashboard-collaboration.js
          node --check public/platform-profile.js
          node --check public/site-platform.js
          node --check public/chat-ui.js
      - name: Fresh migrations
        run: npx wrangler d1 migrations apply grev-dad-dev --local
