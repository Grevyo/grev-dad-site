<!doctype html><html><head><meta charset='utf-8'><title>Admin</title></head><body><main><h1>Admin</h1><form id='setup'><h3>First Admin Setup</h3><input name='username' placeholder='username' required><input name='secret' type='password' placeholder='ADMIN_SETUP_SECRET' required><button>Setup Admin</button></form><button id='logout'>Logout</button><h3>Users</h3><pre id='users'></pre><pre id='out'></pre></main><script>
async function j(r){const t=await r.text();try{return t?JSON.parse(t):{ok:false,error:'Empty response body'};}catch{return{ok:false,error:'Invalid JSON response',raw:t};}}
async function call(path,opt){return j(await fetch(path,opt));}
async function loadUsers(){document.getElementById('users').textContent=JSON.stringify(await call('/api/admin/users'),null,2);}loadUsers();
document.getElementById('setup').onsubmit=async(e)=>{e.preventDefault();const f=new FormData(e.target);document.getElementById('out').textContent=JSON.stringify(await call('/api/setup/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),secret:f.get('secret')})}),null,2);loadUsers();};
document.getElementById('logout').onclick=async()=>{document.getElementById('out').textContent=JSON.stringify(await call('/api/auth/logout',{method:'POST'}),null,2)};
</script></body></html>
