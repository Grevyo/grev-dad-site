name: Remove Dashboard Editor Autoscroll

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - name: Remove automatic scroll from Customize dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('public/dashboard.js')
          text=path.read_text()
          line="  requestAnimationFrame(() => dashboardElement('#dashboard-editor-toolbar')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));\n"
          if line not in text: raise SystemExit('Dashboard autoscroll target not found')
          path.write_text(text.replace(line,'',1))
          PY
      - name: Commit removal and remove workflow
        run: |
          git rm .github/workflows/remove-dashboard-editor-autoscroll.yml
          git config user.name "grev-dad-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/dashboard.js
          git commit -m "Keep dashboard position when opening editor"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
