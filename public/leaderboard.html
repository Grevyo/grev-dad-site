<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Leaderboard</title><link rel='stylesheet' href='/styles.css'/></head><body><header class='site-header'><a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a><nav id='authStatus' class='site-nav'>Checking login...</nav></header><main><h1>Level Leaderboard</h1><p id='lb-status'>Loading...</p><div id='lb' class='leaderboard-table'></div></main><script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script><script>(async()=>{const r=await fetch('/api/leaderboard/levels');const d=await r.json();if(!r.ok){lb-status.textContent=d.error||'Failed';return;}document.getElementById('lb').innerHTML=(d.leaderboard||[]).map(x=>`<div class='leaderboard-row'><strong>#${x.rankPosition}</strong>${window.renderPlayerCard(x,{showXp:true})}</div>`).join('');document.getElementById('lb-status').textContent='Loaded.';})();</script><script src='/scripts/theme.js'></script><script src='/scripts/auth-status.js'></script></body></html>
