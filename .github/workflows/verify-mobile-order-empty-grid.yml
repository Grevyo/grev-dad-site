name: Verify Mobile Order Empty Grid

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

jobs:
  verify:
    if: github.head_ref == 'agent/mobile-square-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --package-lock=false --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --directory public >/tmp/mobile-order-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/dashboard.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify forward-only order and immediate empty state
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const appearance={backgroundType:'solid',backgroundPrimary:'#11161d',backgroundSecondary:'#5268aa',backgroundAngle:135,backgroundMedia:null,textColour:'#f4f7fb',fontFamily:'system',borderColour:'#394657',contentMode:'standard',customTitle:null,customIcon:null,mediaFit:'cover',mediaOverlay:'dark'};
          const base={category:'Test',featureType:'link',presentation:'action',route:'/profile',iconText:'GD',audience:'all',defaultDimension:'1x1',defaultWidth:1,defaultHeight:1,allowedDimensions:['1x1','1x2','2x1','2x2'],isActive:true,isDefault:true,tileColour:'default',accessGroups:[],...appearance};
          const ordered=[
            {...base,id:'tall',slug:'tall',name:'Tall',sortOrder:1,pinned:true,x:0,y:0,width:1,height:2},
            {...base,id:'full',slug:'full',name:'Full width',sortOrder:2,pinned:true,x:2,y:1,width:2,height:1},
            {...base,id:'small',slug:'small',name:'Small',sortOrder:3,pinned:true,x:5,y:2,width:1,height:1}
          ];
          const session={authenticated:true,user:{id:'u1',username:'mobiletest',displayName:'Mobile Test',isOwner:false,isAdmin:false,isVerified:true}};
          const makePayload=tiles=>({ok:true,viewer:session.user,grid:{columns:8,dimensions:['1x1','1x2','2x1','2x2']},features:tiles.map(t=>({...t,backgroundMedia:null,hasBackgroundMedia:false})),pinnedTiles:tiles,preferences:{density:'comfortable',showDescriptions:true,tileGap:12,outerMargin:0},capabilities:{canCustomize:true,isAdmin:false,isOwner:false}});
          async function configure(page,payload){
            await page.route('**/api/onboarding',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,progress:{relationshipComplete:true,intentionsComplete:true}})}));
            await page.route('**/api/dashboard',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(payload)}));
            await page.route('**/api/auth/session',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(session)}));
            await page.route('**/api/bootstrap/owner-status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ownerConfigured:true,eligible:false})}));
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await configure(page,makePayload(ordered));
            await page.goto('http://127.0.0.1:8000/dashboard.html',{waitUntil:'networkidle'});
            await page.waitForSelector('.dashboard-tile');
            const mobile=await page.evaluate(()=>Object.fromEntries([...document.querySelectorAll('.dashboard-tile')].map(tile=>{const box=tile.getBoundingClientRect();return[tile.dataset.featureId,{top:box.top,bottom:box.bottom,left:box.left,right:box.right,row:tile.style.gridRow,column:tile.style.gridColumn}]})));
            assert.ok(mobile.full.top >= mobile.tall.bottom - 1, JSON.stringify(mobile));
            assert.ok(mobile.small.top >= mobile.full.bottom - 1, JSON.stringify(mobile));
            assert.equal(mobile.tall.row,'1 / span 2');
            assert.equal(mobile.full.row,'3 / span 1');
            assert.equal(mobile.small.row,'4 / span 1');
            await page.setViewportSize({width:1000,height:800});
            await page.waitForTimeout(150);
            const desktop=await page.evaluate(()=>Object.fromEntries([...document.querySelectorAll('.dashboard-tile')].map(tile=>[tile.dataset.featureId,{row:tile.style.gridRow,column:tile.style.gridColumn}])));
            assert.equal(desktop.tall.column,'1 / span 1');
            assert.equal(desktop.full.column,'3 / span 2');
            assert.equal(desktop.small.column,'6 / span 1');

            const emptyPage=await context.newPage();
            await configure(emptyPage,makePayload([]));
            await emptyPage.goto('http://127.0.0.1:8000/dashboard.html',{waitUntil:'networkidle'});
            await emptyPage.waitForSelector('#dashboard-empty:not([hidden])');
            const empty=await emptyPage.evaluate(()=>{const grid=document.querySelector('#dashboard-grid');const box=grid.getBoundingClientRect();const style=getComputedStyle(grid);const message=document.querySelector('#dashboard-empty').getBoundingClientRect();return{gridHeight:box.height,gridBottom:box.bottom,rows:style.gridTemplateRows,minHeight:style.minHeight,marginTop:style.marginTop,padding:style.padding,messageTop:message.top,scrollWidth:document.documentElement.scrollWidth,summary:document.querySelector('#dashboard-grid-summary')?.textContent}});
            assert.ok(empty.gridHeight <= 1, JSON.stringify(empty));
            assert.equal(empty.rows,'none');
            assert.equal(empty.minHeight,'0px');
            assert.equal(empty.marginTop,'0px');
            assert.equal(empty.padding,'0px');
            assert.ok(empty.messageTop - empty.gridBottom < 2, JSON.stringify(empty));
            assert.ok(empty.scrollWidth <= 390, JSON.stringify(empty));
            assert.ok(empty.summary.includes('0 rows'), empty.summary);
            await browser.close();
            console.log(JSON.stringify({mobile,desktop,empty},null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - run: |
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
          git diff --check
