<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Profile</title><link rel="stylesheet" href="/styles.css" /></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main><h1>Profile</h1><p id="profile-status">Loading...</p><div id="profile-view"></div></main>
<script>
let meId=null;const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return ((p[0]?.[0]||'?')+(p[1]?.[0]||'')).toUpperCase();};
function showcaseMarkup(showcase){const slots=Array.isArray(showcase)?showcase:[];const rarityColor={common:'#9ca8b7',uncommon:'#2f8f4e',rare:'#2e7dff',epic:'#8a4fff',legendary:'#d49100'};return `<section><h2>Showcase</h2><div class='showcase-grid'>${[1,2,3,4].map(i=>{const slot=slots.find(s=>Number(s.slot)===i);const u=slot?.unlock;if(!u)return `<article class='showcase-slot showcase-slot-empty'><div class='showcase-title'>Slot ${i}</div><div>Empty showcase slot</div></article>`;return `<article class='showcase-slot'><div class='showcase-icon'>${u.icon_url?`<img src='${esc(u.icon_url)}' alt='icon'/>`:'▣'}</div><div class='showcase-title'>${esc(u.name)}</div><div class='showcase-meta'>${esc(u.unlock_type)} · <span class='showcase-rarity' style='color:${rarityColor[u.rarity]||'#9ca8b7'}'>${esc(u.rarity)}</span></div>${u.description?`<div>${esc(u.description)}</div>`:''}</article>`;}).join('')}</div></section>`;}
function render(p){const own=meId===p.id;const showLevel=Number(p.show_level)!==0;const showRank=Number(p.show_rank)!==0;const banner=p.banner_url?`<img class='profile-banner' src='${esc(p.banner_url)}' alt='banner'/>`:'';const avatar=p.avatar_url?`<img class='profile-avatar' src='${esc(p.avatar_url)}' alt='avatar'/>`:`<div class='profile-avatar profile-avatar-fallback'>${initials(p.display_name||p.username)}</div>`;const accent=p.profile_accent_colour?`style='border-color:${esc(p.profile_accent_colour)}'`:'';document.getElementById('profile-view').innerHTML=`${banner}<section class='profile-top-box' ${accent}><div>${avatar}</div><div class='profile-identity'><div class='profile-display-name'>${esc(p.display_name||p.username)}</div><div class='profile-username'>@${esc(p.username)}</div>${p.profile_title?`<div>${esc(p.profile_title)}</div>`:''}<div>${esc(p.roleLabel||p.role)}</div>${showLevel?`<div>Level ${p.accountLevel}</div><div class='xp-bar'><div class='xp-bar-fill' style='width:${p.accountXpPercent}%;'></div></div><div>XP: ${p.accountXpCurrent}/${p.accountXpRequired}</div>`:''}${showRank?`<div>Rank: ${esc(p.rank?.name||'Unranked')}</div>`:''}${p.location?`<div>${esc(p.location)}</div>`:''}${p.website_url?`<div><a href='${esc(p.website_url)}' target='_blank' rel='noopener'>${esc(p.website_url)}</a></div>`:''}${p.bio?`<p>${esc(p.bio)}</p>`:''}<div class='profile-actions'>${own?"<a class='nav-button' href='/profile-edit.html'>Edit Profile</a> <a class='nav-button' href='/profile-edit.html#showcase-editor'>Edit Showcase</a> <a class='nav-button' href='/account.html'>Account Settings</a>":''}</div></div></section>${showcaseMarkup(p.showcase)}`;}
async function load(){const me=await (await fetch('/api/auth/me')).json();meId=me?.user?.id||null;const id=new URLSearchParams(location.search).get('id');const r=await fetch(id?`/api/profile?id=${encodeURIComponent(id)}`:'/api/profile/me');const d=await r.json();document.getElementById('profile-status').textContent=r.ok?'Loaded.':(d.error||'Load failed');if(r.ok)render(d.profile);} load();
</script><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script></body></html>
