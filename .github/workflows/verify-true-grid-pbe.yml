name: Verify True Grid PBE

on:
  pull_request:
    branches:
      - pbe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Authenticate to deployed PBE
        shell: bash
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({identifier:"LADMIN",password:process.env.LADMIN_BOOTSTRAP_PASSWORD,rememberMe:false}))')
          for attempt in {1..20}; do
            status=$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --cookie-jar /tmp/cookies --request POST --header 'Content-Type: application/json' --data "$payload" https://pbe.grev.dad/api/auth/login || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 5
          done
          cat /tmp/login.json || true
          exit 1

      - name: Verify deployed coordinate grid
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            status=$(curl --silent --show-error --output /tmp/dashboard.json --write-out '%{http_code}' --cookie /tmp/cookies https://pbe.grev.dad/api/dashboard || true)
            if [ "$status" = "200" ] && node -e 'const p=require("/tmp/dashboard.json");process.exit(p.grid?.columns===6&&Array.isArray(p.grid?.dimensions)&&p.grid.dimensions.includes("1x1")&&p.grid.dimensions.includes("4x2")&&Number.isInteger(p.preferences?.tileGap)&&Number.isInteger(p.preferences?.outerMargin)&&p.pinnedTiles.every(t=>Number.isInteger(t.x)&&Number.isInteger(t.y)&&Number.isInteger(t.width)&&Number.isInteger(t.height))?0:1)'; then
              break
            fi
            sleep 5
          done
          cat /tmp/dashboard.json
          node - <<'NODE'
          const payload = require('/tmp/dashboard.json');
          if (payload.grid?.columns !== 6) throw new Error('Six-column grid is not deployed.');
          if (!payload.grid.dimensions.includes('1x1') || !payload.grid.dimensions.includes('4x2') || !payload.grid.dimensions.includes('6x3')) throw new Error('Grid dimension presets are incomplete.');
          if (!Number.isInteger(payload.preferences.tileGap) || !Number.isInteger(payload.preferences.outerMargin)) throw new Error('Grid spacing preferences are missing.');
          if (!payload.pinnedTiles.every(tile => Number.isInteger(tile.x) && Number.isInteger(tile.y) && Number.isInteger(tile.width) && Number.isInteger(tile.height))) throw new Error('Pinned tiles are missing coordinates.');
          console.log(JSON.stringify({
            columns: payload.grid.columns,
            dimensionPresets: payload.grid.dimensions.length,
            pinnedTiles: payload.pinnedTiles.length,
            tileGap: payload.preferences.tileGap,
            outerMargin: payload.preferences.outerMargin,
            tiles: payload.pinnedTiles.map(tile => ({name:tile.name,x:tile.x,y:tile.y,width:tile.width,height:tile.height}))
          }, null, 2));
          NODE

      - name: Verify deployed editor assets
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --output /tmp/dashboard.js https://pbe.grev.dad/dashboard.js
          curl --silent --show-error --fail --output /tmp/dashboard.css https://pbe.grev.dad/dashboard.css
          grep -q 'firstFreePlacement' /tmp/dashboard.js
          grep -q 'outerMargin' /tmp/dashboard.js
          grep -q 'dashboard-layout-canvas' /tmp/dashboard.css
          page_status=$(curl --silent --show-error --output /tmp/dashboard.html --write-out '%{http_code}' --cookie /tmp/cookies https://pbe.grev.dad/dashboard)
          test "$page_status" = "200"
          grep -q 'Pack tiles' /tmp/dashboard.html
          grep -q 'Tile gap' /tmp/dashboard.html
          grep -q 'Outer margin' /tmp/dashboard.html
