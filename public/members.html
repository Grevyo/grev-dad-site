<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Members</title><link rel="stylesheet" href="/styles.css" /></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main><h1>Members</h1><p id="members-status">Loading members...</p><table><thead><tr><th>Member</th><th>Role</th><th>Level</th><th>Rank</th></tr></thead><tbody id="members-body"></tbody></table></main>
<script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const init=n=>{const p=String(n||'?').trim().split(/\s+/);return ((p[0]?.[0]||'?')+(p[1]?.[0]||'')).toUpperCase();};
function render(members){const b=document.getElementById('members-body');b.textContent='';for(const m of members){const showLevel=Number(m.show_level)!==0;const showRank=Number(m.show_rank)!==0;const av=m.avatar_url?`<img class='compact-header-avatar' src='${esc(m.avatar_url)}' alt='avatar'/>`:`<span class='compact-header-avatar'>${init(m.display_name||m.username)}</span>`;const tr=document.createElement('tr');tr.innerHTML=`<td><div class='member-cell'>${av}<div><div>${esc(m.display_name||m.username)}</div><div class='header-username'><a href='/profile.html?id=${m.id}'>@${esc(m.username)}</a></div></div></div></td><td>${esc(m.roleLabel||m.role)}</td><td>${showLevel?(m.accountLevel||1):'-'}</td><td>${showRank?esc(m.rank?.name||'Unranked'):'-'}</td>`;b.append(tr);}}
(async()=>{const s=document.getElementById('members-status');const r=await fetch('/api/members');const d=await r.json();if(!r.ok){s.textContent=d.error||'Unable to load members.';return;}render(d.members||[]);s.textContent=`Loaded ${d.members?.length||0} members.`;})();
</script><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script></body></html>
