name: Apply Whole Tile Review Fixes

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/whole-tile-drag-settings-widescreen' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply review fixes
        run: node scripts/patch-whole-tile-review-fixes.mjs
      - name: Check browser code and Worker bundle
        run: |
          npm install --package-lock=false
          node --check public/dashboard.js
          npm run typecheck
          npx wrangler deploy --dry-run --env pbe
      - name: Verify review fixes
        run: |
          set -euo pipefail
          git diff --check
          grep -q "blockTileDrag" public/dashboard.js
          grep -q "max-height:686px" public/dashboard.css
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/dashboard.js public/dashboard.css
          git commit -m "Guard tile settings from drag and support short widescreen windows"
          git push origin HEAD:${{ github.head_ref }}
