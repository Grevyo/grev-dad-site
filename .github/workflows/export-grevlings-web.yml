name: Export Grevlings Web

on:
  workflow_dispatch:
  push:
    paths:
      - games_src/grevlings/**
      - .github/workflows/export-grevlings-web.yml

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4 headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true

      - name: Prepare artifact output directory
        run: |
          rm -rf out/grevlings-web-build
          mkdir -p out/grevlings-web-build

      - name: Export Web preset
        working-directory: games_src/grevlings
        run: godot --headless --verbose --path . --export-release "Web" ../../out/grevlings-web-build/index.html

      - name: Verify export output exists
        run: |
          test -f out/grevlings-web-build/index.html
          find out/grevlings-web-build -maxdepth 1 -name '*.wasm' -print -quit | grep -q .
          find out/grevlings-web-build -maxdepth 1 -name '*.pck' -print -quit | grep -q .
          find out/grevlings-web-build -maxdepth 1 -name '*.js' -print -quit | grep -q .

      - name: Warn on Cloudflare static asset size limit
        run: |
          limit_bytes=$((25 * 1024 * 1024))
          find out/grevlings-web-build -type f -print0 | while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if [ "$size" -gt "$limit_bytes" ]; then
              size_mib=$(awk -v bytes="$size" 'BEGIN { printf "%.1f", bytes / 1024 / 1024 }')
              echo "WARNING: $file (${size_mib} MiB)"
              echo "This file is too large for Cloudflare Workers/Pages static assets."
            fi
          done

      - name: Upload Grevlings web build artifact
        # Keep this workflow artifact-only: do not commit or copy exported Godot web files into public/.
        # Exported files are expected to be downloaded from this artifact and uploaded to Cloudflare R2
        # (or another large-file static host) because .wasm/.pck may exceed Workers/Pages asset limits.
        # public/games/grevlings remains a launcher page that points to the external build URL.
        uses: actions/upload-artifact@v4
        with:
          name: grevlings-web-build
          path: out/grevlings-web-build/
          if-no-files-found: error
