name: Apply Profile Popup Tuning

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/profile-popup-mobile-focus-desktop-size'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-popup-mobile-focus-desktop-size
      - name: Update popup behaviour and size
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('public/profile-editor-unified.js')
          js = js_path.read_text()
          focus_pattern = re.compile(
              r"queueMicrotask\(\(\) => \{\s*"
              r"dialog\.scrollTop = 0;\s*"
              r"dialog\.querySelector\('input:not\(\[type=\"file\"\]\),textarea,select'\)"
              r"\?\.focus\(\{ preventScroll: true \}\);\s*"
              r"\}\);"
          )
          replacement = """queueMicrotask(() => {
                dialog.scrollTop = 0;
                if (state.body) state.body.scrollTop = 0;
              });"""
          js, focus_count = focus_pattern.subn(replacement, js, count=1)
          if focus_count != 1:
              raise SystemExit(f'Expected one automatic-focus block, found {focus_count}.')
          js_path.write_text(js)

          css_path = Path('public/profile-editor-unified.css')
          css = css_path.read_text()
          size_pattern = re.compile(
              r"\.profile-unified-editor\{width:min\(920px,calc\(100vw - 28px\)\);"
              r"height:min\(820px,calc\(var\(--profile-visible-height,100dvh\) - 32px\)\);"
              r"max-height:calc\(var\(--profile-visible-height,100dvh\) - 32px\);"
          )
          size_replacement = (
              '.profile-unified-editor{width:min(1320px,calc(100vw - 48px));'
              'height:min(940px,calc(var(--profile-visible-height,100dvh) - 40px));'
              'max-height:calc(var(--profile-visible-height,100dvh) - 40px);'
          )
          css, size_count = size_pattern.subn(size_replacement, css, count=1)
          if size_count != 1:
              raise SystemExit(f'Expected one desktop popup size rule, found {size_count}.')
          css_path.write_text(css)
          PY
      - name: Commit branch changes
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-profile-popup-tuning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/profile-editor-unified.js public/profile-editor-unified.css
          git commit -m "Stop profile popup auto-focus and enlarge desktop modal"
          git push origin HEAD:agent/profile-popup-mobile-focus-desktop-size
