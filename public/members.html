<!doctype html><html><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Members</title><link rel='stylesheet' href='/styles.css'/></head><body><header class='site-header'><a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a><nav id='authStatus' class='site-nav'>Checking login...</nav></header><main><h1>Members</h1><p id='members-status'>Loading...</p><input id='member-search' placeholder='Search username' /><div id='members-grid' class='leaderboard-grid'></div></main><script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script><script>let all=[];function draw(){const q=(document.getElementById('member-search').value||'').toLowerCase();const rows=all.filter(m=>!q||String(m.username).toLowerCase().includes(q));document.getElementById('members-grid').innerHTML=rows.map(m=>window.renderPlayerCard(m,{showXp:true})).join('');}
(async()=>{const r=await fetch('/api/members');const d=await r.json();if(!r.ok){members-status.textContent=d.error||'Failed';return;}all=d.members||[];draw();document.getElementById('members-status').textContent=`Loaded ${all.length} members.`;document.getElementById('member-search').addEventListener('input',draw);})();</script><script src='/scripts/theme.js'></script><script src='/scripts/auth-status.js'></script></body></html>
