<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grev - Profile</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main class="profile-page-main"><h1>Profile Page</h1><p id="profile-status">Loading...</p><div id="profile-toolbar"></div><div id="profile-view"></div></main>
<script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script>
<script src='/scripts/api-cache.js'></script>
<script>
let meId=null,currentProfile=null,profileEditMode=false;
let profileDragState={widgetId:null,preview:null};
const DEFAULT_PROFILE_PAGE_LAYOUT={widgets:{'profile-card':{col:1,row:1,size:'4x2',enabled:true},bio:{col:1,row:3,size:'4x2',enabled:true},status:{col:1,row:5,size:'2x1',enabled:true},steam:{col:5,row:1,size:'2x2',enabled:true},leetify:{col:7,row:1,size:'2x2',enabled:true},showcase:{col:5,row:3,size:'4x2',enabled:true},links:{col:7,row:5,size:'2x1',enabled:true},progress:{col:5,row:5,size:'2x2',enabled:true}}};
const ALLOWED_SIZES=new Set(['2x1','2x2','4x1','4x2','4x3','4x4','6x2','6x4']);
const WIDGET_STYLE_KEYS=['profile-card','bio','status','steam','leetify','links','progress','showcase'];
const DEBUG_PROFILE_BG = localStorage.getItem('grev_debug_profile_bg') === '1';
const HEX=/^#[0-9a-fA-F]{6}$/;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const escAttr=esc;
function safeImageUrl(value){const text=String(value||'').trim();return /^https?:\/\//i.test(text)?text:'';}
const safeBackgroundSize=v=>['cover','contain','repeat','stretch','center'].includes(String(v))?v:'cover';
function parseProfileWidgetSize(size){const [w,h]=String(size||'2x2').split('x').map(Number);return {w:w||2,h:h||2};}
function parseProfileLayout(raw){try{const parsed=raw?JSON.parse(raw):{};const out=JSON.parse(JSON.stringify(DEFAULT_PROFILE_PAGE_LAYOUT));for(const [k,v] of Object.entries(parsed.widgets||{})){if(!out.widgets[k]||!v)continue;if(Number.isInteger(v.col)&&v.col>0)out.widgets[k].col=v.col;if(Number.isInteger(v.row)&&v.row>0)out.widgets[k].row=v.row;if(ALLOWED_SIZES.has(v.size))out.widgets[k].size=v.size;if(typeof v.enabled==='boolean')out.widgets[k].enabled=v.enabled;}return out;}catch{return JSON.parse(JSON.stringify(DEFAULT_PROFILE_PAGE_LAYOUT));}}
function normalizeWidgetStyles(raw){if(!raw)return{};let p;try{p=typeof raw==='string'?JSON.parse(raw):raw;}catch{return{}}if(!p||typeof p!=='object'||Array.isArray(p))return{};const out={};for(const k of Object.keys(p)){if(!WIDGET_STYLE_KEYS.includes(k))continue;const v=p[k]||{};const o={};for(const n of ['backgroundColour','textColour','borderColour','accentColour']){const c=String(v[n]||'').trim();o[n]=c&&HEX.test(c)?c:'';}o.opacity=Math.min(100,Math.max(0,Number.isInteger(Number(v.opacity))?Number(v.opacity):0));o.blur=Math.min(20,Math.max(0,Number.isInteger(Number(v.blur))?Number(v.blur):0));out[k]=o;}return out;}
function hexToRgba(hex,opacity){if(!hex||!HEX.test(hex))return 'transparent';const n=hex.slice(1);const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);return `rgba(${r}, ${g}, ${b}, ${Math.max(0,Math.min(100,opacity))/100})`;}
function getWidgetStyle(id){const s=(currentProfile.widgetStyleMap||{})[id]||{};const vars=[];if(s.backgroundColour&&s.opacity>0){vars.push(`--profile-widget-bg:${hexToRgba(s.backgroundColour,s.opacity)}`);}else{vars.push(`--profile-widget-bg:transparent`);}if(s.textColour)vars.push(`--profile-widget-text:${s.textColour}`);if(s.borderColour)vars.push(`--profile-widget-border:${s.borderColour}`);if(s.accentColour)vars.push(`--profile-widget-accent:${s.accentColour}`);vars.push(`--profile-widget-blur:${Math.max(0,s.blur||0)}px`);return vars.join(';');}
function widgetEnabledByData(id,p){if(id==='bio')return !!(p.bio||p.location||p.website_url);if(id==='status')return !!p.status_message;if(id==='steam')return !!p.steam_url;if(id==='leetify')return !!p.leetify_url;if(id==='showcase')return Array.isArray(p.showcase)&&p.showcase.some(s=>s?.unlock);if(id==='links')return !!(p.website_url||p.steam_url||p.leetify_url);return true;}
function createWidget(id,p){if(id==='profile-card'){let card='<div>Profile Card unavailable.</div>';try{card=window.renderPlayerCard?window.renderPlayerCard({...p},{variant:'full',showXp:true,useCardSettings:true,link:false}):card;}catch{}return `<div class='profile-widget-card'>${card}</div>`;}if(id==='bio')return `<div class='profile-widget-bio'><h3>Bio</h3><div>${esc(p.profile_title||'')}</div><div>${esc(p.location||'')}</div><p>${esc(p.bio||'No bio set.')}</p></div>`;if(id==='status')return `<div class='profile-widget-status'><h3>Status</h3><div>${esc(p.status_message||'No status set.')}</div></div>`;if(id==='links')return `<div class='profile-widget-links'><h3>Links</h3>${p.website_url?`<a href='${esc(p.website_url)}' target='_blank' rel='noopener'>Website</a><br>`:''}${p.steam_url?`<a href='${esc(p.steam_url)}' target='_blank' rel='noopener'>Steam</a><br>`:''}${p.leetify_url?`<a href='${esc(p.leetify_url)}' target='_blank' rel='noopener'>Leetify</a>`:''}</div>`;if(id==='progress')return `<div><h3>Level / Rank / XP</h3><div>Level ${esc(p.accountLevel||1)}</div><div>${esc(p.rank?.label||'Rank unavailable')}</div><div>${esc(p.accountXpCurrent||0)}/${esc(p.accountXpRequired||100)} XP</div></div>`;if(id==='showcase')return `<div class='profile-widget-showcase'><h3>Showcase</h3><div>${(p.showcase||[]).filter(s=>s.unlock).map(s=>esc(s.unlock.name)).join(', ')||'No showcase items.'}</div></div>`;if(id==='steam')return `<div class='profile-widget-steam'><h3>Steam Profile</h3><div id='steam-widget-body'>Loading…</div></div>`;if(id==='leetify'){const link=p.leetify_url?`<a href='${esc(p.leetify_url)}' target='_blank' rel='noopener'>Open Leetify profile</a>`:'No Leetify profile link set.';return `<div class='profile-widget-leetify'><h3>Leetify Profile</h3><div id='leetify-widget-body'>${link}${p.leetify_url?'<div>Loading Leetify stats...</div>':''}</div></div>`;}return '<div>Widget unavailable.</div>';}
function scheduleIdle(fn){ if ('requestIdleCallback' in window) requestIdleCallback(fn,{timeout:2000}); else setTimeout(fn,250); }
function renderProfileTilePositions(profileLayout,p){const board=document.getElementById('profile-page-board');board.innerHTML='';for(const [id,entry] of Object.entries(profileLayout.widgets)){const shouldShow=entry.enabled&&(widgetEnabledByData(id,p)||meId===p.id);if(!shouldShow)continue;const {w,h}=parseProfileWidgetSize(entry.size);const tile=document.createElement('article');tile.className=`profile-page-tile profile-widget-${id}`;tile.dataset.widgetId=id;tile.style.gridColumn=`${entry.col} / span ${w}`;tile.style.gridRow=`${entry.row} / span ${h}`;tile.style.cssText+=`;${getWidgetStyle(id)}`;tile.innerHTML=`${createWidget(id,p)}<div class='profile-page-edit-controls'><button type='button' class='profile-tile-drag-handle' data-profile-drag='${id}'>Move</button><button onclick="moveProfileWidget('${id}','left')">←</button><button onclick="moveProfileWidget('${id}','right')">→</button><button onclick="moveProfileWidget('${id}','up')">↑</button><button onclick="moveProfileWidget('${id}','down')">↓</button><select onchange="resizeProfileWidget('${id}',this.value)">${[...ALLOWED_SIZES].map(s=>`<option ${s===entry.size?'selected':''}>${s}</option>`).join('')}</select></div>`;board.append(tile);}initProfileTileDragging();scheduleIdle(()=>loadIntegrationWidgets(p));}

function getProfileBoardColumnCount(){const board=document.getElementById('profile-page-board');if(!board)return 12;const cols=getComputedStyle(board).gridTemplateColumns.split(' ').filter(Boolean).length;return Math.max(1,cols||12);}
function getProfileGridCellFromPointer(event){const board=document.getElementById('profile-page-board');if(!board)return{col:1,row:1};const rect=board.getBoundingClientRect();const styles=getComputedStyle(board);const cols=getProfileBoardColumnCount();const colGap=parseFloat(styles.columnGap)||0;const rowGap=parseFloat(styles.rowGap)||0;const colWidth=(rect.width-(cols-1)*colGap)/cols;const rowHeight=parseFloat(styles.gridAutoRows)||86;const x=Math.max(0,event.clientX-rect.left);const y=Math.max(0,event.clientY-rect.top);const col=Math.max(1,Math.min(cols,Math.floor(x/(colWidth+colGap))+1));const row=Math.max(1,Math.floor(y/(rowHeight+rowGap))+1);return{col,row};}
function ensureProfileDropPreview(){const board=document.getElementById('profile-page-board');if(!board)return null;let preview=board.querySelector('.profile-drop-preview');if(!preview){preview=document.createElement('div');preview.className='profile-drop-preview';preview.hidden=true;board.append(preview);}return preview;}
function handleProfileTileDragStart(event){if(!profileEditMode||!currentProfile||meId!==currentProfile.id)return;const handle=event.target.closest('.profile-tile-drag-handle');if(!handle)return;const widgetId=handle.dataset.profileDrag;const tile=handle.closest('.profile-page-tile');const entry=currentProfile.profileLayout.widgets[widgetId];if(!tile||!entry)return;event.preventDefault();profileDragState={widgetId,preview:ensureProfileDropPreview()};tile.classList.add('is-dragging');handleProfileTileDragOver(event);const move=(e)=>handleProfileTileDragOver(e);const up=(e)=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);handleProfileTileDrop(e);tile.classList.remove('is-dragging');};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);}
function handleProfileTileDragOver(event){if(!profileDragState.widgetId||!profileDragState.preview)return;const entry=currentProfile?.profileLayout?.widgets?.[profileDragState.widgetId];if(!entry)return;const target=getProfileGridCellFromPointer(event);const {w,h}=parseProfileWidgetSize(entry.size);profileDragState.preview.hidden=false;profileDragState.preview.style.gridColumn=`${target.col} / span ${w}`;profileDragState.preview.style.gridRow=`${target.row} / span ${h}`;}
function handleProfileTileDrop(event){const widgetId=profileDragState.widgetId;const preview=profileDragState.preview;if(preview)preview.hidden=true;if(!profileEditMode||!widgetId||!currentProfile?.profileLayout?.widgets?.[widgetId]){profileDragState={widgetId:null,preview:null};return;}const target=getProfileGridCellFromPointer(event);const entry=currentProfile.profileLayout.widgets[widgetId];const {w}=parseProfileWidgetSize(entry.size);entry.col=Math.max(1,Math.min(getProfileBoardColumnCount(),target.col));if(entry.col+w-1>getProfileBoardColumnCount())entry.col=Math.max(1,getProfileBoardColumnCount()-w+1);entry.row=Math.max(1,target.row);profileDragState={widgetId:null,preview:null};renderProfileTilePositions(currentProfile.profileLayout,currentProfile);document.getElementById('profile-page-board')?.classList.toggle('profile-page-editing',profileEditMode);const status=document.getElementById('profile-status');if(status)status.textContent='Layout changed. Save Layout to persist.';}
function initProfileTileDragging(){const board=document.getElementById('profile-page-board');if(!board||board.dataset.profileDraggingBound==='1')return;board.dataset.profileDraggingBound='1';board.addEventListener('pointerdown',handleProfileTileDragStart);}
function restoreProfileEditModeClass(){document.getElementById('profile-page-board')?.classList.toggle('profile-page-editing',profileEditMode);}
function moveProfileWidget(widgetId,d){const e=currentProfile.profileLayout.widgets[widgetId];if(!e)return;if(d==='left')e.col=Math.max(1,e.col-1);if(d==='right')e.col=Math.min(12,e.col+1);if(d==='up')e.row=Math.max(1,e.row-1);if(d==='down')e.row=Math.max(1,e.row+1);renderProfileTilePositions(currentProfile.profileLayout,currentProfile);restoreProfileEditModeClass();} 
function resizeProfileWidget(widgetId,size){if(!ALLOWED_SIZES.has(size))return;currentProfile.profileLayout.widgets[widgetId].size=size;renderProfileTilePositions(currentProfile.profileLayout,currentProfile);restoreProfileEditModeClass();} 
function createProfileEditControls(p){const own=meId===p.id;const toolbar=document.getElementById('profile-toolbar');if(!own){toolbar.innerHTML='';return;}toolbar.innerHTML=`<button class='nav-button' id='toggle-move-tiles'>Move Tiles</button><button class='nav-button' id='save-layout' hidden>Save Layout</button><button class='nav-button' id='cancel-layout' hidden>Cancel</button> <a class='nav-button' href='/profile-edit.html'>Edit Profile</a> <a class='nav-button' href='/profile-card-edit.html'>Edit Profile Card</a>`;const panel=document.getElementById('profile-layout-panel');const toggleBtn=document.getElementById('toggle-move-tiles');toggleBtn.onclick=()=>{profileEditMode=!profileEditMode;document.getElementById('profile-page-board').classList.toggle('profile-page-editing',profileEditMode);document.getElementById('save-layout').hidden=!profileEditMode;document.getElementById('cancel-layout').hidden=!profileEditMode;panel.hidden=!profileEditMode;toggleBtn.textContent=profileEditMode?'Done Moving':'Move Tiles';};document.getElementById('save-layout').onclick=saveProfilePageLayout;document.getElementById('cancel-layout').onclick=()=>location.reload();}
function buildPanel(p){const panel=document.getElementById('profile-layout-panel');const groups={Main:['profile-card','bio','status'],Connections:['steam','leetify','links'],Progress:['progress'],Collection:['showcase']};panel.innerHTML=`<h2>Move Tiles</h2>${Object.entries(groups).map(([g,ids])=>`<h3>${g}</h3>${ids.map(id=>`<div><label><input type='checkbox' data-widget='${id}' ${currentProfile.profileLayout.widgets[id].enabled?'checked':''}/> ${currentProfile.profileLayout.widgets[id].enabled?'Hide widget':'Show widget'}: ${id.replace('-',' ')}</label></div>`).join('')}`).join('')}`;panel.querySelectorAll('input[data-widget]').forEach(i=>i.onchange=()=>{currentProfile.profileLayout.widgets[i.dataset.widget].enabled=!!i.checked;renderProfileTilePositions(currentProfile.profileLayout,p);restoreProfileEditModeClass();buildPanel(p);});}
async function saveProfilePageLayout(){const body={profile_page_background_url:currentProfile.profile_page_background_url||'',profile_page_background_colour:currentProfile.profile_page_background_colour||'',profile_page_background_size:currentProfile.profile_page_background_size||'cover',profile_page_overlay_strength:Number(currentProfile.profile_page_overlay_strength||20),profile_page_tile_layout_json:JSON.stringify(currentProfile.profileLayout),profile_page_widget_settings_json:currentProfile.profile_page_widget_settings_json||JSON.stringify(currentProfile.widgetStyleMap||{})};const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...currentProfile,...body})});document.getElementById('profile-status').textContent=r.ok?'Layout saved.':'Save failed.';}
async function loadIntegrationWidgets(p){
  const userId=Number(p?.id);
  if(!userId)return;
  const jobs=[];
  const steamWidget=currentProfile?.profileLayout?.widgets?.steam;
  const leetifyWidget=currentProfile?.profileLayout?.widgets?.leetify;
  if(p.steam_url&&steamWidget?.enabled!==false&&document.getElementById('steam-widget-body'))jobs.push(loadSteamWidget(userId));
  if(p.leetify_url&&leetifyWidget?.enabled!==false&&document.getElementById('leetify-widget-body'))jobs.push(loadLeetifyWidget(userId));
  await Promise.allSettled(jobs);
}
async function loadSteamWidget(userId){
  const body=document.getElementById('steam-widget-body');
  if(!body)return;
  try{
    const url=`/api/integrations/steam/profile?user_id=${encodeURIComponent(userId)}`;
    const res=window.GREVApi?.fetchJsonCached
      ? await window.GREVApi.fetchJsonCached(url,{ttlMs:10*60*1000,cacheKey:`grev_api_cache:${url}`})
      : {data:await fetch(url).then((r)=>r.json())};
    const data=res.data||{};
    const steam=data.steam||data;
    if(!steam.available){
      body.innerHTML=`<p>${esc(steam.message||'Steam data unavailable.')}</p>`;
      return;
    }
    const steamAvatar=steam.avatarfull||steam.avatarFull||steam.avatarmedium||steam.avatarMedium||steam.avatar||steam.avatarIcon||'';
    const avatarUrl=safeImageUrl(steamAvatar);
    body.innerHTML=`
      <div class="integration-profile integration-steam-profile">
        ${avatarUrl?`<img class="integration-avatar steam-avatar" src="${escAttr(avatarUrl)}" alt="Steam avatar" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
        <div>
          <strong>${esc(steam.personaname||steam.steamID||'Steam Profile')}</strong>
          ${steam.onlineState?`<div>State: ${esc(steam.onlineState)}</div>`:''}
          ${steam.visibilityState?`<div>Visibility: ${esc(steam.visibilityState)}</div>`:''}
          ${steam.memberSince?`<div>Member since: ${esc(steam.memberSince)}</div>`:''}
          ${steam.steamLevel!=null ? `
            <div class="steam-level-badge" title="Steam Level">
              <span class="steam-level-ring">
                <span class="steam-level-number">${esc(steam.steamLevel)}</span>
              </span>
              <span class="steam-level-label">Steam Level</span>
            </div>
          ` : `
            <div class="steam-level-unavailable">
              Steam level unavailable${steam.steamLevelUnavailableReason ? ` — ${esc(steam.steamLevelUnavailableReason)}` : ''}
            </div>
          `}
          ${steam.steamLevelSource?`<small>Source: ${esc(steam.steamLevelSource === 'public-profile-html' ? 'public profile' : 'Steam API')}</small>`:''}
          ${steam.profileUrl?`<a href="${escAttr(steam.profileUrl)}" target="_blank" rel="noopener">Open Steam profile</a>`:''}
        </div>
      </div>
    `;
  }catch(error){
    console.error('[profile] Steam widget failed',error);
    body.textContent='Steam data unavailable.';
  }
}
async function loadLeetifyWidget(userId){
  const body=document.getElementById('leetify-widget-body');
  if(!body)return;
  try{
    const debug=localStorage.getItem('grev_debug_integrations')==='1';
    const url=`/api/integrations/leetify/profile?user_id=${encodeURIComponent(userId)}${debug?'&debug=1':''}`;
    const fetchOptions=debug?{headers:{'x-grev-debug-integrations':'1'}}:{};
    const res=window.GREVApi?.fetchJsonCached
      ? await window.GREVApi.fetchJsonCached(url,{ttlMs:10*60*1000,cacheKey:`grev_api_cache:${url}`,...fetchOptions})
      : {data:await fetch(url,fetchOptions).then((r)=>r.json())};
    const data=res.data||{};
    if(!data.available){
      const debugDetails=localStorage.getItem('grev_debug_integrations')==='1'&&Array.isArray(data.attempts)
        ? `<details class="integration-debug"><summary>Leetify debug</summary><pre>${esc(JSON.stringify(data.attempts,null,2))}</pre></details>`
        : '';
      body.innerHTML=`
        ${data.profileUrl?`<a href="${escAttr(data.profileUrl)}" target="_blank" rel="noopener">Open Leetify profile</a>`:''}
        <p>${esc(data.reason||'Leetify data unavailable.')}</p>
        ${debugDetails}
      `;
      return;
    }
    body.innerHTML=`
      <div class="integration-profile integration-leetify-profile">
        <div>
          <strong>${esc(data.nickname||data.name||'Leetify Profile')}</strong>
          ${data.csRank?`<div>Counter-Strike rank: ${esc(data.csRank)}</div>`:'<div>Counter-Strike rank: unavailable</div>'}
          ${data.leetifyRating!=null?`<div>Leetify rating: ${esc(data.leetifyRating)}</div>`:''}
          ${data.aimRating!=null?`<div>Aim: ${esc(data.aimRating)}</div>`:''}
          ${data.positioningRating!=null?`<div>Positioning: ${esc(data.positioningRating)}</div>`:''}
          ${data.utilityRating!=null?`<div>Utility: ${esc(data.utilityRating)}</div>`:''}
          ${data.clutchRating!=null?`<div>Clutch: ${esc(data.clutchRating)}</div>`:''}
          ${data.recentMatchesCount!=null?`<div>Recent matches: ${esc(data.recentMatchesCount)}</div>`:''}
          ${data.profileUrl?`<a href="${escAttr(data.profileUrl)}" target="_blank" rel="noopener">Open Leetify profile</a>`:''}
        </div>
      </div>
    `;
    currentProfile.leetifyData=data;
    updateProfileCardWidgetWithLeetifyData();
  }catch(error){
    console.error('[profile] Leetify widget failed',error);
    body.textContent='Leetify data unavailable.';
  }
}
function updateProfileCardWidgetWithLeetifyData(){
  const tile=document.querySelector('.profile-widget-profile-card');
  if(!tile||!currentProfile||!window.renderPlayerCard)return;
  const card=window.renderPlayerCard({...currentProfile},{variant:'full',showXp:true,useCardSettings:true,link:false});
  const host=tile.querySelector('.profile-widget-card');
  if(host)host.innerHTML=card;
}
function render(p){currentProfile=p;currentProfile.profileLayout=parseProfileLayout(p.profile_page_tile_layout_json);currentProfile.widgetStyleMap=normalizeWidgetStyles(p.profile_page_widget_settings_json);const bgMode=safeBackgroundSize(p.profile_page_background_size||'cover');const bgUrl=String(p.profile_page_background_url||'').trim();const bgColour=String(p.profile_page_background_colour||'').trim();const overlayRaw=Number(p.profile_page_overlay_strength??20);const overlay=Math.min(80,Math.max(0,Number.isFinite(overlayRaw)?overlayRaw:20));if(DEBUG_PROFILE_BG){console.debug('[profile:bg]',{profile_page_background_url:p.profile_page_background_url,profile_page_background_colour:p.profile_page_background_colour,profile_page_background_size:p.profile_page_background_size,profile_page_overlay_strength:p.profile_page_overlay_strength});}const shell=document.createElement('section');shell.className='profile-page-custom-shell';shell.style.setProperty('--profile-overlay',bgUrl?String(overlay/100):'0');shell.style.setProperty('--profile-page-bg-colour',bgColour||'transparent');if(bgUrl){shell.style.setProperty('--profile-page-bg-image',`url("${bgUrl.replace(/"/g,'%22')}")`);}else{shell.style.setProperty('--profile-page-bg-image','none');}if(bgMode==='stretch'){shell.style.setProperty('--profile-page-bg-size','100% 100%');shell.style.setProperty('--profile-page-bg-repeat','no-repeat');shell.style.setProperty('--profile-page-bg-position','center top');}else if(bgMode==='repeat'){shell.style.setProperty('--profile-page-bg-size','auto');shell.style.setProperty('--profile-page-bg-repeat','repeat');shell.style.setProperty('--profile-page-bg-position','center top');}else if(bgMode==='center'){shell.style.setProperty('--profile-page-bg-size','auto');shell.style.setProperty('--profile-page-bg-repeat','no-repeat');shell.style.setProperty('--profile-page-bg-position','center center');}else{shell.style.setProperty('--profile-page-bg-size',bgMode);shell.style.setProperty('--profile-page-bg-repeat','no-repeat');shell.style.setProperty('--profile-page-bg-position','center top');}shell.innerHTML=`${p.banner_url?`<section class='profile-page-banner profile-banner-size-${esc(p.banner_display_size||'wide')}' style='background-image:url("${esc(p.banner_url)}")'></section>`:''}<div class='profile-page-board-wrap'><section id='profile-page-board' class='profile-page-board'></section></div><aside id='profile-layout-panel' class='profile-layout-panel' hidden></aside>${p.profile_footer_url?`<section class='profile-page-footer-media profile-footer-size-${esc(p.profile_footer_display_size||'wide')}' style='background-image:url("${esc(p.profile_footer_url)}")'></section>`:''}`;const v=document.getElementById('profile-view');v.innerHTML='';v.append(shell);renderProfileTilePositions(currentProfile.profileLayout,p);createProfileEditControls(p);buildPanel(p);} 
async function load(){const statusEl=document.getElementById('profile-status');const id=new URLSearchParams(location.search).get('id');const bootstrapUrl=id?`/api/bootstrap/profile?id=${encodeURIComponent(id)}`:'/api/bootstrap/profile';try{const boot=window.GREVApi?.fetchJsonCached?await window.GREVApi.fetchJsonCached(bootstrapUrl,{ttlMs:30000,cacheKey:`grev_api_cache:${bootstrapUrl}`}):{data:await fetch(bootstrapUrl).then(r=>r.json())};if(boot?.data?.ok){meId=boot.data?.viewer?.id||null;render(boot.data.profile||{});createProfileEditControls(currentProfile||{});statusEl.textContent='Loaded.';return;}}catch(e){console.warn('[profile] bootstrap failed, falling back',e);}const authPromise=(window.GREVApi?.fetchJsonCached?window.GREVApi.fetchJsonCached('/api/auth/me',{ttlMs:15000,cacheKey:'grev_api_cache:/api/auth/me'}).then(x=>x.data):fetch('/api/auth/me').then(r=>r.json())).catch(()=>null);const profileUrl=id?`/api/profile?id=${encodeURIComponent(id)}`:'/api/profile/me';const profilePromise=(window.GREVApi?.fetchJsonCached?window.GREVApi.fetchJsonCached(profileUrl,{ttlMs:60000,cacheKey:`grev_api_cache:${profileUrl}`}).then(x=>x.data):fetch(profileUrl).then(r=>r.json()));const [authResult, profileResult]=await Promise.allSettled([authPromise,profilePromise]);if(profileResult.status!=='fulfilled'||!profileResult.value?.ok){statusEl.textContent=profileResult.value?.error||'Load failed';return;}render(profileResult.value.profile||{});statusEl.textContent='Loaded.';if(authResult.status==='fulfilled'){meId=authResult.value?.user?.id||null;createProfileEditControls(currentProfile||{});}}load();
</script><style>.profile-page-custom-shell{background-position:var(--profile-page-bg-position, center top);}</style><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script>
