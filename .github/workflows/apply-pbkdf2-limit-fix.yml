name: Apply PBKDF2 Limit Fix

on:
  push:
    branches:
      - agent/fix-cloudflare-pbkdf2-limit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cloudflare-pbkdf2-limit
          fetch-depth: 0

      - name: Apply confirmed Cloudflare limit
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/index.ts'): [
                  ('iterations=310000', 'iterations=100000'),
              ],
              Path('scripts/bootstrap-ladmin.mjs'): [
                  ('const iterations = 310000;', 'const iterations = 100000;'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)

          Path('.github/workflows/apply-pbkdf2-limit-fix.yml').unlink()
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts scripts/bootstrap-ladmin.mjs .github/workflows/apply-pbkdf2-limit-fix.yml
          git commit -m "Use Cloudflare-supported PBKDF2 iteration limit"
          git push origin HEAD:agent/fix-cloudflare-pbkdf2-limit
