<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Edit Profile</title><link rel="stylesheet" href="/styles.css" /></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main><h1>Edit Profile</h1><p id="edit-status">Loading...</p><form id="profile-edit-form" class="profile-edit-form profile-custom-fields">
<label>Display Name<input name="display_name" maxlength="40" /></label><label>Profile Title<input name="profile_title" maxlength="80" /></label><label>Bio<textarea name="bio" maxlength="500"></textarea></label><label>Location<input name="location" maxlength="80" /></label><label>Website URL<input name="website_url" maxlength="200" /></label><label>Avatar URL<input name="avatar_url" maxlength="500" /></label><label>Banner URL<input name="banner_url" maxlength="500" /></label>
<div class="colour-picker-row"><label>Favourite Colour<input class="colour-picker-input" type="color" name="favourite_colour" value="#00ff66" /></label><button type="button" data-clear-colour="favourite_colour">Clear</button></div>
<div class="colour-picker-row"><label>Profile Accent Colour<input class="colour-picker-input" type="color" name="profile_accent_colour" value="#00ff66" /></label><button type="button" data-clear-colour="profile_accent_colour">Clear</button></div>
<div class="colour-picker-row"><label>Profile Background Colour<input class="colour-picker-input" type="color" name="profile_background_colour" value="#101820" /></label><button type="button" data-clear-colour="profile_background_colour">Clear</button></div>
<label>Profile Layout<select name="profile_layout"><option value="compact">compact</option><option value="standard">standard</option><option value="showcase">showcase</option></select></label>
<fieldset class="profile-privacy-options"><legend>Display Options</legend><label><input type="checkbox" name="show_level" value="1" /> Show level</label><label><input type="checkbox" name="show_rank" value="1" /> Show rank</label><label><input type="checkbox" name="show_badges" value="1" /> Show badges</label><label><input type="checkbox" name="show_last_active" value="1" /> Show last active</label></fieldset>
<h2>Profile Showcase</h2><div id="showcase-editor" class="showcase-editor"></div><button type="submit">Save Profile</button></form></main>
<script>
const colourDefaults={favourite_colour:'#00ff66',profile_accent_colour:'#00ff66',profile_background_colour:'#101820'};const cleared=new Set();let unlocks=[];
async function load(){const s=document.getElementById('edit-status');const [profileRes,unlockRes,showcaseRes]=await Promise.all([fetch('/api/profile/me'),fetch('/api/profile/me/unlocks'),fetch('/api/profile/me/showcase')]);const d=await profileRes.json();if(!profileRes.ok){s.textContent=d.error||'Load failed';return;}const p=d.profile||{};const f=document.getElementById('profile-edit-form');for(const k of ['display_name','profile_title','bio','location','website_url','avatar_url','banner_url','profile_layout'])f.elements[k].value=p[k]||'';for(const k of Object.keys(colourDefaults)){cleared.delete(k);f.elements[k].value=p[k]||colourDefaults[k];}for(const k of ['show_level','show_rank','show_badges','show_last_active'])f.elements[k].checked=Number(p[k])===1;const ud=await unlockRes.json();unlocks=unlockRes.ok?(ud.unlocks||[]):[];const sd=await showcaseRes.json();renderShowcaseEditor((showcaseRes.ok&&sd.slots)||[]);s.textContent='Loaded.';}
function renderShowcaseEditor(slots){const root=document.getElementById('showcase-editor');if(!unlocks.length){root.innerHTML='<p>No unlocks yet. Unlocks will come from future minigames and site achievements.</p>';return;}const map=new Map((slots||[]).map(s=>[Number(s.slot),s.unlock?.id??null]));let html='';for(let i=1;i<=4;i++){html+=`<label>Slot ${i}<select class='showcase-select' name='showcase_slot_${i}'><option value=''>Empty</option>${unlocks.map(u=>`<option value='${u.id}' ${map.get(i)===u.id?'selected':''}>${u.name} (${u.unlock_type}/${u.rarity})</option>`).join('')}</select></label>`;}root.innerHTML=html;}
document.querySelectorAll('[data-clear-colour]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.clearColour;cleared.add(k);document.getElementById('profile-edit-form').elements[k].value=colourDefaults[k];}));
document.getElementById('profile-edit-form').addEventListener('submit',async(e)=>{e.preventDefault();const f=e.target;const body={};for(const k of ['display_name','profile_title','bio','location','website_url','avatar_url','banner_url','profile_layout'])body[k]=f.elements[k].value;for(const k of Object.keys(colourDefaults))body[k]=cleared.has(k)?'':f.elements[k].value;for(const k of ['show_level','show_rank','show_badges','show_last_active'])body[k]=f.elements[k].checked?1:0;const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){document.getElementById('edit-status').textContent=d.error||'Save failed';return;}if(unlocks.length){const slots=[];for(let i=1;i<=4;i++){const v=f.elements[`showcase_slot_${i}`]?.value;slots.push({slot:i,unlock_id:v?Number(v):null});}await fetch('/api/profile/me/showcase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slots})});}document.getElementById('edit-status').textContent='Saved profile settings.';});
load();
</script><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script></body></html>
