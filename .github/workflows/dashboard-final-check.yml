name: Dashboard Final Check

on:
  pull_request:
    branches:
      - pbe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - name: Strict TypeScript check
        run: npm run typecheck
      - name: Browser JavaScript syntax checks
        run: |
          node --check public/dashboard.js
          node --check public/admin-dashboard.js
          node --check public/feature.js
      - name: Apply full migration chain to fresh local D1
        run: npx wrangler d1 migrations apply grev-dad-preview --local --env pbe
      - name: Verify Worker serves dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --env pbe --port 8787 > /tmp/wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill $worker_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8787/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8787/dashboard.js | grep -q 'loadDashboardSystem'
          curl --silent --fail http://127.0.0.1:8787/dashboard.css | grep -q '.dashboard-tile-grid'
          curl --silent --fail http://127.0.0.1:8787/admin-dashboard.js | grep -q 'loadAdminDashboard'
          curl --silent --fail http://127.0.0.1:8787/feature.js | grep -q 'loadFeatureWorkspace'
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --env pbe
