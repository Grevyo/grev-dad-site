name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grev-dad-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
      LADMIN_TARGET_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm production branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Production deployments must run from main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Verify Grev Home contracts
        run: npm run verify:grev-home

      - name: Apply production database migrations
        run: npx wrangler d1 migrations apply grev-dad-production --remote --env production

      - name: Configure protected LADMIN account
        run: node scripts/bootstrap-ladmin.mjs

      # Cloud saves need this R2 bucket. If it can't be confirmed or created (the API token needs
      # the "Workers R2 Storage: Edit" permission), the site still deploys, without cloud saves.
      - name: Ensure cloud save bucket exists
        id: saves
        shell: bash
        run: |
          if npx wrangler r2 bucket info grev-dad-saves >/dev/null 2>&1 || npx wrangler r2 bucket create grev-dad-saves; then
            echo "config=wrangler.jsonc" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Couldn't confirm or create the R2 bucket grev-dad-saves. Deploying without cloud saves; give the Cloudflare API token R2 edit permission (or create the bucket in the dashboard) and redeploy to turn them on."
            node scripts/wrangler-without-saves.mjs production
            echo "config=wrangler.deploy.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production
        run: npx wrangler deploy --config "${{ steps.saves.outputs.config }}" --env production

      - name: Verify LADMIN login end to end
        shell: bash
        run: |
          set -euo pipefail

          payload=$(node -e 'process.stdout.write(JSON.stringify({identifier:"LADMIN",password:process.env.LADMIN_BOOTSTRAP_PASSWORD,rememberMe:false}))')

          login_status=$(curl --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /tmp/ladmin-login.json \
            --write-out '%{http_code}' \
            --cookie-jar /tmp/ladmin.cookies \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            https://grev.dad/api/auth/login)

          cat /tmp/ladmin-login.json
          echo

          if [ "$login_status" != "200" ]; then
            echo "Production LADMIN login smoke test failed with HTTP $login_status."
            exit 1
          fi

          session_status=$(curl --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /tmp/ladmin-session.json \
            --write-out '%{http_code}' \
            --cookie /tmp/ladmin.cookies \
            https://grev.dad/api/auth/session)

          cat /tmp/ladmin-session.json
          echo

          if [ "$session_status" != "200" ]; then
            echo "Production LADMIN session smoke test failed with HTTP $session_status."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const session = JSON.parse(fs.readFileSync('/tmp/ladmin-session.json', 'utf8'));
          const user = session.user;
          if (!session.authenticated || !user || String(user.username).toLowerCase() !== 'ladmin' || !user.isOwner || !user.isAdmin) {
            console.error('Production LADMIN session did not return the required Owner and Administrator access.');
            process.exit(1);
          }
          console.log('Production LADMIN login and Owner/Admin session verified.');
          NODE

      - name: Verify deployed Grev Home connection API
        run: node scripts/smoke-grev-home-api.mjs https://grev.dad production
