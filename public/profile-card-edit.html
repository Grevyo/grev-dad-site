<!doctype html>
<html>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Profile Card Editor</title>
  <link rel='stylesheet' href='/styles.css'>
</head>
<body class='profile-card-editor-page'>
  <header class='site-header'>
    <a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a>
    <nav id='authStatus' class='site-nav'>Checking login...</nav>
  </header>
  <main>
    <h1>Profile Card Editor</h1>
    <div class='profile-actions'>
      <a class='nav-button' href='/profile-edit.html'>Edit Full Profile</a>
      <a class='nav-button' href='/profile.html'>Back to Profile</a>
    </div>
    <p id='card-status'>Loading...</p>
    <div class='profile-card-editor-grid'><section class='profile-card-preview'><h2>Card Preview</h2><div id='card-preview' class='profile-card-preview-frame'></div></section><section><h2>Card Images</h2><label>Card avatar URL<input name='card_avatar_url' maxlength='500'></label><label>Card background image/GIF URL<input name='card_background_url' maxlength='500'></label></section><section><h2>Card Colours</h2><div class='card-colour-grid'><label>Background<input type='color' name='card_background_colour'></label><label>Accent<input type='color' name='card_accent_colour'></label><label>Text<input type='color' name='card_text_colour'></label><label>Border<input type='color' name='card_border_colour'></label></div></section><section><h2>Card Layout</h2><select name='card_layout'><option>compact</option><option selected>standard</option><option>showcase</option></select></section><section class='card-display-options'><h2>Display Toggles</h2><label><input type='checkbox' name='card_show_avatar'> show avatar</label><label><input type='checkbox' name='card_show_display_name'> show display name</label><label><input type='checkbox' name='card_show_username'> show username</label><label><input type='checkbox' name='card_show_user_id'> show user ID</label><label><input type='checkbox' name='card_show_role'> show role</label><label><input type='checkbox' name='card_show_level'> show level</label><label><input type='checkbox' name='card_show_rank'> show rank</label><label><input type='checkbox' name='card_show_xp'> show XP</label><label><input type='checkbox' name='card_show_status'> show status</label><label><input type='checkbox' name='card_show_steam'> show Steam</label></section></div><button id='save-card' class='nav-button'>Save Profile Card</button>
  </main>
  <script src='/scripts/player-card.js'></script><script>
const fields=['card_avatar_url','card_background_url','card_background_colour','card_accent_colour','card_text_colour','card_border_colour','card_layout'];
const toggles=['card_show_avatar','card_show_display_name','card_show_username','card_show_user_id','card_show_role','card_show_level','card_show_rank','card_show_xp','card_show_status','card_show_steam'];
let profile={};
function draw(){document.getElementById('card-preview').innerHTML=window.renderPlayerCard(profile,{useCardSettings:true});}
(async()=>{const r=await fetch('/api/profile/me'); if(r.status===401){location.href='/unregistered.html';return;} const d=await r.json(); profile=d.profile||{}; fields.forEach(k=>{const e=document.querySelector(`[name="${k}"]`); if(e)e.value=profile[k]||'';}); toggles.forEach(k=>{const e=document.querySelector(`[name="${k}"]`); if(e)e.checked=Number(profile[k]??1)===1;}); draw(); document.getElementById('card-status').textContent='Loaded.';})();
document.body.addEventListener('input',(e)=>{const n=e.target.name;if(!n)return;profile[n]=e.target.type==='checkbox'?(e.target.checked?1:0):e.target.value;draw();});
document.getElementById('save-card').onclick=async()=>{const body={}; fields.forEach(k=>body[k]=document.querySelector(`[name="${k}"]`)?.value||''); toggles.forEach(k=>body[k]=document.querySelector(`[name="${k}"]`)?.checked?1:0); const r=await fetch('/api/profile/me/card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const d=await r.json(); document.getElementById('card-status').textContent=r.ok?'Saved.':(d.error||'Failed'); if(r.ok) profile=d.profile||profile; draw();};
</script>
  <script src='/scripts/theme.js'></script>
  <script src='/scripts/auth-status.js'></script>
</body>
</html>
