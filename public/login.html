<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grev - Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <div id="authStatus">Checking login...</div>
      <h1>Login</h1>

      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />

        <button type="submit">Log in</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <a href="/register.html">Create account</a>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const statusEl = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        statusEl.textContent = '';

        const username = form.username.value.trim();
        const password = form.password.value;

        if (!username) {
          statusEl.textContent = 'Username is required';
          return;
        }
        if (!password) {
          statusEl.textContent = 'Password is required';
          return;
        }

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });

          const text = await response.text();
          let data = null;
          if (text) {
            try {
              data = JSON.parse(text);
            } catch {
              statusEl.textContent = 'Server returned an invalid response';
              return;
            }
          }

          if (!response.ok || !data?.ok) {
            statusEl.textContent = data?.error || text || 'Login failed';
            return;
          }

          if (data.user?.is_admin) {
            window.location.href = '/admin.html';
            return;
          }
          window.location.href = '/';
        } catch {
          statusEl.textContent = 'Network error. Please try again.';
        }
      });
    </script>
      <script src="/scripts/auth-status.js"></script>
  </body>
</html>
