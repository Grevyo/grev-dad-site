name: Record Live PBE Full Platform Verification
on:
  push:
    branches: [agent/verify-live-full-platform]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-live-full-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify real PBE deployment
        run: |
          set +e
          mkdir -p .github/verification
          LOG=.github/verification/live-full-platform.txt
          : > "$LOG"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >> "$LOG" 2>&1
          npx playwright install --with-deps chromium >> "$LOG" 2>&1
          timeout --signal=INT 720s node .github/scripts/verify-live-full-platform.cjs >> "$LOG" 2>&1
          browser_status=$?
          echo "BROWSER_STATUS=$browser_status" >> "$LOG"
          if [ "$browser_status" -eq 0 ]; then echo 'OVERALL=PASS' >> "$LOG"; else echo 'OVERALL=FAIL' >> "$LOG"; fi
          git rm .github/workflows/record-live-full-platform.yml .github/scripts/verify-live-full-platform.cjs
          git rm -f .github/verification/run-live-full-platform.trigger
          git config user.name "grev-dad-live-verification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$LOG"
          git commit -m "Record live PBE full platform verification"
          git push origin HEAD:agent/verify-live-full-platform
