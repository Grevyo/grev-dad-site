name: Apply Full Platform Review Fixes

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - name: Apply reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          platform = Path('src/platform.ts')
          text = platform.read_text()

          text = text.replace(
              "'featureId','x','y','width','height','colour'",
              "'featureId','sourceFeatureId','x','y','width','height','colour'",
              1,
          )

          old_clean = """    if (item === null || ['string','number','boolean'].includes(typeof item)) result[key] = typeof item === 'string' ? item.slice(0, 2000) : item;"""
          new_clean = """    if (item === null || ['number','boolean'].includes(typeof item)) {
              result[key] = item;
            } else if (typeof item === 'string') {
              if (key === 'mediaUrl') {
                if (/^https:\/\//i.test(item)) result[key] = item.slice(0, 2048);
                else if (/^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/]+={0,2}$/i.test(item) && item.length <= 1_900_000) result[key] = item;
              } else result[key] = item.slice(0, 2000);
            }"""
          if old_clean not in text:
              raise SystemExit('cleanData target not found')
          text = text.replace(old_clean, new_clean, 1)

          marker = """async function modulePayload(env:PlatformEnv,user:User,ownerId=user.id):Promise<Response>{"""
          search_fn = """async function searchUsers(request:Request,env:PlatformEnv,user:User):Promise<Response>{
            const raw=new URL(request.url).searchParams.get('q')??'';
            const query=raw.trim().replace(/[^A-Za-z0-9@._ -]/g,'').replace(/^@/,'').slice(0,60);
            if(query.length<2)return json({ok:false,message:'Enter at least two characters.'},400);
            const like=`%${query}%`;
            const rows=await env.DB.prepare(`SELECT u.id,u.username,u.display_name,u.is_verified,p.avatar_media,COALESCE(up.level,1) level FROM users u LEFT JOIN user_profiles p ON p.user_id=u.id LEFT JOIN user_progression up ON up.user_id=u.id WHERE u.status='active' AND u.id<>? AND (u.username LIKE ? COLLATE NOCASE OR u.display_name LIKE ? COLLATE NOCASE) ORDER BY u.display_name LIMIT 20`).bind(user.id,like,like).all<{id:string;username:string;display_name:string;is_verified:number;avatar_media:string|null;level:number}>();
            return json({ok:true,users:rows.results.map(row=>({id:row.id,username:row.username,displayName:row.display_name,isVerified:Boolean(row.is_verified),avatarMedia:row.avatar_media,level:Number(row.level??1)}))});
          }

          """
          if marker not in text:
              raise SystemExit('modulePayload marker not found')
          text = text.replace(marker, search_fn + marker, 1)

          old_announcements = """const groupAnnouncements=await env.DB.prepare(`SELECT i.*,u.username owner_username,u.display_name owner_display_name,g.name group_name FROM content_items i JOIN users u ON u.id=i.owner_user_id JOIN groups g ON g.id=i.group_id WHERE i.item_type IN('announcement','post') AND EXISTS(SELECT 1 FROM group_memberships gm WHERE gm.group_id=i.group_id AND gm.user_id=?) ORDER BY i.pinned DESC,i.updated_at DESC LIMIT 50`).bind(user.id).all<ItemRow>();"""
          new_announcements = """const groupAnnouncements=await env.DB.prepare(`SELECT i.*,u.username owner_username,u.display_name owner_display_name,g.name group_name FROM content_items i JOIN users u ON u.id=i.owner_user_id JOIN groups g ON g.id=i.group_id WHERE i.item_type IN('announcement','post') AND (i.owner_user_id=? OR i.visibility='account' OR (i.visibility='verified' AND ?=1) OR (i.visibility='group' AND EXISTS(SELECT 1 FROM group_memberships gm WHERE gm.group_id=i.group_id AND gm.user_id=?))) ORDER BY i.pinned DESC,i.updated_at DESC LIMIT 50`).bind(user.id,user.isVerified?1:0,user.id).all<ItemRow>();"""
          if old_announcements not in text:
              raise SystemExit('announcement query target not found')
          text = text.replace(old_announcements, new_announcements, 1)

          route_marker = """  if(path==='/api/platform/items'&&request.method==='GET')return listItems(request,env,user);"""
          route_line = """  if(path==='/api/platform/users'&&request.method==='GET')return searchUsers(request,env,user);
          """
          if route_marker not in text:
              raise SystemExit('platform route marker not found')
          text = text.replace(route_marker, route_line + route_marker, 1)
          platform.write_text(text)

          worker = Path('src/worker.ts')
          text = worker.read_text()
          text = text.replace(
              "'/dashboard.css','/dashboard.js','/dashboard-experience.css','/dashboard-experience.js','/platform-dashboard.css','/platform-dashboard.js','/dashboard-advanced.css','/dashboard-advanced.js',",
              "'/dashboard.css','/dashboard.js','/dashboard-experience.css','/dashboard-experience.js','/platform-dashboard.css','/platform-dashboard.js','/dashboard-advanced.css','/dashboard-advanced.js','/dashboard-collaboration.css','/dashboard-collaboration.js',",
              1,
          )
          text = text.replace(
              "['/dashboard-experience.js','/platform-dashboard.js','/dashboard-advanced.js','/site-platform.js','/profile-card-popover.js','/chat-ui.js']",
              "['/dashboard-experience.js','/platform-dashboard.js','/dashboard-advanced.js','/dashboard-collaboration.js','/site-platform.js','/profile-card-popover.js','/chat-ui.js']",
              1,
          )
          text = text.replace(
              "['/dashboard-experience.css','/platform-dashboard.css','/dashboard-advanced.css','/site-platform.css','/profile-card-popover.css','/chat-ui.css']",
              "['/dashboard-experience.css','/platform-dashboard.css','/dashboard-advanced.css','/dashboard-collaboration.css','/site-platform.css','/profile-card-popover.css','/chat-ui.css']",
              1,
          )
          worker.write_text(text)
          PY
      - name: Check reviewed changes
        run: |
          grep -q "sourceFeatureId" src/platform.ts
          grep -q "api/platform/users" src/platform.ts
          grep -q "item.length <= 1_900_000" src/platform.ts
          grep -q "i.owner_user_id=? OR i.visibility='account'" src/platform.ts
          grep -q "dashboard-collaboration.js" src/worker.ts
      - name: Commit reviewed fixes and remove this workflow
        run: |
          git rm .github/workflows/apply-full-platform-review-fixes.yml
          git config user.name "grev-dad-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/platform.ts src/worker.ts
          git commit -m "Address full platform integration review"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
