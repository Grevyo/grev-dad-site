<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Link Grev Home · Grev.dad</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Same look as the rest of Grev.dad: square panel, offset shadow, blue glow. */
    body.link-page{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box}
    .link-panel{width:min(680px,100%);box-sizing:border-box;padding:32px;border:1px solid var(--line-strong);background:var(--panel);box-shadow:14px 14px 0 #000,0 0 80px rgba(125,147,255,.15)}
    .link-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
    .link-head img{width:58px;height:auto;filter:drop-shadow(0 0 12px rgba(125,147,255,.55))}
    .link-head h1{margin:0;font-size:clamp(1.7rem,4vw,2.2rem);letter-spacing:-.03em;text-shadow:0 0 30px rgba(125,147,255,.3)}
    .link-panel p{color:var(--muted);line-height:1.6}
    .link-panel form{margin-top:18px;gap:12px}
    .link-panel input{font:700 1.1rem ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
    .code{font:800 1.7rem ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.16em;color:var(--accent-strong);margin:18px 0;text-shadow:0 0 18px rgba(125,147,255,.5)}
    .details{display:grid;gap:10px;margin:20px 0;padding:18px;border:1px solid var(--line);background:var(--panel-3)}
    .row{display:grid;grid-template-columns:150px 1fr;gap:14px}.label{color:var(--muted)}.value{overflow-wrap:anywhere;font-weight:700}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .actions button{min-width:150px;min-height:44px;padding:12px 18px;border:1px solid var(--line-strong);background:#171b22;color:var(--text);font-weight:850;cursor:pointer;transition:transform .12s,box-shadow .12s}
    .actions button:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:4px 4px 0 #000}
    .actions button.primary{background:#f4f6fa;border-color:#f4f6fa;color:#090b0f}
    .actions button.primary:hover:not(:disabled){box-shadow:4px 4px 0 #000,0 0 26px rgba(125,147,255,.45)}
    .actions button.danger{border-color:#7a4249;background:#311a1d}
    .status{min-height:24px;margin-top:18px;color:var(--accent-strong)}.error{color:var(--danger)}.success{color:var(--success)}
    [hidden]{display:none!important}
    @media(max-width:560px){.link-panel{padding:22px}.row{grid-template-columns:1fr;gap:2px}.actions button{width:100%}}
  </style>
</head>
<body class="link-page">
<main class="link-panel">
  <div class="link-head"><img src="/grev-home-logo.png" alt=""><h1>Link Grev Home</h1></div>
  <form action="/link-grev-home" method="get">
    <label for="approval-code" style="display:block">Paste the approval code generated in Grev Home</label>
    <input id="approval-code" name="code" type="text" required maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="primary" type="submit">Review link</button>
  </form>
  <p>Approve this only if the GrevID and device below belong to you. Grev Home never receives your Grev.dad password or browser session.</p>
  <div id="code" class="code"></div>
  <section id="details" class="details" hidden>
    <div class="row"><div class="label">GrevID</div><div id="grevId" class="value"></div></div>
    <div class="row"><div class="label">Local username</div><div id="username" class="value"></div></div>
    <div class="row"><div class="label">Display name</div><div id="displayName" class="value"></div></div>
    <div class="row"><div class="label">Device</div><div id="deviceName" class="value"></div></div>
    <div class="row"><div class="label">Expires</div><div id="expires" class="value"></div></div>
  </section>
  <div class="actions">
    <button id="approve" class="primary" disabled>Approve link</button>
    <button id="deny" class="danger" disabled>Deny</button>
    <button id="back" onclick="location.href='/dashboard'">Back to dashboard</button>
  </div>
  <div id="status" class="status" role="status"></div>
</main>
<script src="/grev-ambient.js" defer></script>
<script>
const params=new URLSearchParams(location.search),code=(params.get('code')||'').trim().toUpperCase();
const $=id=>document.getElementById(id),status=$('status'),approve=$('approve'),deny=$('deny');
$('code').textContent=code||'NO CODE';
$('approval-code').value=code;
function setStatus(message,kind=''){status.textContent=message;status.className='status '+kind;}
async function load(){
  if(!code){$('code').textContent='';setStatus('Signed in. Paste your Grev Home approval code above to continue.');return;}
  try{
    const response=await fetch('/api/grev-home/link/request?code='+encodeURIComponent(code),{credentials:'same-origin'});
    const data=await response.json();
    if(!response.ok||!data.ok)throw new Error(data.message||'The link request could not be loaded.');
    const request=data.request;$('details').hidden=false;$('grevId').textContent=request.grevId;$('username').textContent=request.localUsername;$('displayName').textContent=request.localDisplayName;$('deviceName').textContent=request.deviceName||'Grev Home device';$('expires').textContent=new Date(request.expiresAt*1000).toLocaleString();
    if(request.status==='approved'){setStatus('This Grev Home request is already approved.','success');return;}
    if(request.status==='denied'){setStatus('This Grev Home request has already been denied.','error');return;}
    approve.disabled=false;deny.disabled=false;
  }catch(error){setStatus(error instanceof Error?error.message:'The link request could not be loaded.','error');}
}
async function decide(decision){
  approve.disabled=true;deny.disabled=true;setStatus(decision==='approve'?'Approving Grev Home…':'Denying request…');
  try{
    const response=await fetch('/api/grev-home/link/approve',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({userCode:code,decision})});
    const data=await response.json();
    if(!response.ok||!data.ok)throw new Error(data.message||'The link decision could not be saved.');
    setStatus(decision==='approve'?'Grev Home is linked. It will finish setting up automatically – you can go back to the console.':'The Grev Home link request was denied.',decision==='approve'?'success':'');
  }catch(error){setStatus(error instanceof Error?error.message:'The link decision could not be saved.','error');approve.disabled=false;deny.disabled=false;}
}
approve.addEventListener('click',()=>decide('approve'));deny.addEventListener('click',()=>decide('deny'));load();
</script>
</body>
</html>
