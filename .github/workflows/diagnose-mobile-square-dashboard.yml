name: Diagnose Mobile Square Dashboard

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/mobile-square-dashboard' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --package-lock=false --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --directory public >/tmp/mobile-dashboard-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/dashboard.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Capture browser report
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const report = { stages: {}, console: [], pageErrors: [] };
          const appearance = { backgroundType:'solid',backgroundPrimary:'#11161d',backgroundSecondary:'#5268aa',backgroundAngle:135,backgroundMedia:null,textColour:'#f4f7fb',fontFamily:'system',borderColour:'#394657',contentMode:'standard',customTitle:null,customIcon:null,mediaFit:'cover',mediaOverlay:'dark' };
          const base = { category:'Test',featureType:'link',presentation:'action',route:'/profile',iconText:'GD',audience:'all',defaultDimension:'1x1',defaultWidth:1,defaultHeight:1,allowedDimensions:['1x1','1x2','2x1','2x2','4x2'],isActive:true,isDefault:true,tileColour:'default',accessGroups:[],...appearance };
          const gif='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
          const pinnedTiles=[
            {...base,id:'tile-wide',slug:'wide',name:'Wide tile',sortOrder:1,pinned:true,x:0,y:0,width:2,height:1},
            {...base,id:'tile-small',slug:'small',name:'Small tile',sortOrder:2,pinned:true,x:7,y:0,width:1,height:1},
            {...base,id:'tile-square',slug:'square',name:'Square tile',sortOrder:3,pinned:true,x:2,y:1,width:2,height:2,presentation:'content',featureType:'workspace',route:'/feature/square'},
            {...base,id:'tile-media',slug:'media',name:'Media tile',sortOrder:4,pinned:true,x:4,y:1,width:2,height:2,backgroundType:'media',backgroundMedia:gif,contentMode:'media-button',customTitle:'Media',customIcon:'★'},
            {...base,id:'tile-tall',slug:'tall',name:'Tall tile',sortOrder:5,pinned:true,x:0,y:3,width:1,height:2}
          ];
          const payload={ok:true,viewer:{id:'u1',username:'mobiletest',displayName:'Mobile Test',isAdmin:false,isOwner:false},grid:{columns:8,dimensions:['1x1','1x2','2x1','2x2','4x2']},features:pinnedTiles.map(t=>({...t,backgroundMedia:null,hasBackgroundMedia:Boolean(t.backgroundMedia)})),pinnedTiles,preferences:{density:'comfortable',showDescriptions:true,tileGap:48,outerMargin:64},capabilities:{canCustomize:true,isAdmin:false,isOwner:false}};
          function snapshot(page){return page.evaluate(()=>{const grid=document.querySelector('#dashboard-grid');return{url:location.href,innerWidth,innerHeight,scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,gridExists:Boolean(grid),gridStyle:grid?.getAttribute('style'),gridColumns:grid?getComputedStyle(grid).gridTemplateColumns:null,rowHeight:grid?getComputedStyle(grid).getPropertyValue('--tile-row-height').trim():null,gap:grid?getComputedStyle(grid).gap:null,padding:grid?getComputedStyle(grid).padding:null,summary:document.querySelector('#dashboard-grid-summary')?.textContent,status:document.querySelector('#dashboard-status')?.textContent,customizeHidden:document.querySelector('#customize-dashboard')?.hidden,tiles:[...document.querySelectorAll('.dashboard-tile')].map(t=>{const b=t.getBoundingClientRect();return{id:t.dataset.featureId,width:b.width,height:b.height,left:b.left,right:b.right,top:b.top,bottom:b.bottom,column:t.style.gridColumn,row:t.style.gridRow,draggable:t.draggable,contentMode:t.dataset.contentMode}})}})}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            page.on('console',m=>report.console.push({type:m.type(),text:m.text()}));
            page.on('pageerror',e=>report.pageErrors.push(String(e.stack||e)));
            await page.route('**/api/onboarding',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,progress:{relationshipComplete:true,intentionsComplete:true}})}));
            await page.route('**/api/dashboard',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(payload)}));
            await page.route('**/api/session',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({authenticated:true,username:'mobiletest',displayName:'Mobile Test'})}));
            await page.goto('http://127.0.0.1:8000/dashboard.html',{waitUntil:'networkidle'});
            await page.waitForTimeout(300);
            report.stages.mobile=await snapshot(page);
            await page.screenshot({path:'mobile-browser.png',fullPage:true});
            const customize=page.locator('#customize-dashboard');
            report.customizeCount=await customize.count();
            report.customizeVisible=report.customizeCount?await customize.isVisible():false;
            if(report.customizeVisible){await customize.click();await page.waitForTimeout(200);report.stages.editor=await snapshot(page);const settings=page.locator('.dashboard-tile-settings').first();report.settingsCount=await page.locator('.dashboard-tile-settings').count();if(await settings.count()){await settings.click();await page.waitForTimeout(100);report.stages.dialog=await page.evaluate(()=>{const d=document.querySelector('#dashboard-tile-settings-dialog');const b=d?.getBoundingClientRect();return{open:d?.open,box:b?{left:b.left,right:b.right,top:b.top,bottom:b.bottom,width:b.width,height:b.height}:null,scrollWidth:document.documentElement.scrollWidth}})}}
            await page.setViewportSize({width:1000,height:800});await page.waitForTimeout(200);report.stages.desktop=await snapshot(page);
            await browser.close();
          })().catch(e=>{report.fatal=String(e.stack||e)}).finally(()=>{fs.writeFileSync('mobile-browser-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2))});
          NODE
      - name: Commit diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile-browser-report.json
          git commit -m "Record mobile dashboard browser report"
          git push origin HEAD:${{ github.head_ref }}
