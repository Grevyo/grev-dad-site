name: Verify Unified Profile Editor

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    if: github.head_ref == 'agent/streamline-profile-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify unified profile editor
        run: node .github/scripts/verify-unified-profile-editor.cjs
