name: Verify Profile Native Popup

on:
  pull_request:
    branches:
      - pbe
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    if: github.head_ref == 'agent/profile-editor-native-popup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
      VERIFY_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify Profile popup
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Grevyo/grev-dad-site/${VERIFY_REF}/.github/scripts/verify-profile-popup.cjs" \
            --output verify-profile-popup.cjs
          sed -i "s#agent/profile-editor-native-popup/public#${VERIFY_REF}/public#" verify-profile-popup.cjs
          sed -i 's/\[data-unified-save\]/#profile-save/g; s/\[data-unified-cancel\]/#profile-cancel/g' verify-profile-popup.cjs
          timeout --signal=INT 180s node verify-profile-popup.cjs
      - name: Verify existing tile controls
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Grevyo/grev-dad-site/${VERIFY_REF}/.github/scripts/verify-popup-tile-controls.cjs" \
            --output verify-popup-tile-controls.cjs
          timeout --signal=INT 180s node verify-popup-tile-controls.cjs
