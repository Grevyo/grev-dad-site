name: Record Full Platform Browser Verification

on:
  push:
    branches:
      - agent/full-dashboard-profile-upgrade

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-dashboard-profile-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run fresh two-user browser verification
        run: |
          set +e
          mkdir -p .github/verification
          LOG=.github/verification/full-platform-browser.txt
          : > "$LOG"
          echo "HEAD=$(git rev-parse HEAD)" >> "$LOG"

          npm install >> "$LOG" 2>&1
          install_status=$?
          npm install --no-save playwright@1.55.0 >> "$LOG" 2>&1
          playwright_status=$?
          npx playwright install --with-deps chromium >> "$LOG" 2>&1
          chromium_status=$?

          npm run typecheck >> "$LOG" 2>&1
          type_status=$?

          syntax_status=0
          for file in public/hub.js public/platform-dashboard.js public/dashboard-advanced.js public/dashboard-collaboration.js public/platform-profile.js public/site-platform.js public/chat-ui.js .github/scripts/verify-full-platform-browser.cjs; do
            node --check "$file" >> "$LOG" 2>&1 || syntax_status=1
          done

          rm -rf .wrangler/state
          npx wrangler d1 migrations apply grev-dad-dev --local >> "$LOG" 2>&1
          migration_status=$?

          browser_status=1
          if [ "$install_status" -eq 0 ] && [ "$playwright_status" -eq 0 ] && [ "$chromium_status" -eq 0 ] && [ "$type_status" -eq 0 ] && [ "$syntax_status" -eq 0 ] && [ "$migration_status" -eq 0 ]; then
            npx wrangler dev --local --port 8787 > /tmp/full-platform-wrangler.log 2>&1 &
            server_pid=$!
            ready=0
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -eq 1 ]; then
              timeout --signal=INT 480s node .github/scripts/verify-full-platform-browser.cjs >> "$LOG" 2>&1
              browser_status=$?
            else
              echo 'Local Wrangler server did not become ready.' >> "$LOG"
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo '## Wrangler log' >> "$LOG"
            cat /tmp/full-platform-wrangler.log >> "$LOG"
          fi

          echo "INSTALL_STATUS=$install_status" >> "$LOG"
          echo "PLAYWRIGHT_STATUS=$playwright_status" >> "$LOG"
          echo "CHROMIUM_STATUS=$chromium_status" >> "$LOG"
          echo "TYPECHECK_STATUS=$type_status" >> "$LOG"
          echo "SYNTAX_STATUS=$syntax_status" >> "$LOG"
          echo "MIGRATION_STATUS=$migration_status" >> "$LOG"
          echo "BROWSER_STATUS=$browser_status" >> "$LOG"
          if [ "$install_status" -eq 0 ] && [ "$playwright_status" -eq 0 ] && [ "$chromium_status" -eq 0 ] && [ "$type_status" -eq 0 ] && [ "$syntax_status" -eq 0 ] && [ "$migration_status" -eq 0 ] && [ "$browser_status" -eq 0 ]; then
            echo 'OVERALL=PASS' >> "$LOG"
          else
            echo 'OVERALL=FAIL' >> "$LOG"
          fi

          git rm .github/workflows/record-full-platform-browser.yml .github/scripts/verify-full-platform-browser.cjs
          git config user.name "grev-dad-verification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$LOG"
          git commit -m "Record full platform browser verification"
          git push origin HEAD:agent/full-dashboard-profile-upgrade
