<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grev - Profile</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main class="profile-page-main"><h1>Profile Page</h1><p id="profile-status">Loading...</p><div id="profile-toolbar"></div><div id="profile-view"></div></main>
<script src='/scripts/level-badge.js'></script><script src='/scripts/player-card.js'></script>
<script src='/scripts/api-cache.js'></script>
<script>
let meId=null,currentProfile=null,profileEditMode=false,profileCustomiseOpen=false;
let profileDragState={widgetId:null,preview:null};
const DEFAULT_PROFILE_PAGE_LAYOUT={widgets:{'profile-card':{col:1,row:1,size:'4x2',enabled:true},bio:{col:1,row:3,size:'4x2',enabled:true},status:{col:1,row:5,size:'2x1',enabled:true},steam:{col:5,row:1,size:'2x2',enabled:true},leetify:{col:7,row:1,size:'2x2',enabled:true},refrag:{col:9,row:1,size:'2x2',enabled:true},showcase:{col:5,row:3,size:'4x2',enabled:true},links:{col:7,row:5,size:'2x1',enabled:true},progress:{col:5,row:5,size:'2x2',enabled:true},achievements:{col:1,row:7,size:'4x2',enabled:true}}};
const ALLOWED_SIZES=new Set(['2x1','2x2','4x1','4x2','4x3','4x4','6x2','6x4']);
const WIDGET_STYLE_KEYS=['profile-card','bio','status','steam','leetify','refrag','links','progress','showcase','achievements'];
const DEBUG_PROFILE_BG = localStorage.getItem('grev_debug_profile_bg') === '1';
const HEX=/^#[0-9a-fA-F]{6}$/;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const escAttr=esc;
function safeImageUrl(value){const text=String(value||'').trim();return /^https?:\/\//i.test(text)?text:'';}
const safeBackgroundSize=v=>['cover','contain','repeat','stretch','center'].includes(String(v))?v:'cover';
function parseProfileWidgetSize(size){const [w,h]=String(size||'2x2').split('x').map(Number);return {w:w||2,h:h||2};}
function parseProfileLayout(raw){const out=JSON.parse(JSON.stringify(DEFAULT_PROFILE_PAGE_LAYOUT));try{const parsed=raw?JSON.parse(raw):{};for(const [k,v] of Object.entries(parsed.widgets||{})){if(!DEFAULT_PROFILE_PAGE_LAYOUT.widgets[k]||!v)continue;if(Number.isInteger(v.col)&&v.col>0)out.widgets[k].col=v.col;if(Number.isInteger(v.row)&&v.row>0)out.widgets[k].row=v.row;if(ALLOWED_SIZES.has(v.size))out.widgets[k].size=v.size;if(typeof v.enabled==='boolean')out.widgets[k].enabled=v.enabled;}}catch{}return out;}
function ensureProfileWidgetEntry(widgetId){if(!currentProfile.profileLayout.widgets[widgetId]&&DEFAULT_PROFILE_PAGE_LAYOUT.widgets[widgetId])currentProfile.profileLayout.widgets[widgetId]=JSON.parse(JSON.stringify(DEFAULT_PROFILE_PAGE_LAYOUT.widgets[widgetId]));return currentProfile.profileLayout.widgets[widgetId];}
function isProfileOwner(p=currentProfile){return Number(meId)>0&&Number(p?.id)>0&&Number(meId)===Number(p.id);}
function normalizeWidgetStyles(raw){if(!raw)return{};let p;try{p=typeof raw==='string'?JSON.parse(raw):raw;}catch{return{}}if(!p||typeof p!=='object'||Array.isArray(p))return{};const out={};for(const k of Object.keys(p)){if(!WIDGET_STYLE_KEYS.includes(k))continue;const v=p[k]||{};const o={};for(const n of ['backgroundColour','textColour','borderColour','accentColour']){const c=String(v[n]||'').trim();o[n]=c&&HEX.test(c)?c:'';}o.opacity=Math.min(100,Math.max(0,Number.isInteger(Number(v.opacity))?Number(v.opacity):0));o.blur=Math.min(20,Math.max(0,Number.isInteger(Number(v.blur))?Number(v.blur):0));out[k]=o;}return out;}
function hexToRgba(hex,opacity){if(!hex||!HEX.test(hex))return 'transparent';const n=hex.slice(1);const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);return `rgba(${r}, ${g}, ${b}, ${Math.max(0,Math.min(100,opacity))/100})`;}
function getWidgetStyle(id){const s=(currentProfile.widgetStyleMap||{})[id]||{};const vars=[];if(s.backgroundColour&&s.opacity>0){vars.push(`--profile-widget-bg:${hexToRgba(s.backgroundColour,s.opacity)}`);}else{vars.push(`--profile-widget-bg:transparent`);}if(s.textColour)vars.push(`--profile-widget-text:${s.textColour}`);if(s.borderColour)vars.push(`--profile-widget-border:${s.borderColour}`);if(s.accentColour)vars.push(`--profile-widget-accent:${s.accentColour}`);vars.push(`--profile-widget-blur:${Math.max(0,s.blur||0)}px`);return vars.join(';');}
function widgetEnabledByData(id,p){if(id==='bio')return !!(p.bio||p.location||p.website_url);if(id==='status')return !!p.status_message;if(id==='steam')return !!p.steam_url;if(id==='leetify')return !!(p.leetify_profile_url||p.leetify_url);if(id==='showcase')return Array.isArray(p.showcase)&&p.showcase.some(s=>s?.unlock);if(id==='achievements')return Number(p.achievements?.count||0)>0;if(id==='refrag')return !!(p.refrag_profile_url||p.refrag_url);if(id==='links')return !!(p.website_url||p.steam_url||p.leetify_profile_url||p.leetify_url||p.refrag_profile_url||p.refrag_url);return true;}
function ownerEmpty(text){return `<p class='profile-widget-empty'>${esc(text)}</p>`;}
function createWidget(id,p){const own=isProfileOwner(p);if(id==='profile-card'){let card='<div>Profile Card unavailable.</div>';try{card=window.renderPlayerCard?window.renderPlayerCard({...p},{variant:'full',showXp:true,useCardSettings:true,showMissingIntegrationPlaceholders:own,link:false}):card;}catch{}return `<div class='profile-widget-card'>${card}</div>`;}if(id==='bio')return `<div class='profile-widget-bio'><h3>Bio</h3><div>${esc(p.profile_title||'')}</div><div>${esc(p.location||'')}</div><p>${esc(p.bio||(own?'No bio set. Add one in Edit Profile.':''))}</p></div>`;if(id==='status')return `<div class='profile-widget-status'><h3>Status</h3><div>${esc(p.status_message||(own?'No status set. Add one in Edit Profile.':''))}</div></div>`;if(id==='links'){const links=[p.website_url?`<a href='${esc(p.website_url)}' target='_blank' rel='noopener'>Website</a>`:'',p.steam_url?`<a href='${esc(p.steam_url)}' target='_blank' rel='noopener'>Steam</a>`:'',(p.leetify_profile_url||p.leetify_url)?`<a href='${esc(p.leetify_profile_url||p.leetify_url)}' target='_blank' rel='noopener'>Leetify</a>`:'',(p.refrag_profile_url||p.refrag_url)?`<a href='${esc(p.refrag_profile_url||p.refrag_url)}' target='_blank' rel='noopener'>Refrag</a>`:''].filter(Boolean);return `<div class='profile-widget-links'><h3>Links</h3>${links.length?links.join('<br>'):ownerEmpty('No links set. Add them in Edit Profile.')}</div>`;}if(id==='progress')return `<div><h3>Level / Rank / XP</h3><div>Level ${esc(p.accountLevel||1)}</div><div>${esc(p.rank?.label||p.rank?.name||'Rank unavailable')}</div><div>${esc(p.accountXpCurrent||0)}/${esc(p.accountXpRequired||100)} XP</div></div>`;if(id==='showcase'){const items=(p.showcase||[]).filter(s=>s.unlock).map(s=>esc(s.unlock.name));return `<div class='profile-widget-showcase'><h3>Showcase</h3><div>${items.length?items.join(', '):(own?'No showcase items.':'')}</div></div>`;}if(id==='achievements'){const a=p.achievements||{};const latest=Array.isArray(a.latest)?a.latest:[];return `<div class='profile-widget-achievements'><h3>Achievements</h3><div>${Number(a.count||0)} unlocked · ${Number(a.xpFromAchievements||0)} XP earned</div><ul class='achievement-unlocked-list'>${latest.map(x=>`<li><strong>${esc(x.title||x.achievement_key)}</strong> <span>+${Number(x.xp_awarded||0)} XP</span></li>`).join('')||(own?'<li>No achievements yet.</li>':'')}</ul></div>`;}if(id==='steam')return `<div class='profile-widget-steam'><h3>Steam Profile</h3><div id='steam-widget-body'>${p.steam_url?'Loading…':(own?'No Steam profile link set. Add one in Edit Profile.':'')}</div></div>`;if(id==='leetify'){const leetifyUrl=p.leetify_profile_url||p.leetify_url||'';const link=leetifyUrl?`<a href='${esc(leetifyUrl)}' target='_blank' rel='noopener'>View on Leetify</a>`:(own?'No Leetify profile link set. Add one in Edit Profile.':'');return `<div class='profile-widget-leetify'><h3>Leetify</h3><div id='leetify-widget-body'>${link}${leetifyUrl?'<div>Loading Leetify stats...</div>':''}</div></div>`;}if(id==='refrag'){const refragUrl=p.refrag_profile_url||p.refrag_url||'';const stats=[['Rating',p.manual_refrag_rating],['Counter-strafe %',p.manual_refrag_counter_strafe_pct],['Reaction Time',p.manual_refrag_reaction_time],['TTD',p.manual_refrag_ttd],['Crosshair Drift',p.manual_refrag_crosshair_drift],['Last Updated At',p.manual_refrag_last_updated_at]].filter(([,v])=>String(v||'').trim());return `<div class='profile-widget-refrag'><h3>Refrag</h3>${refragUrl?`<p>Refrag profile linked.</p><a href='${esc(refragUrl)}' target='_blank' rel='noopener'>View on Refrag</a>`:(own?'<p>No Refrag profile link set. Add one in Edit Profile.</p>':'')}<h4>Manual Refrag stats</h4><p>Not automatically fetched</p>${stats.length?`<dl>${stats.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`:(own?'<p>Manual stats not filled in yet.</p>':'')}</div>`;}return '<div>Widget unavailable.</div>';}
function scheduleIdle(fn){ if ('requestIdleCallback' in window) requestIdleCallback(fn,{timeout:2000}); else setTimeout(fn,250); }
function renderProfileTilePositions(profileLayout,p){const board=document.getElementById('profile-page-board');board.innerHTML='';const own=isProfileOwner(p);for(const [id,entry] of Object.entries(profileLayout.widgets)){const shouldShow=entry.enabled&&(widgetEnabledByData(id,p)||own);if(!shouldShow)continue;const {w,h}=parseProfileWidgetSize(entry.size);const tile=document.createElement('article');tile.className=`profile-page-tile profile-widget-${id}`;tile.dataset.widgetId=id;tile.style.gridColumn=`${entry.col} / span ${w}`;tile.style.gridRow=`${entry.row} / span ${h}`;tile.style.cssText+=`;${getWidgetStyle(id)}`;tile.innerHTML=`${createWidget(id,p)}<div class='profile-page-edit-controls'><button type='button' class='profile-tile-drag-handle' data-profile-drag='${id}'>Move</button><button onclick="moveProfileWidget('${id}','left')">←</button><button onclick="moveProfileWidget('${id}','right')">→</button><button onclick="moveProfileWidget('${id}','up')">↑</button><button onclick="moveProfileWidget('${id}','down')">↓</button><select onchange="resizeProfileWidget('${id}',this.value)">${[...ALLOWED_SIZES].map(s=>`<option ${s===entry.size?'selected':''}>${s}</option>`).join('')}</select></div>`;board.append(tile);}initProfileTileDragging();scheduleIdle(()=>loadIntegrationWidgets(p));}

function getProfileBoardColumnCount(){const board=document.getElementById('profile-page-board');if(!board)return 12;const cols=getComputedStyle(board).gridTemplateColumns.split(' ').filter(Boolean).length;return Math.max(1,cols||12);}
function getProfileGridCellFromPointer(event){const board=document.getElementById('profile-page-board');if(!board)return{col:1,row:1};const rect=board.getBoundingClientRect();const styles=getComputedStyle(board);const cols=getProfileBoardColumnCount();const colGap=parseFloat(styles.columnGap)||0;const rowGap=parseFloat(styles.rowGap)||0;const colWidth=(rect.width-(cols-1)*colGap)/cols;const rowHeight=parseFloat(styles.gridAutoRows)||86;const x=Math.max(0,event.clientX-rect.left);const y=Math.max(0,event.clientY-rect.top);const col=Math.max(1,Math.min(cols,Math.floor(x/(colWidth+colGap))+1));const row=Math.max(1,Math.floor(y/(rowHeight+rowGap))+1);return{col,row};}
function ensureProfileDropPreview(){const board=document.getElementById('profile-page-board');if(!board)return null;let preview=board.querySelector('.profile-drop-preview');if(!preview){preview=document.createElement('div');preview.className='profile-drop-preview';preview.hidden=true;board.append(preview);}return preview;}
function handleProfileTileDragStart(event){if(!profileEditMode||!currentProfile||meId!==currentProfile.id)return;const handle=event.target.closest('.profile-tile-drag-handle');if(!handle)return;const widgetId=handle.dataset.profileDrag;const tile=handle.closest('.profile-page-tile');const entry=currentProfile.profileLayout.widgets[widgetId];if(!tile||!entry)return;event.preventDefault();profileDragState={widgetId,preview:ensureProfileDropPreview()};tile.classList.add('is-dragging');handleProfileTileDragOver(event);const move=(e)=>handleProfileTileDragOver(e);const up=(e)=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);handleProfileTileDrop(e);tile.classList.remove('is-dragging');};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);}
function handleProfileTileDragOver(event){if(!profileDragState.widgetId||!profileDragState.preview)return;const entry=currentProfile?.profileLayout?.widgets?.[profileDragState.widgetId];if(!entry)return;const target=getProfileGridCellFromPointer(event);const {w,h}=parseProfileWidgetSize(entry.size);profileDragState.preview.hidden=false;profileDragState.preview.style.gridColumn=`${target.col} / span ${w}`;profileDragState.preview.style.gridRow=`${target.row} / span ${h}`;}
function handleProfileTileDrop(event){const widgetId=profileDragState.widgetId;const preview=profileDragState.preview;if(preview)preview.hidden=true;if(!profileEditMode||!widgetId||!currentProfile?.profileLayout?.widgets?.[widgetId]){profileDragState={widgetId:null,preview:null};return;}const target=getProfileGridCellFromPointer(event);const entry=currentProfile.profileLayout.widgets[widgetId];const {w}=parseProfileWidgetSize(entry.size);entry.col=Math.max(1,Math.min(getProfileBoardColumnCount(),target.col));if(entry.col+w-1>getProfileBoardColumnCount())entry.col=Math.max(1,getProfileBoardColumnCount()-w+1);entry.row=Math.max(1,target.row);profileDragState={widgetId:null,preview:null};renderProfileTilePositions(currentProfile.profileLayout,currentProfile);document.getElementById('profile-page-board')?.classList.toggle('profile-page-editing',profileEditMode);const status=document.getElementById('profile-status');if(status)status.textContent='Layout changed. Click Done Moving to save.';}
function initProfileTileDragging(){const board=document.getElementById('profile-page-board');if(!board||board.dataset.profileDraggingBound==='1')return;board.dataset.profileDraggingBound='1';board.addEventListener('pointerdown',handleProfileTileDragStart);}
function restoreProfileEditModeClass(){document.getElementById('profile-page-board')?.classList.toggle('profile-page-editing',profileEditMode);}
function moveProfileWidget(widgetId,d){const e=currentProfile.profileLayout.widgets[widgetId];if(!e)return;if(d==='left')e.col=Math.max(1,e.col-1);if(d==='right')e.col=Math.min(12,e.col+1);if(d==='up')e.row=Math.max(1,e.row-1);if(d==='down')e.row=Math.max(1,e.row+1);renderProfileTilePositions(currentProfile.profileLayout,currentProfile);restoreProfileEditModeClass();}
function resizeProfileWidget(widgetId,size){if(!ALLOWED_SIZES.has(size))return;currentProfile.profileLayout.widgets[widgetId].size=size;renderProfileTilePositions(currentProfile.profileLayout,currentProfile);restoreProfileEditModeClass();}
const PROFILE_WIDGET_LIBRARY={Main:[['profile-card','Profile Card','Your configured Profile Card.'],['bio','Bio','Profile title, location, website, and bio.'],['status','Status','Your status message.']],Connections:[['steam','Steam','Steam profile and public integration data.'],['leetify','Leetify','Leetify profile link and public stats.'],['refrag','Refrag','Refrag link and manually entered stats.'],['links','Links','Website and connected profile links.']],Progress:[['progress','Level / Rank / XP','grev.dad level, rank, and XP progress.'],['achievements','Achievements','Unlocked achievements and achievement XP.']],Collection:[['showcase','Showcase','Selected showcase items.']]};
function createProfileEditControls(p){const own=isProfileOwner(p);const toolbar=document.getElementById('profile-toolbar');if(!own){toolbar.innerHTML='';closeProfileCustomiseSidebar();return;}toolbar.innerHTML=`<div class='page-quick-tabs-wrap profile-top-tabs-wrap'><div class='page-quick-tabs profile-top-tabs'><button class='page-quick-tab' id='toggle-profile-customise' type='button'>Add Tiles</button><button class='page-quick-tab' id='toggle-move-tiles' type='button'>Move Tiles</button><a class='page-quick-tab' href='/profile-edit.html'>Edit Profile</a><a class='page-quick-tab' href='/profile-card-edit.html'>Edit Profile Card</a></div></div>`;const toggleBtn=document.getElementById('toggle-move-tiles');toggleBtn.onclick=async()=>{if(!profileEditMode){profileEditMode=true;closeProfileCustomiseSidebar();document.getElementById('profile-page-board').classList.add('profile-page-editing');toggleBtn.textContent='Done Moving';toggleBtn.classList.add('active');return;}await saveProfilePageLayout();profileEditMode=false;document.getElementById('profile-page-board').classList.remove('profile-page-editing');toggleBtn.textContent='Move Tiles';toggleBtn.classList.remove('active');};document.getElementById('toggle-profile-customise').onclick=()=>{if(profileEditMode)toggleBtn.click();toggleProfileCustomiseSidebar();};renderProfileWidgetLibrary();}
function closeProfileCustomiseSidebar(){profileCustomiseOpen=false;const sidebar=document.getElementById('profile-customise-sidebar');if(sidebar)sidebar.hidden=true;}
function toggleProfileCustomiseSidebar(){profileCustomiseOpen=!profileCustomiseOpen;const sidebar=document.getElementById('profile-customise-sidebar');if(sidebar)sidebar.hidden=!profileCustomiseOpen;renderProfileWidgetLibrary();}
function widgetLibraryStatus(id){ensureProfileWidgetEntry(id);if(currentProfile.profileLayout.widgets[id].enabled)return 'Visible';return widgetEnabledByData(id,currentProfile)?'Hidden':'No data yet';}
function renderProfileWidgetLibrary(){const sidebar=document.getElementById('profile-customise-sidebar');const host=document.getElementById('profile-widget-library');if(!sidebar||!host||!currentProfile)return;sidebar.hidden=!profileCustomiseOpen;host.innerHTML=Object.entries(PROFILE_WIDGET_LIBRARY).map(([group,items])=>`<section class='profile-widget-library-group'><h3>${group}</h3>${items.map(([id,name,desc])=>{const entry=ensureProfileWidgetEntry(id);const enabled=!!entry.enabled;return `<div class='profile-widget-library-row' data-widget='${id}'><strong>${name}</strong><span class='muted'>${desc}</span><div class='profile-widget-library-actions'><span>${widgetLibraryStatus(id)}</span><button type='button' class='button-secondary' data-toggle-profile-widget='${id}'>${enabled?'Hide':'Show'}</button></div></div>`;}).join('')}</section>`).join('');host.querySelectorAll('[data-toggle-profile-widget]').forEach((btn)=>{btn.onclick=()=>{const entry=ensureProfileWidgetEntry(btn.dataset.toggleProfileWidget);entry.enabled=!entry.enabled;renderProfileTilePositions(currentProfile.profileLayout,currentProfile);renderProfileWidgetLibrary();};});const save=document.getElementById('save-profile-customisation');if(save)save.onclick=saveProfilePageLayout;const close=document.getElementById('close-profile-customise');if(close)close.onclick=closeProfileCustomiseSidebar;}
function buildPanel(p){renderProfileWidgetLibrary();}
async function saveProfilePageLayout(){const body={profile_page_background_url:currentProfile.profile_page_background_url||'',profile_page_background_colour:currentProfile.profile_page_background_colour||'',profile_page_background_size:currentProfile.profile_page_background_size||'cover',profile_page_overlay_strength:Number(currentProfile.profile_page_overlay_strength||20),profile_page_tile_layout_json:JSON.stringify(currentProfile.profileLayout),profile_page_widget_settings_json:currentProfile.profile_page_widget_settings_json||JSON.stringify(currentProfile.widgetStyleMap||{})};const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...currentProfile,...body})});let d={};try{d=await r.json();}catch{}document.getElementById('profile-status').textContent=r.ok?'Layout saved.':'Save failed.';if(r.ok&&d?.achievementsAwarded?.length)showAchievementToast(d.achievementsAwarded);}
async function loadIntegrationWidgets(p){
  const userId=Number(p?.id);
  if(!userId)return;
  const jobs=[];
  const steamWidget=currentProfile?.profileLayout?.widgets?.steam;
  const leetifyWidget=currentProfile?.profileLayout?.widgets?.leetify;
  if(p.steam_url&&steamWidget?.enabled!==false&&document.getElementById('steam-widget-body'))jobs.push(loadSteamWidget(userId));
  if((p.leetify_profile_url||p.leetify_url)&&leetifyWidget?.enabled!==false&&document.getElementById('leetify-widget-body'))jobs.push(loadLeetifyWidget(userId));
  await Promise.allSettled(jobs);
}
async function loadSteamWidget(userId){
  const body=document.getElementById('steam-widget-body');
  if(!body)return;
  try{
    const url=`/api/integrations/steam/profile?user_id=${encodeURIComponent(userId)}`;
    const res=window.GREVApi?.fetchJsonCached
      ? await window.GREVApi.fetchJsonCached(url,{ttlMs:10*60*1000,cacheKey:`grev_api_cache:${url}`})
      : {data:await fetch(url).then((r)=>r.json())};
    const data=res.data||{};
    const steam=data.steam||data;
    if(!steam.available){
      body.innerHTML=`<p>${esc(steam.message||'Steam data unavailable.')}</p>`;
      return;
    }
    const steamAvatar=steam.avatarfull||steam.avatarFull||steam.avatarmedium||steam.avatarMedium||steam.avatar||steam.avatarIcon||'';
    const avatarUrl=safeImageUrl(steamAvatar);
    body.innerHTML=`
      <div class="integration-profile integration-steam-profile">
        ${avatarUrl?`<img class="integration-avatar steam-avatar" src="${escAttr(avatarUrl)}" alt="Steam avatar" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
        <div>
          <strong>${esc(steam.personaname||steam.steamID||'Steam Profile')}</strong>
          ${steam.onlineState?`<div>State: ${esc(steam.onlineState)}</div>`:''}
          ${steam.visibilityState?`<div>Visibility: ${esc(steam.visibilityState)}</div>`:''}
          ${steam.memberSince?`<div>Member since: ${esc(steam.memberSince)}</div>`:''}
          ${steam.steamLevel!=null ? `
            <div class="steam-level-badge" title="Steam Level">
              <span class="steam-level-ring">
                <span class="steam-level-number">${esc(steam.steamLevel)}</span>
              </span>
              <span class="steam-level-label">Steam Level</span>
            </div>
          ` : `
            <div class="steam-level-unavailable">
              Steam level unavailable${steam.steamLevelUnavailableReason ? ` — ${esc(steam.steamLevelUnavailableReason)}` : ''}
            </div>
          `}
          ${steam.steamLevelSource?`<small>Source: ${esc(steam.steamLevelSource === 'public-profile-html' ? 'public profile' : 'Steam API')}</small>`:''}
          ${steam.profileUrl?`<a href="${escAttr(steam.profileUrl)}" target="_blank" rel="noopener">Open Steam profile</a>`:''}
        </div>
      </div>
    `;
  }catch(error){
    console.error('[profile] Steam widget failed',error);
    body.textContent='Steam data unavailable.';
  }
}
function renderLeetifyMapRanks(value){
  if(!value)return '';
  const items=Array.isArray(value)?value.map((x)=>typeof x==='string'?x:`${x.mapName||x.map||x.name||'Map'}: ${x.rank||x.csRank||x.value||''}`):typeof value==='object'?Object.entries(value).map(([k,v])=>`${k}: ${typeof v==='object'?(v.rank||v.csRank||v.value||''):v}`):[String(value)];
  return items.filter(Boolean).map((x)=>`<li>${esc(x)}</li>`).join('');
}
function renderLeetifyMatches(matches){
  if(!Array.isArray(matches)||!matches.length)return '';
  return matches.map((m)=>{const label=m.mapName||m.map||m.id||m.matchId||'Match';const bits=[m.result,m.score,m.finishedAt||m.date||m.createdAt].filter(Boolean);return `<li><strong>${esc(label)}</strong>${bits.length?` <span>${esc(bits.join(' · '))}</span>`:''}</li>`;}).join('');
}
function renderLeetifyDebugAttempts(attempts,parsed){
  if(localStorage.getItem('grev_debug_integrations')!=='1'||!Array.isArray(attempts))return '';
  const parsedBlock=parsed?`<pre>${esc(JSON.stringify(parsed,null,2))}</pre>`:'';
  const rows=attempts.map((a)=>`<li><strong>${esc(a.kind||'candidate')}: ${esc(a.candidate||'')}</strong><br><code>${esc(a.endpoint||'')}</code><br><span>Status: ${esc(a.status??'n/a')} · ${esc(a.ok?'ok':'not ok')}${a.reason?` · ${esc(a.reason)}`:''}</span>${a.responseKeys?`<br><small>Keys: ${esc(a.responseKeys.join(', '))}</small>`:''}${a.topLevelPreview?`<pre>${esc(JSON.stringify(a.topLevelPreview,null,2))}</pre>`:''}${a.bodyPreview?`<details><summary>Body preview</summary><pre>${esc(a.bodyPreview)}</pre></details>`:''}</li>`).join('');
  return `<details class="integration-debug" open><summary>Leetify API attempts</summary>${parsedBlock}<ul>${rows||'<li>No attempts returned.</li>'}</ul></details>`;
}
async function loadLeetifyWidget(userId){
  const body=document.getElementById('leetify-widget-body');
  if(!body)return;
  const savedUrl=currentProfile?.leetify_profile_url||currentProfile?.leetify_url||'';
  const savedLink=savedUrl?`<p class="leetify-saved-link">Saved Leetify link: <a href="${escAttr(savedUrl)}" target="_blank" rel="noopener noreferrer">${esc(savedUrl)}</a></p>`:'';
  const savedViewLink=savedUrl?`<a href="${escAttr(savedUrl)}" target="_blank" rel="noopener noreferrer">View on Leetify</a>`:'';
  try{
    body.innerHTML=`${savedLink}${savedViewLink}<div class="leetify-widget-loading">Loading Leetify stats...</div>`;
    const debug=localStorage.getItem('grev_debug_integrations')==='1';
    const url=`/api/integrations/leetify/profile?user_id=${encodeURIComponent(userId)}${debug?'&debug=1':''}`;
    const fetchOptions=debug?{headers:{'x-grev-debug-integrations':'1'}}:{};
    const res=window.GREVApi?.fetchJsonCached
      ? await window.GREVApi.fetchJsonCached(url,{ttlMs:10*60*1000,cacheKey:`grev_api_cache:${url}`,...fetchOptions})
      : {data:await fetch(url,fetchOptions).then((r)=>r.json())};
    const data=res.data||{};
    const viewUrl=data.viewUrl||data.profileUrl||savedUrl;
    const viewLink=viewUrl?`<a href="${escAttr(viewUrl)}" target="_blank" rel="noopener noreferrer">View on Leetify</a>`:savedViewLink;
    const debugDetails=renderLeetifyDebugAttempts(data.attempts,data.parsed);
    if(!data.available){
      const message=data.reason||'Leetify Public API did not return usable data for this profile. The profile page can still be public on Leetify.com, but grev.dad only uses the official Public API and does not scrape Leetify pages.';
      body.innerHTML=`
        ${savedLink}
        ${viewLink}
        <p>${esc(message)}</p>
        ${data.reason&&data.reason!==message?`<p>${esc(data.reason)}</p>`:''}
        ${debugDetails}
      `;
      currentProfile.leetifyData=data;
      updateProfileCardWidgetWithLeetifyData();
      return;
    }
    const stats=[['Steam ID',data.steamId64],['CS Rank',data.csRank||data.rank],['CS Rank Type',data.csRankType],['CS Premier Rating',data.csPremierRating],['Leetify Rating',data.leetifyRating],['Aim Rating',data.aimRating],['Positioning Rating',data.positioningRating],['Utility Rating',data.utilityRating],['Clutch Rating',data.clutchRating],['Opening Duel Rating',data.openingDuelRating],['Recent Matches Count',data.recentMatchesCount],['Updated',data.rawUpdatedAt||data.updatedAt],['Cache',data.cache?`${data.cache.hit?'hit':'miss'}${data.cache.ttlSeconds!=null?` · ${data.cache.ttlSeconds}s`:''}`:'']].filter(([,v])=>v!==undefined&&v!==null&&String(v).trim()!=='');
    const mapRanks=renderLeetifyMapRanks(data.csCompetitiveRanks);
    const matches=renderLeetifyMatches(data.recentMatches);
    body.innerHTML=`
      <div class="integration-profile integration-leetify-profile leetify-integration-panel">
        ${data.avatarUrl?`<img class="integration-avatar leetify-avatar" src="${escAttr(data.avatarUrl)}" alt="Leetify avatar" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
        <div>
          ${savedLink}
          <strong>${esc(data.nickname||data.name||'Leetify Profile')}</strong>
          <div class="leetify-stat-grid">${stats.map(([k,v])=>`<div class="leetify-stat"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</div>
          ${matches?`<h4>Recent Matches</h4><ul class="leetify-match-list">${matches}</ul>`:''}
          ${mapRanks?`<h4>Competitive Map Ranks</h4><ul class="leetify-map-rank-list">${mapRanks}</ul>`:''}
          <div class="leetify-attribution"><small>${esc(data.attribution||'Data Provided by Leetify')}</small>${viewLink}</div>
          ${debugDetails}
        </div>
      </div>
    `;
    currentProfile.leetifyData=data;
    updateProfileCardWidgetWithLeetifyData();
  }catch(error){
    console.error('[profile] Leetify widget failed',error);
    body.innerHTML=`${savedLink}${savedViewLink}<p>Leetify API data unavailable.</p>`;
  }
}
function updateProfileCardWidgetWithLeetifyData(){
  const tile=document.querySelector('.profile-widget-profile-card');
  if(!tile||!currentProfile||!window.renderPlayerCard)return;
  const card=window.renderPlayerCard({...currentProfile},{variant:'full',showXp:true,useCardSettings:true,showMissingIntegrationPlaceholders:isProfileOwner(currentProfile),link:false});
  const host=tile.querySelector('.profile-widget-card');
  if(host)host.innerHTML=card;
}

function render(p){p={...p,leetify_profile_url:p.leetify_profile_url||p.leetify_url||'',leetify_url:p.leetify_profile_url||p.leetify_url||'',refrag_profile_url:p.refrag_profile_url||p.refrag_url||'',refrag_url:p.refrag_profile_url||p.refrag_url||''};currentProfile=p;currentProfile.profileLayout=parseProfileLayout(p.profile_page_tile_layout_json);currentProfile.widgetStyleMap=normalizeWidgetStyles(p.profile_page_widget_settings_json);const bgMode=safeBackgroundSize(p.profile_page_background_size||'cover');const bgUrl=String(p.profile_page_background_url||'').trim();const bgColour=String(p.profile_page_background_colour||'').trim();const overlayRaw=Number(p.profile_page_overlay_strength??20);const overlay=Math.min(80,Math.max(0,Number.isFinite(overlayRaw)?overlayRaw:20));if(DEBUG_PROFILE_BG){console.debug('[profile:bg]',{profile_page_background_url:p.profile_page_background_url,profile_page_background_colour:p.profile_page_background_colour,profile_page_background_size:p.profile_page_background_size,profile_page_overlay_strength:p.profile_page_overlay_strength});}const shell=document.createElement('section');shell.className='profile-page-custom-shell';shell.style.setProperty('--profile-overlay',bgUrl?String(overlay/100):'0');shell.style.setProperty('--profile-page-bg-colour',bgColour||'transparent');if(bgUrl){shell.style.setProperty('--profile-page-bg-image',`url("${bgUrl.replace(/"/g,'%22')}")`);}else{shell.style.setProperty('--profile-page-bg-image','none');}if(bgMode==='stretch'){shell.style.setProperty('--profile-page-bg-size','100% 100%');shell.style.setProperty('--profile-page-bg-repeat','no-repeat');shell.style.setProperty('--profile-page-bg-position','center top');}else if(bgMode==='repeat'){shell.style.setProperty('--profile-page-bg-size','auto');shell.style.setProperty('--profile-page-bg-repeat','repeat');shell.style.setProperty('--profile-page-bg-position','center top');}else if(bgMode==='center'){shell.style.setProperty('--profile-page-bg-size','auto');shell.style.setProperty('--profile-page-bg-repeat','no-repeat');shell.style.setProperty('--profile-page-bg-position','center center');}else{shell.style.setProperty('--profile-page-bg-size',bgMode);shell.style.setProperty('--profile-page-bg-repeat','no-repeat');shell.style.setProperty('--profile-page-bg-position','center top');}shell.innerHTML=`${p.banner_url?`<section class='profile-page-banner profile-banner-size-${esc(p.banner_display_size||'wide')}' style='background-image:url("${esc(p.banner_url)}")'></section>`:''}<div class='profile-page-board-wrap'><section id='profile-page-board' class='profile-page-board'></section></div><aside id='profile-layout-panel' class='profile-layout-panel' hidden></aside><aside id='profile-customise-sidebar' class='profile-customise-sidebar' hidden><div class='profile-customise-header'><h2>Add Tiles</h2><button id='close-profile-customise' type='button'>Close</button></div><div id='profile-widget-library'></div><button id='save-profile-customisation' class='nav-button' type='button'>Save Profile Customisation</button></aside>${p.profile_footer_url?`<section class='profile-page-footer-media profile-footer-size-${esc(p.profile_footer_display_size||'wide')}' style='background-image:url("${esc(p.profile_footer_url)}")'></section>`:''}`;const v=document.getElementById('profile-view');v.innerHTML='';v.append(shell);renderProfileTilePositions(currentProfile.profileLayout,p);createProfileEditControls(p);buildPanel(p);}
async function load(){const statusEl=document.getElementById('profile-status');const id=new URLSearchParams(location.search).get('id');const bootstrapUrl=id?`/api/bootstrap/profile?id=${encodeURIComponent(id)}`:'/api/bootstrap/profile';try{const boot=window.GREVApi?.fetchJsonCached?await window.GREVApi.fetchJsonCached(bootstrapUrl,{ttlMs:30000,cacheKey:`grev_api_cache:${bootstrapUrl}`}):{data:await fetch(bootstrapUrl).then(r=>r.json())};if(boot?.data?.ok){meId=boot.data?.viewer?.id||null;render(boot.data.profile||{});createProfileEditControls(currentProfile||{});statusEl.textContent='Loaded.';return;}}catch(e){console.warn('[profile] bootstrap failed, falling back',e);}const authPromise=(window.GREVApi?.fetchJsonCached?window.GREVApi.fetchJsonCached('/api/auth/me',{ttlMs:15000,cacheKey:'grev_api_cache:/api/auth/me'}).then(x=>x.data):fetch('/api/auth/me').then(r=>r.json())).catch(()=>null);const profileUrl=id?`/api/profile?id=${encodeURIComponent(id)}`:'/api/profile/me';const profilePromise=(window.GREVApi?.fetchJsonCached?window.GREVApi.fetchJsonCached(profileUrl,{ttlMs:60000,cacheKey:`grev_api_cache:${profileUrl}`}).then(x=>x.data):fetch(profileUrl).then(r=>r.json()));const [authResult, profileResult]=await Promise.allSettled([authPromise,profilePromise]);if(profileResult.status!=='fulfilled'||!profileResult.value?.ok){statusEl.textContent=profileResult.value?.error||'Load failed';return;}if(authResult.status==='fulfilled')meId=authResult.value?.user?.id||null;render(profileResult.value.profile||{});statusEl.textContent='Loaded.';if(authResult.status==='fulfilled')createProfileEditControls(currentProfile||{});}load();
