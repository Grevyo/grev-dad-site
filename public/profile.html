<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Grev - Profile</title><link rel="stylesheet" href="/styles.css" /></head><body>
<header class="site-header"><a class="site-brand" href="/"><img class="site-logo" src="/grev.dad.logo.png" alt="Grev" /></a><nav id="authStatus" class="site-nav">Checking login...</nav></header>
<main><h1>Profile</h1><p id="profile-status">Loading profile...</p><div id="profile-view"></div><section id="profile-edit" hidden><h2>Edit Profile</h2><form id="edit-form" class="profile-edit-form"><label>Display Name<input name="display_name" /></label><label>Profile Title<input name="profile_title" maxlength="80" /></label><label>Bio<textarea name="bio" maxlength="500"></textarea></label><label>Location<input name="location" /></label><label>Favourite Colour<input name="favourite_colour" /></label><label>Avatar URL<input name="avatar_url" /></label><label>Banner URL<input name="banner_url" /></label><button type="submit">Save</button></form></section></main>
<script>
let currentProfile=null;let meId=null;
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function initials(name){const p=String(name||'?').trim().split(/\s+/);return (p[0]?.[0]||'?').toUpperCase()+((p[1]?.[0]||'').toUpperCase());}
function rankName(p){return p.rank?.name||'Unranked';}
function renderRankSelector(p){if(meId!==p.id)return '';const options=[`<option value="default" ${!p.selected_rank_id?'selected':''}>Default (${esc(p.defaultRank?.name||'Unranked')})</option>`].concat((p.unlockedRanks||[]).map(r=>`<option value="${esc(r.id)}" ${p.selected_rank_id===r.id?'selected':''}>${esc(r.name)} (Level ${r.level})</option>`));return `<div class='rank-selector'><label>Displayed Rank<select id='selected-rank-id'>${options.join('')}</select></label><button type='button' id='save-rank-btn'>Save Rank</button></div>`;}
function renderProfile(p){currentProfile=p;const v=document.getElementById('profile-view');const own=meId===p.id;const avatar=p.avatar_url?`<img class='profile-avatar' src='${esc(p.avatar_url)}' alt='avatar'/>`:`<div class='profile-avatar profile-avatar-fallback'>${initials(p.display_name||p.username)}</div>`;const banner=p.banner_url?`<img class='profile-banner' src='${esc(p.banner_url)}' alt='banner'/>`:'';v.innerHTML=`${banner}<div class='profile-top-box'>${avatar}<div class='profile-identity'><div class='profile-display-name'>${esc(p.display_name||p.username)}</div><div class='profile-username'>@${esc(p.username)}</div><div class='account-level'>Level ${p.accountLevel}</div><div class='account-rank'>Rank: ${esc(rankName(p))}</div><div>XP: ${p.accountXpCurrent} / ${p.accountXpRequired}</div><div class='xp-bar'><div class='xp-bar-fill' style='width:${p.accountXpPercent}%;'></div></div></div></div><div class='profile-actions'>${own?`<a class='account-settings-link nav-button' href='/account.html'>Account Settings</a>`:''}</div>${renderRankSelector(p)}<section><h2>Details</h2><p>${esc(p.roleLabel||p.role)}${p.profile_title?` • ${esc(p.profile_title)}`:''}</p>${p.location?`<p>${esc(p.location)}</p>`:''}${p.bio?`<p>${esc(p.bio)}</p>`:''}</section>`;
const edit=document.getElementById('profile-edit');edit.hidden=!own;if(own){const f=document.getElementById('edit-form');['display_name','profile_title','bio','location','favourite_colour','avatar_url','banner_url'].forEach(k=>f.elements[k].value=p[k]||'');const saveRank=document.getElementById('save-rank-btn');if(saveRank)saveRank.onclick=saveRankChoice;}
}
async function saveRankChoice(){const s=document.getElementById('profile-status');const value=document.getElementById('selected-rank-id')?.value||'default';const r=await fetch('/api/profile/me/rank',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selected_rank_id:value})});const d=await r.json();if(!r.ok){s.textContent=d.error||'Failed to update rank';return;}s.textContent='Displayed rank updated.';renderProfile(d.profile);}
async function load(){const s=document.getElementById('profile-status');const params=new URLSearchParams(location.search);const id=params.get('id');const me=await (await fetch('/api/auth/me')).json();meId=me?.user?.id||null;const api=id?`/api/profile?id=${encodeURIComponent(id)}`:'/api/profile/me';const r=await fetch(api);const d=await r.json();if(!r.ok||!d.profile){s.textContent=d.error||'Load failed';return;}s.textContent='Profile loaded.';renderProfile(d.profile);} 
document.getElementById('edit-form').addEventListener('submit',async(e)=>{e.preventDefault();const s=document.getElementById('profile-status');const f=e.target;const body=Object.fromEntries(new FormData(f).entries());const r=await fetch('/api/profile/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){s.textContent=d.error||'Save failed';return;}s.textContent='Saved.';renderProfile(d.profile);});
load();
</script><script src="/scripts/theme.js"></script><script src="/scripts/auth-status.js"></script></body></html>
