<!doctype html>
<html>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Profile Card Editor</title>
  <link rel='stylesheet' href='/styles.css'>
</head>
<body class='profile-card-editor-page'>
  <header class='site-header'>
    <a class='site-brand' href='/'><img class='site-logo' src='/grev.dad.logo.png'/></a>
    <nav id='authStatus' class='site-nav'>Checking login...</nav>
  </header>
  <main>
    <h1>Profile Card Editor</h1>
    <div class='profile-actions'>
      <a class='nav-button' href='/profile-edit.html'>Edit Full Profile</a>
      <a class='nav-button' href='/profile.html'>Back to Profile</a>
    </div>
    <p id='card-status'>Loading...</p>
    <div class='profile-card-editor-grid'><section class='profile-card-preview'><h2>Card Preview</h2><div id='card-preview' class='profile-card-preview-frame'></div><div id='card-preview-notes' class='form-help'></div></section><section><h2>Card Images</h2><label>Card background image/GIF URL<input name='card_background_url' maxlength='500'></label></section><section><h2>Card Colours</h2><div class='card-colour-grid'><label>Background<input type='color' name='card_background_colour'></label><label>Accent<input type='color' name='card_accent_colour'></label><label>Name colour<input type='color' name='card_text_colour'></label><label>Body text colour<input type='color' name='card_body_text_colour'></label><label>Border<input type='color' name='card_border_colour'></label></div></section><section><h2>Card Layout</h2><select name='card_layout'><option>compact</option><option selected>standard</option><option>showcase</option></select></section><section class='card-display-options'><h2>Display Toggles</h2><label><input type='checkbox' name='card_show_avatar'> Show avatar</label><label><input type='checkbox' name='card_show_display_name'> Show display name</label><label><input type='checkbox' name='card_show_username'> Show username</label><label><input type='checkbox' name='card_show_user_id'> Show user ID</label><label><input type='checkbox' name='card_show_role'> Show role</label><label><input type='checkbox' name='card_show_level'> Show level</label><label><input type='checkbox' name='card_show_rank'> Show rank</label><label><input type='checkbox' name='card_show_xp'> Show XP</label><label><input type='checkbox' name='card_show_status'> Show status message from profile</label><label><input type='checkbox' name='card_show_steam'> Show Steam link from profile</label><label><input type='checkbox' name='card_show_leetify'> Show Leetify link from profile</label><p class='form-help'>Steam and Leetify links are edited on the full Edit Profile page.</p><a class='nav-button' href='/profile-edit.html'>Edit Profile Links</a></section></div><button id='save-card' class='nav-button'>Save Profile Card</button>
  </main>
  <script src='/scripts/player-card.js'></script><script>
const fields=['card_background_url','card_background_colour','card_accent_colour','card_text_colour','card_body_text_colour','card_border_colour','card_layout'];
const toggles=['card_show_avatar','card_show_display_name','card_show_username','card_show_user_id','card_show_role','card_show_level','card_show_rank','card_show_xp','card_show_status','card_show_steam','card_show_leetify'];
let profile={};
const saveButton=document.getElementById('save-card');
if(!saveButton) console.error('[profile-card-edit] Missing save button');
if(!document.getElementById('card-status')) console.error('[profile-card-edit] Missing status element');
function draw(){document.getElementById('card-preview').innerHTML=window.renderPlayerCard(profile,{useCardSettings:true});const notes=[];if(Number(profile.card_show_steam)===1&&!String(profile.steam_url||'').trim())notes.push('No Steam URL set on full profile.');if(Number(profile.card_show_leetify)===1&&!String(profile.leetify_url||'').trim())notes.push('No Leetify URL set on full profile.');document.getElementById('card-preview-notes').textContent=notes.join(' ');}
async function fetchJsonSafe(url, options = {}) { const response = await fetch(url, { credentials: 'same-origin', ...options }); const text = await response.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { throw new Error('Invalid response from server.'); } if (!response.ok || !data || data.ok === false) throw new Error(data?.error || `Request failed: ${response.status}`); return data; }
(async()=>{try{const d=await fetchJsonSafe('/api/profile/me'); profile=d.profile||{}; fields.forEach(k=>{const e=document.querySelector(`[name="${k}"]`); if(e)e.value=profile[k]||'';}); toggles.forEach(k=>{const e=document.querySelector(`[name="${k}"]`); if(e)e.checked=Number(profile[k]??1)===1;}); draw(); document.getElementById('card-status').textContent='Loaded.';}catch(error){if(error.message.includes('401')){location.href='/unregistered.html';return;}document.getElementById('card-status').textContent=error.message||'Failed to load profile card settings.';}})();
document.body.addEventListener('input',(e)=>{const n=e.target.name;if(!n)return;profile[n]=e.target.type==='checkbox'?(e.target.checked?1:0):e.target.value;draw();});
saveButton && (saveButton.onclick=async()=>{const btn=saveButton;const status=document.getElementById('card-status');btn.disabled=true;btn.textContent='Saving…';status.textContent='Saving…';try{const body={}; fields.forEach(k=>body[k]=document.querySelector(`[name="${k}"]`)?.value||''); toggles.forEach(k=>body[k]=document.querySelector(`[name="${k}"]`)?.checked?1:0); const d=await fetchJsonSafe('/api/profile/me/card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); profile=d.profile||profile; draw(); status.textContent='Profile card saved.';}catch(error){status.textContent=error.message||'Failed to save profile card.';}finally{btn.disabled=false;btn.textContent='Save Profile Card';}});
</script>
  <script src='/scripts/theme.js'></script>
  <script src='/scripts/auth-status.js'></script>
</body>
</html>
