name: Fix Custom Media Square Grid Anchor

on:
  pull_request:
    branches:
      - pbe
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/custom-media-buttons-square-grid' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-custom-media-square-grid-anchor.mjs
      - run: |
          node --check scripts/patch-custom-media-buttons-square-grid.mjs
          git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/patch-custom-media-buttons-square-grid.mjs
          git commit -m "Fix square-grid resize patch anchor"
          git push origin HEAD:${{ github.head_ref }}
