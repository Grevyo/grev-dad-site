name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grev-dad-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.LADMIN_BOOTSTRAP_PASSWORD }}
      LADMIN_TARGET_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm production branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Production deployments must run from main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Verify Grev Home contracts
        run: npm run verify:grev-home

      - name: Apply production database migrations
        run: npx wrangler d1 migrations apply grev-dad-production --remote --env production

      - name: Configure protected LADMIN account
        run: node scripts/bootstrap-ladmin.mjs

      # Cloud saves need this R2 bucket. This token may not be allowed to manage R2 (it needs
      # "Workers R2 Storage: Edit"), so failing to check or create it isn't fatal: the deploy
      # step still binds the bucket if it exists, and only drops cloud saves if it doesn't.
      - name: Ensure cloud save bucket exists
        shell: bash
        run: |
          if npx wrangler r2 bucket info grev-dad-saves >/dev/null 2>&1 || npx wrangler r2 bucket create grev-dad-saves; then
            echo "R2 bucket grev-dad-saves is ready."
          else
            echo "::notice::This API token can't check or create R2 buckets. The deploy will still bind grev-dad-saves if it already exists."
          fi

      - name: Deploy production
        run: bash scripts/deploy-worker.sh production grev-dad-saves

      - name: Verify LADMIN login end to end
        shell: bash
        run: |
          set -euo pipefail

          payload=$(node -e 'process.stdout.write(JSON.stringify({identifier:"LADMIN",password:process.env.LADMIN_BOOTSTRAP_PASSWORD,rememberMe:false}))')

          login_status=$(curl --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /tmp/ladmin-login.json \
            --write-out '%{http_code}' \
            --cookie-jar /tmp/ladmin.cookies \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            https://grev.dad/api/auth/login)

          cat /tmp/ladmin-login.json
          echo

          if [ "$login_status" != "200" ]; then
            echo "Production LADMIN login smoke test failed with HTTP $login_status."
            exit 1
          fi

          session_status=$(curl --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /tmp/ladmin-session.json \
            --write-out '%{http_code}' \
            --cookie /tmp/ladmin.cookies \
            https://grev.dad/api/auth/session)

          cat /tmp/ladmin-session.json
          echo

          if [ "$session_status" != "200" ]; then
            echo "Production LADMIN session smoke test failed with HTTP $session_status."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const session = JSON.parse(fs.readFileSync('/tmp/ladmin-session.json', 'utf8'));
          const user = session.user;
          if (!session.authenticated || !user || String(user.username).toLowerCase() !== 'ladmin' || !user.isOwner || !user.isAdmin) {
            console.error('Production LADMIN session did not return the required Owner and Administrator access.');
            process.exit(1);
          }
          console.log('Production LADMIN login and Owner/Admin session verified.');
          NODE

      - name: Verify the production site and v2 API
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/v2/session /api/v2/home /api/v2/profiles/me /api/v2/friends; do
            status=$(curl --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
              --output /tmp/v2.json --write-out '%{http_code}' --cookie /tmp/ladmin.cookies "https://grev.dad$path")
            if [ "$status" != "200" ] || ! node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/v2.json","utf8"));if(!d.ok)process.exit(1)'; then
              echo "$path failed with HTTP $status:"; cat /tmp/v2.json; exit 1
            fi
            echo "$path OK"
          done
          for path in /home /friends /grev-home /settings; do
            status=$(curl --silent --show-error --retry 3 --retry-delay 3 --output /tmp/page.html --write-out '%{http_code}' --cookie /tmp/ladmin.cookies "https://grev.dad$path")
            if [ "$status" != "200" ] || ! grep -q '/app/app.js' /tmp/page.html; then echo "$path did not serve the app page (HTTP $status)."; exit 1; fi
            echo "$path OK"
          done
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://grev.dad/home")
          if [ "$status" != "302" ]; then echo "Signed-out /home should redirect to login, got HTTP $status."; exit 1; fi

      - name: Verify deployed Grev Home connection API
        run: node scripts/smoke-grev-home-api.mjs https://grev.dad production
